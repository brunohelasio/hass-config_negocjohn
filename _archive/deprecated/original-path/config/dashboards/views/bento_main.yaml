icon: mdi:view-quilt
path: bento-lab
subview: false
theme: tablet
type: custom:grid-layout
card_mod:
  style: |
    hui-grid-layout {
      height: 100vh !important;
      width: 100%;
      max-width: 100vw;
      position: relative;
      isolation: isolate;
      background: linear-gradient(140deg, #07090d 0%, #111722 55%, #07090d 100%);
      padding-bottom: 8px;
      box-sizing: border-box;
      overflow-x: hidden;
    }

    hui-grid-layout > * {
      position: relative;
      z-index: 1;
    }
layout:
  margin: 0
  padding: 12px
  grid-gap: 10px
  grid-template-columns: 64px repeat(3, minmax(0, 1.15fr)) repeat(4, minmax(0, 1fr)) repeat(2, minmax(0, 0.84fr)) repeat(3, minmax(0, 1.22fr))
  # grid-template-columns: 64px repeat(9, minmax(0, 1fr)) repeat(3, minmax(0, 1.12fr))
  # grid-template-columns: 64px repeat(12, minmax(0, 1fr))
  # Composição reajustada:
  # - Sala mais larga
  # - Comodos proporcionalmente menor
  # - Midia mais larga para aproximar o bloco do formato quadrado
  # - Energia/Roborock reajustados proporcionalmente no miolo
  grid-template-rows: auto 40vh 16vh 24vh 74px
  grid-template-areas: |
    "sidebar top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges"
    "sidebar welcome welcome welcome welcome welcome sala sala comodos comodos comodos comodos comodos"
    "sidebar welcome welcome welcome welcome welcome energy energy energy energy media media media"
    "sidebar welcome welcome welcome welcome welcome roborock roborock roborock roborock media media media"
    "sidebar quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions"

  mediaquery:
    '(max-width: 800px)':
      padding: 8px
      grid-gap: 10px
      grid-template-columns: 1fr
      grid-template-rows: repeat(11, min-content)
      grid-template-areas: |
        "sidebar"
        "top_badges"
        "welcome"
        "sala"
        "office"
        "cameras"
        "energy"
        "calendar"
        "roborock"
        "media"
        "quick_actions"

cards:
  # Redirect mobile: detecta largura <= 800px e vai para /slug/mobile-casa.
  # REATIVADO 2026-05-11 — agora há reverse-redirect em mobile-casa.yaml
  # que envia sessões de desktop/tablet de volta para bento-lab se necessário.
  # Para desativar: comentar a linha abaixo.
  - !include main-grid/zz-mobile-redirect.yaml
  - !include main-grid/bento_hero_stage.yaml
  - !include main-grid/bento_sidebar.yaml
  - !include main-grid/bento_top_badges.yaml
  - !include main-grid/bento_welcome.yaml
  - !include main-grid/bento_sala.yaml
  - !include main-grid/bento_comodos.yaml
  # Fallback: descomentar para restaurar o card grande de cameras na home.
  # - !include main-grid/bento_cameras.yaml
  - !include main-grid/bento_energy.yaml
  # Fallback: descomentar para restaurar o card completo de agenda na home.
  # - !include main-grid/bento_calendar.yaml
  - !include main-grid/bento_roborock.yaml
  - !include main-grid/bento_quick_actions.yaml
  - !include main-grid/bento_media.yaml
