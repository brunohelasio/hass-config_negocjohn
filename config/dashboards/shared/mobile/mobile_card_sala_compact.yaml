# ══════════════════════════════════════════════════════════════════════════════
# mobile_card_sala_compact.yaml  (V3.1) — wrapper mobile glass da Sala 1x1
# Criado: 2026-05-10
# Atualizado: 2026-05-11 — substituído !include bento_sala.yaml por mobile_sala_hero.yaml
#
# Versao COMPACTA da Sala para a grade 2-col da aba Comodos.
# Usa mobile_sala_hero.yaml (hero button-card autónomo) em vez do
# bento_sala.yaml completo.
#
# RAZÃO DA MUDANÇA (V3.1):
#   bento_sala.yaml tem grid-template-rows: 1fr auto onde "auto" é a strip
#   de actions (≈152px). Num container de 158px o hero ficava com ≈6px de
#   altura — invisível. Solução: usar só o hero button-card, sem a strip.
#
# ROLLBACK RÁPIDO para V3.0:
#   1. Comentar a linha "cards: !include mobile_sala_hero.yaml"
#   2. Descomentar a linha "cards: !include ../grid-cards/bento_sala.yaml"
# ══════════════════════════════════════════════════════════════════════════════

type: custom:stack-in-card
card_mod:
  style: |
    :host {
      height: 100% !important;
      margin: 0 !important;
      display: block !important;
    }
    ha-card {
      height: 100% !important;
      min-height: 158px !important;
      max-height: 158px !important;
      margin: 0 !important;
      display: block !important;
      padding: 0 !important;

      background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)) !important;
      backdrop-filter: blur(20px) saturate(1.35) !important;
      -webkit-backdrop-filter: blur(20px) saturate(1.35) !important;
      border: 1px solid rgba(255,255,255,0.10) !important;
      box-shadow: 0 0 32px rgba(59,130,246,0.12), inset 0 1px 0 rgba(191,219,254,0.15), 0 8px 32px rgba(0,0,0,0.2) !important;
      border-radius: 16px !important;
      overflow: hidden !important;

      --ha-card-backdrop-filter: none !important;
      --ha-card-background: transparent !important;
      --ha-card-border-width: 0 !important;
    }
    ha-card::before { display: none !important; }

# NOVO (V3.1): usa o hero autónomo, sem a strip de actions
cards: !include mobile_sala_hero.yaml

# --- CÓDIGO ORIGINAL COMENTADO (V3.0 — bento_sala.yaml completo, rollback rápido) ---
# O hero ficava com ≈6px de altura porque o bento_sala.yaml tem row "auto" de ≈152px.
# cards: !include ../grid-cards/bento_sala.yaml
