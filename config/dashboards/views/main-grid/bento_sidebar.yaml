# PROTÓTIPO 2026-05-14 — custom:bento-sidebar-card
#
# Congelamos a evolução da sidebar YAML baseada em custom:button-card porque
# os ajustes no Home quebraram a renderização mais de uma vez. Este arquivo
# agora carrega apenas um protótipo mínimo em JavaScript para validar:
#   • Home visualmente selecionado e fixo;
#   • Música no topo;
#   • spacer flexível;
#   • Monitor e Power ancorados no rodapé.
#
# Depois da validação visual, os demais botões/ações podem ser migrados para
# o custom card gradualmente.

type: custom:bento-sidebar-card
view_layout:
  grid-area: sidebar
music_path: /lovelace/mass-media
power_path: /
