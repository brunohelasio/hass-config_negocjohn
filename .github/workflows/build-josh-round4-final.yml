PIR/luminancia e temperatura/umidade sao dispositivos distintos. O segundo saiu do Office para o Lavabo. A candidata usa `sensor.office_temp_humid_temperature` e `sensor.office_temp_humid_humidity`, aguardando confirmacao no HA real.

