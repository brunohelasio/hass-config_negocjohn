# ═══════════════════════════════════════════════════════════════════
# POPUP DE CAMERAS — Apartamento do usuario
# 8 cameras em layout 3-3-2 (3 colunas, 3 linhas)
# Entidades: sl_camera_2, vr_camera_2, cz_camera_2, as_camera_2,
#            of_camera_2, camera_quarto_casal_2, qmi_camera_2, qma_camera_2
# Estilo baseado no cameras.yaml original do sagaland93/ngocjohn
# ═══════════════════════════════════════════════════════════════════
# --- CÓDIGO ANTERIOR COMENTADO PARA REFERÊNCIA ---
# Layout anterior: grid 2x4 (2 colunas, 4 linhas) — fazia scroll no tablet
# grid-template-columns: repeat(2, 1fr)
# Cada camera com picture-entity sem tap_action (sem ampliar)
# --- FIM CÓDIGO ANTERIOR ---
# NOVO: Layout 3-3-2 (3 colunas) — cabe tudo sem scroll
# Cada camera abre popup ampliado ao clicar (more-info nativo do HA)
action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Cameras
    tag: cameras_user
    # --- ANTERIOR (fullscreen: true — parâmetro inválido nesta versão do browser_mod) ---
    # fullscreen: true
    # --- FIM ANTERIOR ---
    # FULLSCREEN REAL — initial_style é o parâmetro correto (ver livingroom_fullscreen.yaml)
    initial_style: fullscreen
    dismissable: true
    style: >
      --popup-width: 100vw;
      --popup-max-width: 100vw;
      --popup-border-width: 0;
      --popup-background-color: linear-gradient(180deg, rgba(15, 25, 50, 0.92) 0%, rgba(10, 18, 40, 0.96) 100%);
      --mdc-theme-surface: rgba(20, 24, 33, 0.88);
      --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.56);
    card_mod:
      style:
        .: |
          ha-dialog {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
          }
          ha-dialog > ha-dialog-header {
            display: none !important;
          }
        ha-dialog$: |
          .mdc-dialog__scrim {
            background-color: rgba(0, 0, 0, 0.56) !important;
          }
          .mdc-dialog__container {
            padding: 0 !important;
            align-items: stretch !important;
            justify-content: stretch !important;
          }
          .mdc-dialog__surface {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            overflow: hidden !important;
          }
          .mdc-dialog__title {
            display: none !important;
          }
          .mdc-dialog__content {
            padding: 0 !important;
            height: 100vh !important;
            max-height: 100vh !important;
            overflow: hidden !important;
          }
    content:
      type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        grid-gap: 5px
        grid-template-columns: repeat(3, minmax(0, 1fr))
        # ORIGINAL: grid-template-rows: repeat(3, minmax(0, 1fr)) — 1fr sem altura resolvida no container → câmeras usavam tamanho intrínseco 16:9 causando scroll
        grid-template-rows: repeat(3, calc((100vh - 2rem - 10px) / 3))
        width: min(92vw, 1480px)
        height: calc(100vh - 1rem)
        max-height: calc(100vh - 1rem)
        margin: 0 auto
        padding: 0.5rem
        box-sizing: border-box
        align-content: center
        justify-content: center
        overflow: hidden
        mediaquery:
          '(max-width: 800px)':
            grid-template-columns: 1fr
            grid-template-rows: repeat(8, minmax(0, 1fr))
            width: calc(100vw - 1rem)
      cards:
        # ── Linha 1: 3 cameras ──
        # SL - Camera (Sala)
        - type: picture-entity
          entity: camera.sl_camera_2
          camera_view: auto
          show_name: true
          show_state: false
          name: SL - Sala
          tap_action:
            action: more-info
          card_mod:
            style: |
              /* ORIGINAL: height: 100% — dependia de 1fr resolvido; substituído por altura explícita para travar célula */
              ha-card { border-radius: 10px !important; overflow: hidden; height: calc((100vh - 2rem - 10px) / 3) !important; }
