# Publica o DP Tuya initiative_message/ipc_motion para o card de monitoramento.
# FALLBACK: comentar esta chave e restaurar o cache/mapeamento anterior do card.
bruno_tuya_motion:

homeassistant:
  # ANTERIOR: customize: !include customize.yaml
  # Mantido inline para evitar falha de boot quando /config/customize.yaml não existe
  # no ambiente de execução do Home Assistant.
  customize:
    input_boolean.bento_cameras_page_2:
      hidden: true
  packages:
    active_player: !include packages/active_player.yaml
    bruno_wallpapers: !include packages/bruno_wallpapers.yaml
    hass_sidebar_helpers: !include packages/hassio/hass_sidebar_helpers.yaml
    energy_estimated: !include packages/energy_estimated.yaml
    # ANTERIOR: kitchen_appliances: !include packages/kitchen_appliances.yaml
    # Comentado para evitar falha de check_config quando o arquivo ainda não
    # existe no /config do Home Assistant em produção. Reativar quando o
    # package estiver confirmado no host.
    # kitchen_appliances: !include packages/kitchen_appliances.yaml
    sala_tv_controls: !include packages/sala_tv_controls.yaml
    # NOVO (2026-07-12): supervisao comum dos 4-em-1 e do PIR do Corredor.
    # Bloqueia cache de boot, propaga indisponibilidade e detecta leitura presa.
    # FALLBACK: comentar este include; os packages anteriores ficam preservados.
    presence_supervision: !include packages/presence_supervision.yaml
    # NOVO: camada lógica do Office (PIR/mmWave + HASS.Agent).
    # FALLBACK: comentar esta linha para voltar ao Office anterior.
    office_presence: !include packages/office_presence.yaml
    # NOVO: camada local da Sala para diferenciar passagem de ocupacao real.
    # FALLBACK: comentar esta linha para voltar ao uso direto do sensor 4-in-1.
    sala_presence: !include packages/sala_presence.yaml
    # NOVO: camada logica do Lavabo usando sensor lv_sensor_presenca_*.
    lavabo_presence: !include packages/lavabo_presence.yaml    # NOVO: camada local do Q. Marina seguindo a mesma logica da Sala.
    q_marina_presence: !include packages/q_marina_presence.yaml
    # NOVO (2026-07-03): molde unico de presenca/ocupacao para os demais comodos.
    # FALLBACK: comentar as linhas abaixo para voltar ao uso direto do sensor bruto.
    cozinha_presence: !include packages/cozinha_presence.yaml
    q_miguel_presence: !include packages/q_miguel_presence.yaml
    q_casal_presence: !include packages/q_casal_presence.yaml

