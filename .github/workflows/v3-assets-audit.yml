name: V3 Assets Audit

on:
  push:
    branches:
      - feat/assets-v3-5g
    paths:
      - 'config/www/bruno-ui/assets/V3/**'
      - 'scripts/assets/audit_v3.py'
      - '.github/workflows/v3-assets-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: python -m pip install --upgrade pillow

      - name: Auditar V3
        run: python scripts/assets/audit_v3.py

      - name: Registrar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_tmp/v3-audit/
          if ! git diff --cached --quiet; then
            git commit -m "chore(assets): record V3 audit"
            git push
          fi
