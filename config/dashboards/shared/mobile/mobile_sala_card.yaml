# ══════════════════════════════════════════════════════════════════════════════
# mobile_sala_card.yaml  (V3 — revisão 2026-05-10)
#
# ABORDAGEM ANTERIOR: incluía bento_sala.yaml via stack-in-card. O bento_sala
# usa layout VERTICAL (grid-template-rows: 1fr auto — hero em cima, strip
# TV/AC em baixo), incompatível com o formato 2×1 horizontal solicitado.
# Também causava o aviso "You are doing it wrong!" do card-mod (mod-card
# dentro de stack-in-card) degradando a aplicação de estilos.
#
# ABORDAGEM NOVA: card standalone com layout 2 colunas:
#   Coluna esquerda (info do cômodo): ícone, nome, temp, status de luzes, dots
#   Coluna direita  (controles):      pílulas Corredor / TV / A/C / PS5
#
# A lógica e as entidades são idênticas ao bento_sala.yaml — apenas o layout
# foi reestruturado para horizontal.
#
# Rollback: comentar o bloco NOVO e descomentar o bloco ANTERIOR no final.
# ══════════════════════════════════════════════════════════════════════════════

# ── NOVO — layout 2×1 horizontal ────────────────────────────────────────────
type: custom:layout-card
layout_type: custom:grid-layout
card_mod:
  style: |
    :host {
      display: block !important;
    }
    ha-card {
      background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)) !important;
      backdrop-filter: blur(20px) saturate(1.35) !important;
      -webkit-backdrop-filter: blur(20px) saturate(1.35) !important;
      border: 1px solid rgba(255,255,255,0.10) !important;
      box-shadow: 0 0 32px rgba(59,130,246,0.12), inset 0 1px 0 rgba(191,219,254,0.15), 0 8px 32px rgba(0,0,0,0.2) !important;
      border-radius: 16px !important;
      overflow: hidden !important;
      --ha-card-background: transparent !important;
      --ha-card-border-width: 0 !important;
    }
    ha-card::before { display: none !important; }
layout:
  grid-template-columns: 1fr 140px
  grid-template-rows: auto
  grid-template-areas: '"info controls"'
  gap: 0
  margin: 0
  padding: 14px 12px 14px 14px
  height: auto
  min-height: 170px

cards:
  # ── Coluna Esquerda: info do cômodo ────────────────────────────────────
  - type: custom:button-card
    view_layout:
      grid-area: info
    entity: light.grupo_luzes_sala
    show_icon: false
    show_name: true
    show_state: false
    name: Sala
    variables:
      state_on: >
        [[[
          return entity?.state === 'on';
        ]]]
    triggers_update:
      - light.sala_switch_1
      - light.sala_switch_2
      - sensor.living_room_active
      - sensor.sensor_4_in_1_sala_temperature
      - sensor.sensor_4_in_1_sala_humidity
      - binary_sensor.sensor_4_in_1_sala_presence
      - media_player.android_tv_192_168_3_17
      - climate.sl_ar_condicionado
      - media_player.echo_show
      - sensor.time
    tap_action:
      action: perform-action
      perform_action: light.toggle
      target:
        entity_id: light.sala_switch_2
    double_tap_action:
      action: navigate
      navigation_path: subview-sala
    hold_action:
      action: perform-action
      perform_action: light.turn_off
      data:
        entity_id: light.grupo_luzes_sala
    custom_fields:
      icon: >
        [[[
          const on = entity?.state === 'on';
          const f = on ? 'none' : 'grayscale(1) contrast(0.4) brightness(0.8)';
          return '<svg viewBox="0 0 4.8 4.8" xmlns="http://www.w3.org/2000/svg" style="width:52px;height:52px;filter:' + f + ';display:block;">'
            + '<path d="M.78 2.565H.69V.87C.69.75.75.51.975.51v.098C.78.608.78.855.78.871v1.695" fill="#666"/>'
            + '<path d="M1.62.525a.81.81 0 0 0-.188-.09L1.313.052C1.298 0 1.171-.008 1.021.037s-.255.128-.24.18l.128.397S.811.786.804.846c-.022.12.045.472.045.472l1.05-.315c-.007-.007-.172-.39-.278-.48" fill="#94989b"/>'
            + '<path d="M1.89.998c.03.105-.188.263-.472.345-.292.09-.547.075-.57-.03-.03-.105.188-.263.472-.345.285-.09.547-.075.57.03" fill="#ffe62e"/>'
            + '<path d="M4.447 3.053a.15.15 0 0 1-.15.15H.502a.15.15 0 0 1-.15-.15v-.975a.15.15 0 0 1 .15-.15h3.803a.15.15 0 0 1 .15.15v.975z" fill="#42ade2"/>'
            + '<path d="M4.447 3.053a.15.15 0 0 1-.15.15H.502a.15.15 0 0 1-.15-.15v-.975a.15.15 0 0 1 .15-.15h3.803a.15.15 0 0 1 .15.15v.975z" fill="#428bc1" opacity=".5"/>'
            + '<path d="M3.375 3.203H.352V2.047s.6.69 3.022 1.155" fill="#428bc1"/>'
            + '<path d="M4.672 2.288c0-.135-.098-.24-.225-.24-.12 0-.217.105-.217.24v.93c0 .135.098.24.217.24.12 0 .225-.105.225-.24v-.93" fill="#42ade2"/>'
            + '<path fill="#8a8e92" d="M.457 4.485H.75V4.8H.457z"/>'
            + '<path d="M3.375 4.485H.3c-.165 0-.3-.142-.3-.322s.135-.322.3-.322h3.075v.645m0-.646H.3c-.165 0-.3-.142-.3-.322s.135-.322.3-.322h3.075v.645" fill="#428bc1"/>'
            + '<path fill="#8a8e92" d="M4.05 4.485h.292V4.8H4.05z"/>'
            + '<path d="M1.425 3.84H4.5c.165 0 .3.142.3.322s-.135.322-.3.322H1.425v-.645" fill="#428bc1"/>'
            + '<path d="M1.425 3.203H4.5c.165 0 .3.142.3.322s-.135.322-.3.322H1.425v-.645" fill="#428bc1"/>'
            + '<path d="M.57 2.288c0-.135-.098-.24-.217-.24-.12 0-.217.105-.217.24v.93c0 .135.098.24.217.24.12 0 .217-.105.217-.24v-.93" fill="#42ade2"/>'
            + '<path d="M4.53 1.965s-.217.187-.255.285c-.075.21-.022.667 0 .892.007.037.037.142.037.142s-.255-.068-.345-.083c-.172-.022-.51.015-.682 0-.075-.007-.3-.06-.3-.06s.195-.09.232-.15c.12-.186.143-.666.158-.891v-.128s.165.052.225.06c.165.015.51-.015.675-.03.06 0 .255-.037.255-.037" fill="#c7e755"/>'
            + '</svg>';
        ]]]
      temp: >
        [[[
          const t = states['sensor.sensor_4_in_1_sala_temperature'];
          const temp = t && t.state && !['unknown','unavailable'].includes(t.state) ? `${t.state}°` : '—';
          const h = states['sensor.sensor_4_in_1_sala_humidity'];
          const hum = h && !['unknown','unavailable'].includes(h.state) ? `${h.state}%` : '';
          const salaOn = states['light.grupo_luzes_sala']?.state === 'on';
          const color = salaOn ? 'rgba(0,0,0,0.88)' : 'rgba(255,255,255,0.9)';
          const subColor = salaOn ? 'rgba(0,0,0,0.55)' : 'rgba(255,255,255,0.52)';
          return `<div style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;">
            <span style="font-size:12px;font-weight:700;color:${color};">${temp}</span>
            <span style="font-size:10px;color:${subColor};">${hum}</span>
          </div>`;
        ]]]
      lights: >
        [[[
          const activeEntity = states['sensor.living_room_active'];
          const lightsOnCount = activeEntity?.attributes?.lights_on_count;
          const lightsOn = activeEntity?.attributes?.lights_on;
          let count = null;
          if (lightsOnCount != null && lightsOnCount !== '' && !isNaN(lightsOnCount)) {
            const parsed = parseInt(lightsOnCount, 10);
            if (!isNaN(parsed)) count = parsed;
          } else if (Array.isArray(lightsOn)) {
            count = lightsOn.length;
          }
          const ids = entity?.attributes?.entity_id;
          if (count === null && Array.isArray(ids)) {
            count = ids.filter(id => states[id]?.state === 'on').length;
          }
          if (count === null) {
            const fallbackIds = ['light.sala_switch_1', 'light.sala_switch_2'];
            count = fallbackIds.filter(id => states[id]?.state === 'on').length;
          }
          if (!count || count <= 0) return '';
          const timeFmt = c => {
            const m = (c / 6e4), h = (c / 36e5), d = (c / 864e5);
            return m < 1 ? '<1m' : m < 60 ? `${parseInt(m)}m` : h < 24 ? `${parseInt(h)}h` : `${parseInt(d)}d`;
          };
          let earliestOn = null;
          if (Array.isArray(ids)) {
            ids.forEach(id => {
              const s = states[id];
              if (s?.state === 'on' && s?.last_changed) {
                const ts = Date.parse(s.last_changed);
                if (!isNaN(ts) && (earliestOn === null || ts < earliestOn)) earliestOn = ts;
              }
            });
          }
          if (earliestOn === null && entity?.last_changed) {
            const ts = Date.parse(entity.last_changed);
            if (!isNaN(ts)) earliestOn = ts;
          }
          const elapsed = earliestOn !== null ? timeFmt(Date.now() - earliestOn) : '';
          const salaOn = states['light.grupo_luzes_sala']?.state === 'on';
          const statusColor = salaOn ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.4)';
          const label = count === 1 ? '1 light' : `${count} lights`;
          return `<span style="font-size:11px;font-weight:500;color:${statusColor};">${label}${elapsed ? ' · ' + elapsed : ''}</span>`;
        ]]]
      dots: >
        [[[
          const tvOn  = ['on','playing','paused','idle'].includes(states['media_player.android_tv_192_168_3_17']?.state ?? '');
          const acOn  = !['off','unavailable','unknown',''].includes(states['climate.sl_ar_condicionado']?.state ?? 'off');
          const alexa = ['playing','on','paused'].includes(states['media_player.echo_show']?.state ?? '');
          const presenceEntity = states['binary_sensor.sensor_4_in_1_sala_presence'];
          const presenceRaw = presenceEntity?.state === 'on';
          const presenceChanged = presenceEntity?.last_changed ? Date.parse(presenceEntity.last_changed) : NaN;
          const presenceRecent = !isNaN(presenceChanged) && (Date.now() - presenceChanged) < 10 * 60 * 1000;
          const presence = presenceRaw && presenceRecent;
          const salaOn = states['light.grupo_luzes_sala']?.state === 'on';
          const offBg = salaOn ? 'rgba(0,0,0,0.08)' : 'rgba(255,255,255,0.08)';
          const offBorder = salaOn ? 'rgba(0,0,0,0.14)' : 'rgba(255,255,255,0.12)';
          const offIcon = salaOn ? 'rgba(0,0,0,0.42)' : 'rgba(255,255,255,0.35)';
          const dot = (icon, active, color) =>
            `<div style="width:22px;height:22px;border-radius:50%;box-sizing:border-box;background:${active?color+'22':offBg};border:1px solid ${active?color+'55':offBorder};display:flex;align-items:center;justify-content:center;">` +
            `<ha-icon icon="${icon}" style="width:12px;height:12px;color:${active?color:offIcon};display:flex;"></ha-icon></div>`;
          return `<div style="display:flex;flex-direction:row;align-items:center;gap:4px;">
            ${dot('mdi:account', presence, '#60a5fa')}
            ${dot('mdi:television-classic', tvOn, '#a78bfa')}
            ${dot('mdi:snowflake', acOn, '#4facfe')}
            ${dot('mdi:speaker-wireless', alexa, '#ff9900')}
          </div>`;
        ]]]
    styles:
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: 0
        - margin: 0
        - height: auto
      grid:
        - grid-template-areas: |
            "icon temp"
            "n n"
            "lights lights"
            "dots dots"
        - grid-template-columns: auto 1fr
        - grid-template-rows: auto auto auto 1fr
        - row-gap: 4px
      name:
        - justify-self: start
        - align-self: start
        - font-size: 16px
        - font-weight: 700
        - color: >
            [[[
              return entity?.state === 'on' ? 'rgba(0,0,0,0.9)' : 'white';
            ]]]
        - margin-top: 2px
      custom_fields:
        icon:
          - justify-self: start
          - align-self: start
        temp:
          - justify-self: start
          - align-self: start
          - margin-left: 10px
          - margin-top: 2px
        lights:
          - justify-self: start
          - align-self: start
        dots:
          - justify-self: start
          - align-self: end
          - padding-top: 6px

  # ── Coluna Direita: pílulas de controle ────────────────────────────────
  - type: vertical-stack
    view_layout:
      grid-area: controls
    card_mod:
      style: |
        :host { margin: 0 !important; padding: 0 !important; }
        #root { margin: 0 !important; padding: 0 !important; gap: 4px !important; display: flex !important; flex-direction: column !important; }
        #root > * { margin: 0 !important; flex: 1 !important; }
    cards:
      # Corredor
      - type: custom:button-card
        entity: light.corredor_switch_1
        show_icon: true
        show_name: true
        show_state: false
        show_label: true
        icon: mdi:door-closed
        name: "Corredor"
        label: >
          [[[
            return entity?.state === 'on' ? 'Ligado' : 'Desligado';
          ]]]
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        triggers_update:
          - light.corredor_switch_1
          - light.grupo_luzes_sala
        styles:
          card:
            - height: auto
            - min-height: 34px
            - border-radius: 12px
            - background: >
                [[[
                  const on = entity?.state === 'on';
                  if (on) return 'linear-gradient(180deg, rgba(96,165,250,0.22) 0%, rgba(96,165,250,0.10) 100%)';
                  return 'linear-gradient(180deg, rgba(255,255,255,0.075) 0%, rgba(255,255,255,0.035) 100%)';
                ]]]
            - border: >
                [[[
                  const on = entity?.state === 'on';
                  return on ? '1px solid rgba(96,165,250,0.38)' : '1px solid rgba(255,255,255,0.12)';
                ]]]
            - box-shadow: >
                [[[ return entity?.state === 'on' ? '0 0 14px rgba(96,165,250,0.14)' : 'none'; ]]]
            - padding: 0 8px
            - box-sizing: border-box
          grid:
            - grid-template-areas: '"i n l"'
            - grid-template-columns: "16px 1fr auto"
            - column-gap: "6px"
            - align-items: "center"
          img_cell:
            - width: "16px"
            - justify-content: center
          icon:
            - width: "14px"
            - color: >
                [[[ return entity?.state === 'on' ? '#60a5fa' : 'rgba(255,255,255,0.38)'; ]]]
          name:
            - font-size: "11px"
            - font-weight: "600"
            - justify-self: start
            - color: rgba(255,255,255,0.82)
          label:
            - font-size: "10px"
            - justify-self: end
            - color: >
                [[[ return entity?.state === 'on' ? '#60a5fa' : 'rgba(255,255,255,0.35)'; ]]]

      # TV
      - type: custom:button-card
        entity: media_player.android_tv_192_168_3_17
        show_icon: true
        show_name: true
        show_state: false
        show_label: true
        icon: mdi:television-classic
        name: "TV"
        label: >
          [[[
            const s = entity?.state;
            if (s === 'playing') return 'Reproduzindo';
            if (s === 'paused') return 'Pausado';
            if (['on','idle'].includes(s)) return 'Ligada';
            return 'Desligada';
          ]]]
        tap_action:
          action: toggle
        hold_action:
          action: more-info
        triggers_update:
          - media_player.android_tv_192_168_3_17
        styles:
          card:
            - height: auto
            - min-height: 34px
            - border-radius: 12px
            - background: >
                [[[
                  const on = ['on','playing','paused','idle'].includes(entity?.state);
                  if (on) return 'linear-gradient(180deg, rgba(167,139,250,0.22) 0%, rgba(167,139,250,0.10) 100%)';
                  return 'linear-gradient(180deg, rgba(255,255,255,0.075) 0%, rgba(255,255,255,0.035) 100%)';
                ]]]
            - border: >
                [[[
                  const on = ['on','playing','paused','idle'].includes(entity?.state);
                  return on ? '1px solid rgba(167,139,250,0.38)' : '1px solid rgba(255,255,255,0.12)';
                ]]]
            - box-shadow: >
                [[[ return ['on','playing','paused','idle'].includes(entity?.state) ? '0 0 14px rgba(167,139,250,0.14)' : 'none'; ]]]
            - padding: 0 8px
            - box-sizing: border-box
          grid:
            - grid-template-areas: '"i n l"'
            - grid-template-columns: "16px 1fr auto"
            - column-gap: "6px"
            - align-items: "center"
          img_cell:
            - width: "16px"
            - justify-content: center
          icon:
            - width: "14px"
            - color: >
                [[[ return ['on','playing','paused','idle'].includes(entity?.state) ? '#a78bfa' : 'rgba(255,255,255,0.38)'; ]]]
          name:
            - font-size: "11px"
            - font-weight: "600"
            - justify-self: start
            - color: rgba(255,255,255,0.82)
          label:
            - font-size: "10px"
            - justify-self: end
            - color: >
                [[[ return ['on','playing','paused','idle'].includes(entity?.state) ? '#a78bfa' : 'rgba(255,255,255,0.35)'; ]]]

      # A/C
      - type: custom:button-card
        entity: climate.sl_ar_condicionado
        show_icon: true
        show_name: true
        show_state: false
        show_label: true
        icon: mdi:snowflake
        name: "A/C"
        label: >
          [[[
            const s = entity?.state;
            const on = ['cool','heat','fan_only','dry','heat_cool','auto'].includes(s);
            if (on) {
              const t = entity?.attributes?.temperature;
              return Number.isFinite(Number(t)) ? `${Number(t)}°` : 'Ligado';
            }
            return 'Desligado';
          ]]]
        tap_action:
          action: perform-action
          perform_action: >
            [[[
              const on = ['cool','heat','fan_only','dry','heat_cool','auto'].includes(entity?.state);
              return on ? 'climate.turn_off' : 'climate.turn_on';
            ]]]
          target:
            entity_id: climate.sl_ar_condicionado
        hold_action:
          action: more-info
        triggers_update:
          - climate.sl_ar_condicionado
        styles:
          card:
            - height: auto
            - min-height: 34px
            - border-radius: 12px
            - background: >
                [[[
                  const on = ['cool','heat','fan_only','dry','heat_cool','auto'].includes(entity?.state);
                  if (on) return 'linear-gradient(180deg, rgba(79,172,254,0.22) 0%, rgba(79,172,254,0.10) 100%)';
                  return 'linear-gradient(180deg, rgba(255,255,255,0.075) 0%, rgba(255,255,255,0.035) 100%)';
                ]]]
            - border: >
                [[[
                  const on = ['cool','heat','fan_only','dry','heat_cool','auto'].includes(entity?.state);
                  return on ? '1px solid rgba(79,172,254,0.38)' : '1px solid rgba(255,255,255,0.12)';
                ]]]
            - box-shadow: >
                [[[ return ['cool','heat','fan_only','dry','heat_cool','auto'].includes(entity?.state) ? '0 0 14px rgba(79,172,254,0.14)' : 'none'; ]]]
            - padding: 0 8px
            - box-sizing: border-box
          grid:
            - grid-template-areas: '"i n l"'
            - grid-template-columns: "16px 1fr auto"
            - column-gap: "6px"
            - align-items: "center"
          img_cell:
            - width: "16px"
            - justify-content: center
          icon:
            - width: "14px"
            - color: >
                [[[ return ['cool','heat','fan_only','dry','heat_cool','auto'].includes(entity?.state) ? '#4facfe' : 'rgba(255,255,255,0.38)'; ]]]
          name:
            - font-size: "11px"
            - font-weight: "600"
            - justify-self: start
            - color: rgba(255,255,255,0.82)
          label:
            - font-size: "10px"
            - justify-self: end
            - color: >
                [[[ return ['cool','heat','fan_only','dry','heat_cool','auto'].includes(entity?.state) ? '#4facfe' : 'rgba(255,255,255,0.35)'; ]]]

      # PS5 (placeholder)
      - type: custom:button-card
        show_icon: true
        show_name: true
        show_state: false
        show_label: true
        icon: mdi:sony-playstation
        name: "PS5"
        label: "—"
        tap_action:
          action: none
        hold_action:
          action: none
        styles:
          card:
            - height: auto
            - min-height: 34px
            - border-radius: 12px
            - background: "linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.025) 100%)"
            - border: "1px solid rgba(255,255,255,0.10)"
            - box-shadow: none
            - padding: 0 8px
            - box-sizing: border-box
            - opacity: "0.44"
            - cursor: default
          grid:
            - grid-template-areas: '"i n l"'
            - grid-template-columns: "16px 1fr auto"
            - column-gap: "6px"
            - align-items: "center"
          img_cell:
            - width: "16px"
            - justify-content: center
          icon:
            - width: "14px"
            - color: "rgba(255,255,255,0.50)"
          name:
            - font-size: "11px"
            - font-weight: "600"
            - justify-self: start
            - color: rgba(255,255,255,0.82)
          label:
            - font-size: "10px"
            - justify-self: end
            - color: "rgba(255,255,255,0.35)"

