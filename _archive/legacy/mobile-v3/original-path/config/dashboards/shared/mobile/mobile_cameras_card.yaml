# NOVO (V3.1): lista vertical com as 8 câmeras
type: vertical-stack
cards:
  # ── Sala ─────────────────────────────────────────────────────────────────
  - type: custom:stack-in-card
    card_mod:
      style: |
        ha-card {
          border-radius: 16px !important;
          overflow: hidden !important;
          background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)) !important;
          backdrop-filter: blur(20px) saturate(1.35) !important;
          -webkit-backdrop-filter: blur(20px) saturate(1.35) !important;
          border: 1px solid rgba(255,255,255,0.10) !important;
          box-shadow: 0 0 32px rgba(59,130,246,0.12), inset 0 1px 0 rgba(191,219,254,0.15), 0 8px 32px rgba(0,0,0,0.2) !important;
          --ha-card-backdrop-filter: none !important;
          --ha-card-background: transparent !important;
          --ha-card-border-width: 0 !important;
        }
        ha-card::before { display: none !important; }
    cards:
      - type: picture-entity
        entity: camera.sl_camera_2
        camera_view: live
        show_state: false
        show_name: true
        name: Sala
        aspect_ratio: 16x9

