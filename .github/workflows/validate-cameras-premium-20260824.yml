name: Validate cameras premium 20260824

on:
  push:
    branches: [feat/cameras-premium-subview-20260824]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-build:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[generated cameras]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'feat/cameras-premium-subview-20260824' }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-src/package-lock.json

      - name: Install dependencies
        working-directory: dashboard-src
        run: npm ci

      - name: Validate camera grouping model
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';

          globalThis.HTMLElement = class {};
          const registry = new Map();
          globalThis.customElements = {
            get: (name) => registry.get(name),
            define: (name, ctor) => registry.set(name, ctor),
          };
          globalThis.window = { customCards: [] };
          globalThis.matchMedia = () => ({ matches: false });

          await import('./config/www/bruno-ui/subviews/bruno-cameras-security-subview.js');
          const CameraSubview = registry.get('bruno-cameras-security-subview');
          assert.ok(CameraSubview, 'camera subview must register');

          const el = new CameraSubview();
          el._config = el._normalizeConfig({});
          const states = {};
          for (const camera of el._config.cameras) {
            states[camera.entity] = {
              state: 'idle',
              attributes: { entity_picture: '/local/test.jpg' },
            };
          }
          states[el._config.active_entity] = {
            state: 'camera.sl_camera_profile_1',
            attributes: {},
          };
          el._hass = { states, callService() {} };

          const unique = (model) => new Set([
            model.activeCamera.entity,
            ...model.socialCameras.map((camera) => camera.entity),
            ...model.intimateCameras.map((camera) => camera.entity),
          ]);

          let model = el._model();
          assert.equal(model.activeCamera.entity, 'camera.sl_camera_profile_1');
          assert.equal(model.socialCameras.length, 3, 'Sala => social 3');
          assert.equal(model.intimateCameras.length, 4, 'Sala => intimate 4');
          assert.equal(unique(model).size, 8, 'Sala => 8 unique cameras');

          el._localActiveCamera = 'camera.of_camera_profile_1';
          model = el._model();
          assert.equal(model.activeCamera.entity, 'camera.of_camera_profile_1');
          assert.equal(model.socialCameras.length, 4, 'Office => social 4');
          assert.equal(model.intimateCameras.length, 3, 'Office => intimate 3');
          assert.equal(unique(model).size, 8, 'Office => 8 unique cameras');

          assert.equal(model.sideCameras.length + model.bottomCameras.length, 7, 'legacy mobile still has 7 secondary cameras');
          assert.equal(el._isMobileLayout(), false, 'test harness is desktop');
          console.log('camera grouping scenarios A/B: OK');
          NODE

      - name: Typecheck
        working-directory: dashboard-src
        run: npm run typecheck

      - name: Unit tests
        working-directory: dashboard-src
        run: npm test

      - name: Build dashboard
        working-directory: dashboard-src
        run: npm run build

      - name: Validate generated camera chunk and activate bundle
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          out = root / 'config' / 'www' / 'dashboard'
          chunks = list((out / 'chunks').glob('bruno-cameras-security-subview.*.js'))
          if len(chunks) != 1:
              raise SystemExit(f'expected one camera chunk, found {len(chunks)}')
          chunk = chunks[0].read_text(encoding='utf-8')
          for marker in ['Área social', 'Área íntima', 'camera-group-grid']:
              if marker not in chunk:
                  raise SystemExit(f'generated camera chunk missing {marker!r}')

          bundles = list(out.glob('bruno-dashboard.*.js'))
          if len(bundles) != 1:
              raise SystemExit(f'expected one dashboard bundle, found {len(bundles)}')
          bundle = bundles[0].name

          config_path = root / 'config' / 'configuration.yaml'
          text = config_path.read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^(\s*)- /local/dashboard/bruno-dashboard\.[^\s]+\.js\s*$')
          match = pattern.search(text)
          if not match:
              raise SystemExit('active hashed dashboard bundle line not found')
          old_line = match.group(0).strip()
          indent = match.group(1)
          new_line = f'{indent}- /local/dashboard/{bundle}'
          if old_line != new_line.strip():
              replacement = (
                  f'{indent}# ANTERIOR (rollback câmeras premium 2026-08-24): {old_line}\n'
                  f'{new_line}'
              )
              text = text[:match.start()] + replacement + text[match.end():]
              config_path.write_text(text, encoding='utf-8')

          print('generated chunk:', chunks[0].name)
          print('active bundle:', bundle)
          PY

      - name: Commit generated runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/www/dashboard config/configuration.yaml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "build(cameras): publish premium subview [generated cameras]"
          git push origin HEAD:feat/cameras-premium-subview-20260824
