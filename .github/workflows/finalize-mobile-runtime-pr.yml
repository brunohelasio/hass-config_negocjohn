name: Finalize mobile runtime PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'fix/mobile-runtime-tv-curtain-20260819' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard-src/package-lock.json

      - name: Finalize, validate, build and publish branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/finalize-mobile-runtime.sh /tmp/finalize-mobile-runtime.sh
          perl -0pi -e 's#  config/www/dashboard \\\n##' /tmp/finalize-mobile-runtime.sh
          perl -0pi -e 's#git add -f config/www/dashboard/\*\.br config/www/dashboard/\*\.gz#git add -u config/www/dashboard || true; git add -f config/www/dashboard/*#' /tmp/finalize-mobile-runtime.sh
          bash /tmp/finalize-mobile-runtime.sh
