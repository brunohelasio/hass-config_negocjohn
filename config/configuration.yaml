homeassistant:
  # ANTERIOR: customize: !include customize.yaml
  # Mantido inline para evitar falha de boot quando /config/customize.yaml não existe
  # no ambiente de execução do Home Assistant.
  customize:
    input_boolean.bento_cameras_page_2:
      hidden: true
  packages:
    active_player: !include packages/active_player.yaml
    hass_sidebar_helpers: !include packages/hassio/hass_sidebar_helpers.yaml
    energy_estimated: !include packages/energy_estimated.yaml
    # ANTERIOR: kitchen_appliances: !include packages/kitchen_appliances.yaml
    # Comentado para evitar falha de check_config quando o arquivo ainda não
    # existe no /config do Home Assistant em produção. Reativar quando o
    # package estiver confirmado no host.
    # kitchen_appliances: !include packages/kitchen_appliances.yaml
    sala_tv_controls: !include packages/sala_tv_controls.yaml
    # NOVO: camada lógica do Office (PIR/mmWave + HASS.Agent).
    # FALLBACK: comentar esta linha para voltar ao Office anterior.
    office_presence: !include packages/office_presence.yaml
    # NOVO: camada local da Sala para diferenciar passagem de ocupacao real.
    # FALLBACK: comentar esta linha para voltar ao uso direto do sensor 4-in-1.
    sala_presence: !include packages/sala_presence.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

lovelace:
  mode: storage
  dashboards:
    ngocjohn-main:
      mode: yaml
      title: Ngocjohn Main
      icon: mdi:home-automation
      show_in_sidebar: true
      filename: dashboards/ui-lovelace-main.yaml
    
    # --- NOVO DASHBOARD DE TESTE ---
    homekitesq-teste:
      mode: yaml
      title: Teste HomeKit
      icon: mdi:tablet-dashboard
      show_in_sidebar: true
      filename: lovelace-homekitesq.yaml
