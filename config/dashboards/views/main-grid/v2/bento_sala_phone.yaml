# HOME V2 — Sala no PHONE (layout mobile intocado, decisão 2026-07-24).
# No celular a Home V2 mantém exatamente o card especial da Sala usado hoje
# (bruno-sala-card, linha de 160px). No desktop/tablet este card NÃO monta
# (show max-800) — lá a Sala vive na faixa de cômodos (bruno-sala-room-card).
# Estratégia Sagaland: a área `sala` existe nos dois breakpoints; aqui o
# show:mediaquery é o mecanismo primário de ocultação.
type: custom:bruno-sala-card
view_layout:
  grid-area: sala
  show:
    mediaquery: '(max-width: 800px)'
