# ============================================================================
# Pacote: presence_supervision (2026-07-12)
#
# Contrato comum para os sensores 4-em-1 e para o PIR do Corredor.
#
# Problemas tratados:
# - um valor MQTT restaurado no boot nao pode virar ocupacao valida;
# - unknown/unavailable nao pode virar "comodo vazio";
# - um estado dinamico congelado nao pode alimentar automacoes indefinidamente;
# - temperatura, umidade, iluminancia, bateria e parametros de deteccao ficam
#   reunidos em uma entidade de diagnostico por ambiente.
#
# Os packages antigos continuam sendo a camada funcional e recebem availability
# a partir de sensor.<comodo>_presence_health. Para rollback, comentar apenas o
# include presence_supervision em configuration.yaml e remover os guards de
# availability adicionados aos packages antigos.
# ============================================================================

template:
  # --------------------------------------------------------------------------
  # SALA - o primeiro bloco declara os anchors reutilizados pelos demais.
  # --------------------------------------------------------------------------
  - trigger:
      - platform: homeassistant
        event: start
        id: reset
      - platform: event
        event_type: event_template_reloaded
        id: reset
      - platform: state
        entity_id:
          - binary_sensor.sensor_4_in_1_sala_presence
          - sensor.sensor_4_in_1_sala_motion_state
        id: evidence
      - platform: state
        entity_id:
          - sensor.sensor_4_in_1_sala_temperature
          - sensor.sensor_4_in_1_sala_humidity
          - sensor.sensor_4_in_1_sala_illuminance
          - sensor.sensor_4_in_1_sala_battery
        id: telemetry
      - platform: time_pattern
        minutes: "/1"
        id: tick
    variables:
      source_entity: binary_sensor.sensor_4_in_1_sala_presence
      motion_entity: sensor.sensor_4_in_1_sala_motion_state
      temperature_entity: sensor.sensor_4_in_1_sala_temperature
      humidity_entity: sensor.sensor_4_in_1_sala_humidity
      illuminance_entity: sensor.sensor_4_in_1_sala_illuminance
      battery_entity: sensor.sensor_4_in_1_sala_battery
      fading_entity: number.sensor_4_in_1_sala_fading_time
      mode_entity: select.sensor_4_in_1_sala_motion_detection_mode
      motion_sensitivity_entity: number.sensor_4_in_1_sala_motion_detection_sensitivity
      static_distance_entity: number.sensor_4_in_1_sala_static_detection_distance
      static_sensitivity_entity: number.sensor_4_in_1_sala_static_detection_sensitivity
      linkquality_entity: sensor.sensor_4_in_1_sala_linkquality
      is_passive: false
      stale_after_seconds: 900
      active_stuck_after_seconds: 900
      passive_stuck_after_seconds: 300
      inconsistency_after_seconds: 60
      startup_grace_seconds: 30
    sensor:
      - name: Sala Presence Health
        default_entity_id: sensor.sala_presence_health
        unique_id: sala_presence_health
        icon: mdi:shield-home-outline
        state: &presence_health_state >-
          {% set invalid = ['unknown', 'unavailable', ''] %}
          {% set active_motion = ['small', 'large', 'static'] %}
          {% set source = states(source_entity) | lower %}
          {% set motion = states(motion_entity) | lower if motion_entity else 'none' %}
          {% set previous = this.state | default('unknown') | lower %}
          {% set trigger_id = trigger.id | default('') %}
          {% set from_value = trigger.from_state.state | lower
              if trigger.from_state is defined and trigger.from_state is not none else '' %}
          {% set to_value = trigger.to_state.state | lower
              if trigger.to_state is defined and trigger.to_state is not none else '' %}
          {% set reset_at = as_timestamp(this.attributes.reset_at | default(0), 0) %}
          {% set grace_ok = reset_at == 0 or (as_timestamp(now()) - reset_at) >= startup_grace_seconds %}
          {% set evidence_live = trigger_id == 'evidence'
              and from_value not in invalid and to_value not in invalid and grace_ok %}
          {% set telemetry_live = trigger_id == 'telemetry'
              and from_value not in invalid and to_value not in invalid and grace_ok %}
          {% set source_obj = expand(source_entity) | first | default(none) %}
          {% set motion_obj = expand(motion_entity) | first | default(none) if motion_entity else none %}
          {% set source_age = (as_timestamp(now()) - as_timestamp(source_obj.last_changed, 0)) | int
              if source_obj is not none else 999999 %}
          {% set motion_age = (as_timestamp(now()) - as_timestamp(motion_obj.last_changed, 0)) | int
              if motion_obj is not none else 999999 %}
          {% set source_update_age = (as_timestamp(now()) - as_timestamp(source_obj.last_updated, 0)) | int
              if source_obj is not none else 999999 %}
          {% set motion_update_age = (as_timestamp(now()) - as_timestamp(motion_obj.last_updated, 0)) | int
              if motion_obj is not none else 999999 %}
          {% set tracked = [source_entity, motion_entity, temperature_entity,
                            humidity_entity, illuminance_entity, battery_entity]
                            | reject('equalto', '') | list %}
          {% set fresh = namespace(latest=0) %}
          {% for item in expand(tracked) %}
            {% set updated = as_timestamp(item.last_updated, 0) %}
            {% if updated > fresh.latest %}{% set fresh.latest = updated %}{% endif %}
          {% endfor %}
          {% set freshness = (as_timestamp(now()) - fresh.latest) | int if fresh.latest > 0 else 999999 %}
          {% set mismatch = not is_passive and
              ((source == 'on' and motion == 'none') or
               (source == 'off' and motion in active_motion)) %}
          {% set mismatch_persistent = mismatch and ([source_age, motion_age] | min) >= inconsistency_after_seconds %}
          {% set active_stuck =
              (is_passive and source == 'on' and source_update_age >= passive_stuck_after_seconds) or
              (not is_passive and source == 'on' and motion in ['small', 'large']
               and source_update_age >= active_stuck_after_seconds
               and motion_update_age >= active_stuck_after_seconds) %}
          {% if source == 'unavailable' or (not is_passive and motion == 'unavailable') %}
            unavailable
          {% elif source in ['unknown', ''] or (not is_passive and motion in ['unknown', '']) %}
            unknown
          {% elif not is_passive and freshness >= stale_after_seconds %}
            stale
          {% elif active_stuck or mismatch_persistent %}
            degraded
          {% elif mismatch %}
            {{ previous if previous in ['ok', 'initializing'] else 'initializing' }}
          {% elif is_passive and source == 'off' %}
            ok
          {% elif not is_passive and source == 'off' and motion == 'none' %}
            {% if trigger_id == 'reset' %}initializing
            {% elif previous == 'ok' or evidence_live or telemetry_live %}ok
            {% else %}initializing
            {% endif %}
          {% elif trigger_id == 'reset' %}
            initializing
          {% elif previous == 'ok' or evidence_live %}
            ok
          {% else %}
            initializing
          {% endif %}
        attributes: &presence_health_attributes
          contract_version: 1
          source_entity: "{{ source_entity }}"
          motion_entity: "{{ motion_entity }}"
          source_state: "{{ states(source_entity) }}"
          motion_state: "{{ states(motion_entity) if motion_entity else 'not_applicable' }}"
          temperature: "{{ states(temperature_entity) if temperature_entity else 'not_applicable' }}"
          temperature_entity: "{{ temperature_entity }}"
          humidity: "{{ states(humidity_entity) if humidity_entity else 'not_applicable' }}"
          humidity_entity: "{{ humidity_entity }}"
          illuminance: "{{ states(illuminance_entity) if illuminance_entity else 'not_applicable' }}"
          illuminance_entity: "{{ illuminance_entity }}"
          battery: "{{ states(battery_entity) if battery_entity else 'not_applicable' }}"
          battery_entity: "{{ battery_entity }}"
          linkquality: "{{ states(linkquality_entity) if linkquality_entity else 'not_applicable' }}"
          linkquality_entity: "{{ linkquality_entity }}"
          fading_time: "{{ states(fading_entity) if fading_entity else 'not_applicable' }}"
          motion_detection_mode: "{{ states(mode_entity) if mode_entity else 'not_applicable' }}"
          motion_detection_sensitivity: "{{ states(motion_sensitivity_entity) if motion_sensitivity_entity else 'not_applicable' }}"
          static_detection_distance: "{{ states(static_distance_entity) if static_distance_entity else 'not_applicable' }}"
          static_detection_sensitivity: "{{ states(static_sensitivity_entity) if static_sensitivity_entity else 'not_applicable' }}"
          freshness_seconds: >-
            {% set tracked = [source_entity, motion_entity, temperature_entity,
                              humidity_entity, illuminance_entity, battery_entity]
                              | reject('equalto', '') | list %}
            {% set fresh = namespace(latest=0) %}
            {% for item in expand(tracked) %}
              {% set updated = as_timestamp(item.last_updated, 0) %}
              {% if updated > fresh.latest %}{% set fresh.latest = updated %}{% endif %}
            {% endfor %}
            {{ ((as_timestamp(now()) - fresh.latest) | int) if fresh.latest > 0 else -1 }}
          presence_age_seconds: >-
            {% set item = expand(source_entity) | first | default(none) %}
            {{ ((as_timestamp(now()) - as_timestamp(item.last_changed, 0)) | int) if item is not none else -1 }}
          motion_age_seconds: >-
            {% set item = expand(motion_entity) | first | default(none) if motion_entity else none %}
            {{ ((as_timestamp(now()) - as_timestamp(item.last_changed, 0)) | int) if item is not none else -1 }}
          presence_update_age_seconds: >-
            {% set item = expand(source_entity) | first | default(none) %}
            {{ ((as_timestamp(now()) - as_timestamp(item.last_updated, 0)) | int) if item is not none else -1 }}
          motion_update_age_seconds: >-
            {% set item = expand(motion_entity) | first | default(none) if motion_entity else none %}
            {{ ((as_timestamp(now()) - as_timestamp(item.last_updated, 0)) | int) if item is not none else -1 }}
          last_device_update: >-
            {% set tracked = [source_entity, motion_entity, temperature_entity,
                              humidity_entity, illuminance_entity, battery_entity]
                              | reject('equalto', '') | list %}
            {% set fresh = namespace(latest=0) %}
            {% for item in expand(tracked) %}
              {% set updated = as_timestamp(item.last_updated, 0) %}
              {% if updated > fresh.latest %}{% set fresh.latest = updated %}{% endif %}
            {% endfor %}
            {{ as_datetime(fresh.latest).isoformat() if fresh.latest > 0 else '' }}
          reset_at: >-
            {% set source = states(source_entity) | lower %}
            {% set motion = states(motion_entity) | lower if motion_entity else 'none' %}
            {% if trigger.id | default('') == 'reset' or source in ['unknown', 'unavailable', '']
                  or (not is_passive and motion in ['unknown', 'unavailable', '']) %}
              {{ now().isoformat() }}
            {% else %}
              {{ this.attributes.reset_at | default('') }}
            {% endif %}
          last_evidence_at: >-
            {% set invalid = ['unknown', 'unavailable', ''] %}
            {% set from_value = trigger.from_state.state | lower
                if trigger.from_state is defined and trigger.from_state is not none else '' %}
            {% set to_value = trigger.to_state.state | lower
                if trigger.to_state is defined and trigger.to_state is not none else '' %}
            {% if trigger.id | default('') == 'evidence'
                  and from_value not in invalid and to_value not in invalid %}
              {{ now().isoformat() }}
            {% else %}
              {{ this.attributes.last_evidence_at | default('') }}
            {% endif %}
          policy: >-
            {{ 'passive_motion' if is_passive else '4in1_presence_and_motion' }}
          stale_after_seconds: "{{ 0 if is_passive else stale_after_seconds }}"
          active_stuck_after_seconds: >-
            {{ passive_stuck_after_seconds if is_passive else active_stuck_after_seconds }}

