name: Import validated Sonnet hold fix

on:
  push:
    branches:
      - fix/tv-office-state-semantics
    paths:
      - .github/workflows/import-sonnet-hold.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-sonnet-hold.yml

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'chore: run Sonnet hold importer'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/tv-office-state-semantics

      - name: Import validated subset
        run: |
          git fetch origin backup/sonnet-20260818
          git show origin/backup/sonnet-20260818:CLAUDE.md > CLAUDE.md
          node scripts/validation/import-sonnet-hold.mjs patch
          if grep -q 'mobile-perf-webp' dashboard-src/src/components/rooms/bruno-room-tile.ts; then
            echo 'Erro: migracao WebP do Sonnet foi importada indevidamente.' >&2
            exit 1
          fi

      - name: Install dashboard dependencies
        working-directory: dashboard-src
        run: npm ci

      - name: Full dashboard gate
        working-directory: dashboard-src
        run: npm run check

      - name: Align active bundle reference
        run: node scripts/validation/import-sonnet-hold.mjs bundle

      - name: Validate YAML after bundle update
        working-directory: dashboard-src
        run: npm run check:yaml

      - name: Whitespace gate
        run: git diff --check

      - name: Commit validated import
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CLAUDE.md \
            dashboard-src/src/components/rooms/bruno-room-tile.ts \
            config/configuration.yaml
          git diff --cached --stat
          git commit -m 'fix(ui): import validated iOS long-press behavior'
          git push origin HEAD:fix/tv-office-state-semantics
