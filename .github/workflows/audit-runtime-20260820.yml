name: Audit active dashboard runtime

on:
  push:
    branches: [fix/mobile-runtime-tv-curtain-20260819]
  pull_request:
    branches: [main]
    types: [synchronize]

jobs:
  audit:
    if: ${{ github.ref_name == 'fix/mobile-runtime-tv-curtain-20260819' || github.head_ref == 'fix/mobile-runtime-tv-curtain-20260819' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit active include graph and template closure
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, json

          def active_text(path):
              lines=[]
              for line in path.read_text(encoding='utf-8',errors='ignore').splitlines():
                  if line.lstrip().startswith('#'): continue
                  # Remove simple trailing YAML comments; URLs do not contain ' #'.
                  line=re.sub(r'\s+#.*$','',line)
                  lines.append(line)
              return '\n'.join(lines)+'\n'

          entry=Path('config/dashboards/views/bento_shell.yaml')
          seen=set(); ordered=[]
          inc_re=re.compile(r'!include\s+([^\s#]+)')
          dir_re=re.compile(r'!include_dir_merge_(?:named|list)\s+([^\s#]+)')
          def visit(path):
              path=path.resolve()
              if path in seen or not path.exists(): return
              seen.add(path); ordered.append(path)
              text=active_text(path)
              for m in inc_re.finditer(text): visit((path.parent/m.group(1).strip('"\'')).resolve())
              for m in dir_re.finditer(text):
                  d=(path.parent/m.group(1).strip('"\'')).resolve()
                  if d.is_dir():
                      for c in sorted(d.rglob('*.yaml')): visit(c)
          visit(entry)

          def refs_from_text(t):
              out=set(); lines=t.splitlines()
              for i,line in enumerate(lines):
                  m=re.match(r'^(\s*)template:\s*(.*)$',line)
                  if not m: continue
                  indent=len(m.group(1)); tail=m.group(2).strip()
                  if tail and tail not in ('|','>'):
                      if tail.startswith('[') and tail.endswith(']'):
                          out.update(x.strip(' "\'') for x in tail[1:-1].split(',') if x.strip())
                      else: out.add(tail.strip(' "\''))
                  j=i+1
                  while j<len(lines):
                      nxt=lines[j]; stripped=nxt.strip()
                      if not stripped: j+=1; continue
                      nindent=len(nxt)-len(nxt.lstrip())
                      if nindent<=indent: break
                      mm=re.match(r'^\s*-\s*([A-Za-z0-9_.-]+)\s*$',nxt)
                      if mm: out.add(mm.group(1))
                      j+=1
              return {x for x in out if re.fullmatch(r'[A-Za-z0-9_.-]+',x)}

          initial=set(); custom=set()
          for p in ordered:
              t=active_text(p)
              custom.update(re.findall(r'custom:([A-Za-z0-9_.-]+)',t))
              initial |= refs_from_text(t)

          defs={}
          for kind,d in [('button',Path('config/dashboards/templates/button_card_templates')),('streamline',Path('config/dashboards/templates/streamline_templates'))]:
              for p in sorted(d.rglob('*.yaml')):
                  text=p.read_text(encoding='utf-8',errors='ignore')
                  starts=[(m.start(),m.group(1)) for m in re.finditer(r'^([A-Za-z0-9_.-]+):(?:\s.*)?$',text,re.M)]
                  for idx,(pos,key) in enumerate(starts):
                      end=starts[idx+1][0] if idx+1<len(starts) else len(text)
                      block=text[pos:end].rstrip()+'\n'
                      defs[key]=(kind,p,block,refs_from_text(active_text(p)[0:0]+block))
          closure=set(); todo=list(initial); missing=set()
          while todo:
              key=todo.pop()
              if key in closure: continue
              closure.add(key)
              if key not in defs: missing.add(key); continue
              todo.extend(x for x in defs[key][3] if x not in closure)

          print('REACHABLE_YAML',len(ordered))
          for p in ordered: print('YAML',p.relative_to(Path.cwd()))
          print('CUSTOM_TYPES',json.dumps(sorted(custom)))
          print('INITIAL_TEMPLATE_REFS',json.dumps(sorted(initial)))
          print('TEMPLATE_CLOSURE',json.dumps(sorted(closure)))
          print('MISSING_TEMPLATE_KEYS',json.dumps(sorted(missing)))
          totals={'button':0,'streamline':0}
          for key in sorted(closure):
              if key in defs:
                  kind,p,block,deps=defs[key]; totals[kind]+=len(block.encode())
                  print('KEEP',kind,key,p,len(block.encode()),'deps='+','.join(sorted(deps)))
          print('MIN_TEMPLATE_BYTES',json.dumps(totals),'TOTAL',sum(totals.values()))
          PY
