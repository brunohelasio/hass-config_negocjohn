- type: vertical-stack
  cards:
    - type: custom:button-card
      entity: input_select.periodo_energia_dashboard
      show_icon: false
      show_name: false
      show_state: false
      tap_action:
        action: none
      triggers_update:
        - input_select.periodo_energia_dashboard
        - sensor.energia_total_casa_periodo_atual
      custom_fields:
        header: |
          [[[ return '<div style="font-size:11px;font-weight:700;letter-spacing:0.14em;color:rgba(255,255,255,0.46);text-transform:uppercase;">Energia</div>'; ]]]
        value: |
          [[[ 
            const v = states['sensor.energia_total_casa_periodo_atual']?.state;
            const num = (v !== undefined && v !== null && !['unknown','unavailable','none'].includes(v)) ? Number(v).toFixed(2) : '0.00';
            const p = states['input_select.periodo_energia_dashboard']?.state || 'Diário';
            return `<div style="font-size:18px;font-weight:700;color:rgba(255,255,255,0.96);">${p} · ${num} kWh</div>`;
          ]]]
        selector:
          card:
            # ANTERIOR: horizontal-stack com card_mod em #root; alguns wrappers nao aplicavam a pilula externa.
            type: custom:mod-card
            card_mod:
              style: |
                ha-card {
                  display: inline-flex !important;
                  width: max-content !important;
                  height: 30px !important;
                  padding: 3px !important;
                  border-radius: 999px !important;
                  background: rgba(0,0,0,0.22) !important;
                  border: 1px solid rgba(255,255,255,0.16) !important;
                  box-shadow: inset 0 1px 0 rgba(255,255,255,0.08) !important;
                  backdrop-filter: blur(14px) saturate(1.15) !important;
                  -webkit-backdrop-filter: blur(14px) saturate(1.15) !important;
                  box-sizing: border-box !important;
                  overflow: hidden !important;
                }
            card:
              type: horizontal-stack
              card_mod:
                style: |
                  #root {
                    gap: 0 !important;
                    margin: 0 !important;
                    padding: 0 !important;
                  }
              cards:
                - type: custom:button-card
                  name: Diário
                  show_icon: false
                  show_state: false
                  entity: input_select.periodo_energia_dashboard
                  variables:
                    periodo: Diário
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    data:
                      entity_id: input_select.periodo_energia_dashboard
                      option: Diário
                  styles: &energy_segment_style
                    card:
                      - height: 24px
                      - min-width: 48px
                      - border-radius: 999px
                      - background: >
                          [[[
                            // ANTERIOR: usava this._config?.name, que nao e confiavel dentro de styles.
                            const a = states['input_select.periodo_energia_dashboard']?.state === variables.periodo;
                            return a ? 'rgba(255,255,255,0.88)' : 'transparent';
                          ]]]
                      - border: none
                      - box-shadow: >
                          [[[
                            const a = states['input_select.periodo_energia_dashboard']?.state === variables.periodo;
                            return a ? '0 2px 8px rgba(0,0,0,0.16), inset 0 1px 0 rgba(255,255,255,0.45)' : 'none';
                          ]]]
                      - padding: 0 10px
                      - margin: 0
                      - box-sizing: border-box
                    name:
                      - color: >
                          [[[
                            const a = states['input_select.periodo_energia_dashboard']?.state === variables.periodo;
                            return a ? 'rgba(0,0,0,0.82)' : 'rgba(255,255,255,0.78)';
                          ]]]
                      - font-size: 10px
                      - font-weight: 700
                - type: custom:button-card
                  name: Semanal
                  show_icon: false
                  show_state: false
                  entity: input_select.periodo_energia_dashboard
                  variables:
                    periodo: Semanal
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    data:
                      entity_id: input_select.periodo_energia_dashboard
                      option: Semanal
                  styles: *energy_segment_style
                - type: custom:button-card
                  name: Mensal
                  show_icon: false
                  show_state: false
                  entity: input_select.periodo_energia_dashboard
                  variables:
                    periodo: Mensal
                  tap_action:
                    action: perform-action
                    perform_action: input_select.select_option
                    data:
                      entity_id: input_select.periodo_energia_dashboard
                      option: Mensal
                  styles: *energy_segment_style
      styles:
        grid:
          - grid-template-areas: '"header selector" "value selector"'
          - grid-template-columns: 1fr max-content
          - grid-template-rows: min-content min-content
          - column-gap: 10px
          - row-gap: 4px
        card:
          - background: transparent
          - border: none
          - box-shadow: none
          - padding: 12px 14px 2px
        custom_fields:
          header:
            - justify-self: start
          value:
            - justify-self: start
          selector:
            - justify-self: end
            - align-self: start

    - type: vertical-stack
      cards:
        - type: conditional
          conditions:
            - entity: input_select.periodo_energia_dashboard
              state: Diário
          card:
            type: custom:mini-graph-card
            entities:
              - entity: sensor.potencia_total_casa
                name: W
                color: '#6FB8FF'
            hours_to_show: 24
            points_per_hour: 4
            hour24: true
            height: 90
            lower_bound: -150
            smoothing: false
            line_width: 3
            line_color: '#6FB8FF'
            font_size: 75
            show:
              name: false
              icon: false
              state: false
              legend: false
              labels: true
              points: false
              fill: fade
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                  margin-top: -10px;
                  padding: 0 6px 14px 2px;
                }

        - type: conditional
          conditions:
            - entity: input_select.periodo_energia_dashboard
              state: Semanal
          card:
            type: custom:mini-graph-card
            entities:
              - entity: sensor.energia_total_casa_semanal
                name: kWh
                color: '#6FB8FF'
            hours_to_show: 168
            aggregate_func: max
            group_by: date
            hour24: true
            height: 90
            lower_bound: -0.05
            smoothing: false
            line_width: 3
            line_color: '#6FB8FF'
            font_size: 75
            show:
              name: false
              icon: false
              state: false
              legend: false
              labels: false
              points: false
              fill: fade
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                  margin-top: -10px;
                  padding: 0 6px 14px 2px;
                }

        - type: conditional
          conditions:
            - entity: input_select.periodo_energia_dashboard
              state: Mensal
          card:
            type: custom:mini-graph-card
            entities:
              - entity: sensor.energia_total_casa_mensal
                name: kWh
                color: '#6FB8FF'
            hours_to_show: 720
            aggregate_func: max
            group_by: date
            hour24: true
            height: 90
            lower_bound: -0.05
            smoothing: false
            line_width: 3
            line_color: '#6FB8FF'
            font_size: 75
            show:
              name: false
              icon: false
              state: false
              legend: false
              labels: true
              points: false
              fill: fade
            card_mod:
              style: |
                ha-card {
                  background: transparent !important;
                  border: none !important;
                  box-shadow: none !important;
                  margin-top: -10px;
                  padding: 0 6px 14px 2px;
                }
