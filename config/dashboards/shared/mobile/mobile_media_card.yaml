# mobile_media_card.yaml  (V3.1) — wrapper mobile do bloco Midia
# Criado: 2026-05-10
# Atualizado: 2026-05-11 — altura fixa para resolver bug de height:100% no swipe-card
#
# Reusa shared/grid-cards/bento_media.yaml.
#
# CAUSA DO BUG (V3.0 em branco):
#   bento_media.yaml tem:
#     custom:mod-card → :host { height: 100% } + ha-card { height: 100%; aspect-ratio: 1/1 }
#   Com o wrapper V3.0 em height:auto, height:100% resolvia para 0 →
#   swipe-card ficava com 0×0px → tela em branco.
#
# SOLUÇÃO (V3.1):
#   ha-card com altura fixa = calc(100vw - 28px) — mesma largura do conteúdo
#   disponível (viewport - 2×14px de padding da view). Isso garante que o
#   bento_media.yaml receba um parent com altura real, e o mod-card interno
#   com aspect-ratio: 1/1 renderiza um quadrado que cabe no viewport.
#
# ROLLBACK RÁPIDO para V3.0:
#   Reverter ha-card para: height: auto + min-height: 320px
# ══════════════════════════════════════════════════════════════════════════════

