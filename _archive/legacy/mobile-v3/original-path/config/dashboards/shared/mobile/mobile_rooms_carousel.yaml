# ══════════════════════════════════════════════════════════════════════════════
# mobile_rooms_carousel.yaml  (V3.4) — carrossel mobile dos cômodos secundários
# Criado: 2026-05-13
#
# Substitui localmente o rail horizontal contínuo por slides com 2 cards cada.
# O arquivo antigo mobile_rooms_rail.yaml permanece intacto para rollback.
# Slides: Office+Cozinha → Lavabo+Quarto Casal → Quarto Marina+Quarto Miguel.
# ══════════════════════════════════════════════════════════════════════════════

type: custom:mod-card
card_mod:
  style: |
    :host {
      display: block !important;
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
    }
    ha-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
      overflow-x: auto !important;
      overflow-y: visible !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
      scroll-snap-type: x mandatory !important;
      scroll-padding-left: 0 !important;
    }
    ha-card::-webkit-scrollbar { display: none !important; }
card:
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-auto-flow: column
    grid-auto-columns: 100%
    grid-template-rows: 168px
    gap: 14px
    margin: 0
    padding: 0
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        overflow: visible !important;
      }
  cards:
    # Slide 1 — Office / Cozinha
    - type: custom:mod-card
      card_mod:
        style: |
          :host { scroll-snap-align: start !important; }
          ha-card {
            height: 168px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: visible !important;
          }
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: 168px
          gap: 12px
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
        cards:
          - !include mobile_card_office.yaml
          - !include mobile_card_cozinha.yaml

    # Slide 2 — Lavabo / Quarto Casal
    - type: custom:mod-card
      card_mod:
        style: |
          :host { scroll-snap-align: start !important; }
          ha-card {
            height: 168px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: visible !important;
          }
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: 168px
          gap: 12px
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
        cards:
          - !include mobile_card_lavabo.yaml
          - !include mobile_card_quarto_casal.yaml

    # Slide 3 — Quarto Marina / Quarto Miguel
    - type: custom:mod-card
      card_mod:
        style: |
          :host { scroll-snap-align: start !important; }
          ha-card {
            height: 168px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            margin: 0 !important;
            overflow: visible !important;
          }
      card:
        type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
          grid-template-rows: 168px
          gap: 12px
          margin: 0
          padding: 0
        card_mod:
          style: |
            ha-card { background: transparent !important; border: none !important; box-shadow: none !important; }
        cards:
          - !include mobile_card_quarto_marina.yaml
          - !include mobile_card_quarto_miguel.yaml
