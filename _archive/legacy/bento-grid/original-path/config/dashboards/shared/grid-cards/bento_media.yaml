- type: custom:mod-card
  card_mod:
    style: |
      :host {
        height: 100% !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
      }
      ha-card {
        height: 100% !important;
        width: auto !important;
        max-width: 100% !important;
        aspect-ratio: 1 / 1 !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        margin: 0 auto !important;
      }
  card:
    type: custom:swipe-card
    parameters:
      pagination:
        type: bullets
        clickable: true
      roundLengths: true
      effect: slide
      speed: 600
      spaceBetween: 12
      threshold: 7
      autoHeight: false
      observer: true
      followFinger: true
      grabCursor: true
    cards:
      ########## SLIDE 1: ARTWORK + BARRA TRANSLÚCIDA ORIGINAL ##########
      - !include ../snippets/media-slide-focus.yaml

      ########## SLIDE 2: GRID 2x2 ##########
      - type: grid
        columns: 2
        square: true
        cards:
          # Slot 1: Smart TV
          - type: custom:button-card
            entity: media_player.android_tv_192_168_3_17
            template:
              - base
              - media_premium
              - icon_tv
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.media_focus_player
                option: media_player.android_tv_192_168_3_17
              haptic: light
            hold_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data: !include ../popup/media_all_players.yaml
            # Estilo local do slide 2x2: nao altera templates base/icon_* compartilhados.
            styles: &media_grid_player_styles
              card:
                - background: >
                    [[[
                      if (entity?.attributes?.entity_picture) {
                        return `linear-gradient(180deg, rgba(7,10,18,0.18) 0%, rgba(7,10,18,0.58) 100%), url("${entity.attributes.entity_picture}") center / cover no-repeat`;
                      }
                      const active = ['on','playing','paused'].includes(entity?.state ?? '');
                      return active
                        ? 'linear-gradient(160deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.12) 100%)'
                        : 'linear-gradient(160deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.045) 100%)';
                    ]]]
                - border: 1px solid rgba(255,255,255,0.14)
                - box-shadow: inset 0 1px 0 rgba(255,255,255,0.10), 0 8px 22px rgba(0,0,0,0.16)
                - border-radius: 18px
                - overflow: hidden
                - backdrop-filter: blur(16px) saturate(1.18)
                - -webkit-backdrop-filter: blur(16px) saturate(1.18)
                - box-sizing: border-box

          # Slot 2: Echo Show
          - type: custom:button-card
            entity: media_player.echo_show
            template:
              - base
              - media_premium
              - icon_tv
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.media_focus_player
                option: media_player.echo_show
              haptic: light
            hold_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data: !include ../popup/media_all_players.yaml
            styles: *media_grid_player_styles

          # Slot 3: Spotify
          - type: custom:button-card
            entity: media_player.spotifyplus_bruno_helasio
            template:
              - base
              - media_premium
              - icon_spotify
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.media_focus_player
                option: media_player.spotifyplus_bruno_helasio
              haptic: light
            hold_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data: !include ../popup/media_all_players.yaml
            styles: *media_grid_player_styles

          # Slot 4: Echo Pop Office
          - type: custom:button-card
            entity: media_player.echo_pop_office
            template:
              - base
              - media_premium
              - icon_tv
            tap_action:
              action: call-service
              service: input_select.select_option
              service_data:
                entity_id: input_select.media_focus_player
                option: media_player.echo_pop_office
              haptic: light
            hold_action:
              action: fire-dom-event
              browser_mod:
                service: browser_mod.popup
                data: !include ../popup/media_all_players.yaml
            styles: *media_grid_player_styles
