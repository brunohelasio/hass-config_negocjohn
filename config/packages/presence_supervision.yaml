  # --------------------------------------------------------------------------
  # Estado semantico supervisionado. A versao anterior de cada package fica
  # preservada como rollback; cards e subviews passam a consumir esta camada.
  # --------------------------------------------------------------------------
  - sensor:
      - name: Sala Semantic State Supervised
        default_entity_id: sensor.sala_semantic_state_supervised
        unique_id: sala_semantic_state_supervised
        variables:
          health_entity: sensor.sala_presence_health
          motion_entity: binary_sensor.sala_motion_recent
          occupancy_entity: binary_sensor.sala_occupancy
          meeting_entity: ''
          working_entity: ''
          occupied_label: Ocupada
          idle_icon: mdi:sofa
        icon: &presence_semantic_icon >-
          {% set health = states(health_entity) %}
          {% if health in ['unavailable', 'unknown', 'stale', 'degraded'] %}
            mdi:alert-circle-outline
          {% elif health == 'initializing' %}
            mdi:progress-clock
          {% elif meeting_entity and is_state(meeting_entity, 'on') %}
            mdi:video-account
          {% elif working_entity and is_state(working_entity, 'on') %}
            mdi:briefcase
          {% elif is_state(motion_entity, 'on') and is_state(occupancy_entity, 'on') %}
            mdi:account
          {% elif is_state(motion_entity, 'on') %}
            mdi:walk
          {% elif is_state(occupancy_entity, 'on') %}
            mdi:clock-outline
          {% else %}
            {{ idle_icon }}
          {% endif %}
        state: &presence_semantic_state >-
          {% set health = states(health_entity) %}
          {% if health == 'unavailable' %}offline
          {% elif health == 'unknown' %}unknown_source
          {% elif health == 'initializing' %}initializing
          {% elif health == 'stale' %}stale
          {% elif health == 'degraded' %}degraded
          {% elif meeting_entity and is_state(meeting_entity, 'on') %}meeting
          {% elif working_entity and is_state(working_entity, 'on') %}working
          {% elif is_state(motion_entity, 'on') and is_state(occupancy_entity, 'on') %}occupied
          {% elif is_state(motion_entity, 'on') %}motion
          {% elif is_state(occupancy_entity, 'on') %}recent
          {% else %}none
          {% endif %}
        attributes: &presence_semantic_attributes
          display: >-
            {% set health = states(health_entity) %}
            {% if health == 'unavailable' %}Sensor indisponível
            {% elif health == 'unknown' %}Estado desconhecido
            {% elif health == 'initializing' %}Inicializando sensor
            {% elif health == 'stale' %}Dados desatualizados
            {% elif health == 'degraded' %}Sensor instável
            {% elif meeting_entity and is_state(meeting_entity, 'on') %}Em reunião
            {% elif working_entity and is_state(working_entity, 'on') %}Trabalhando
            {% elif is_state(motion_entity, 'on') and is_state(occupancy_entity, 'on') %}{{ occupied_label }}
            {% elif is_state(motion_entity, 'on') %}Presença
            {% elif is_state(occupancy_entity, 'on') %}Ocupação recente
            {% else %}
            {% endif %}
          priority: >-
            {% if states(health_entity) in ['unavailable', 'unknown', 'stale', 'degraded'] %}4
            {% elif meeting_entity and is_state(meeting_entity, 'on') %}3
            {% elif working_entity and is_state(working_entity, 'on') %}2
            {% elif is_state(occupancy_entity, 'on') %}1
            {% else %}0
            {% endif %}
          health: "{{ states(health_entity) }}"
          health_entity: "{{ health_entity }}"
          motion_recent: "{{ states(motion_entity) }}"
          motion_entity: "{{ motion_entity }}"
          occupancy: "{{ states(occupancy_entity) }}"
          occupancy_entity: "{{ occupancy_entity }}"

      - name: Office Semantic State Supervised
