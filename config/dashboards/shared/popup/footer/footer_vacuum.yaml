action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: "Roborock S7"
    # --- ANTERIOR (size: wide + popup_styles / fullscreen: true — causava corte inferior ou não funcionava) ---
    # size: wide
    # popup_styles:
    #   - style: all
    #     styles: |
    #       ha-dialog {
    #         --popup-max-height: 1176px;
    #         --popup-background-color: rgba(15, 20, 35, 0.75);
    #         --mdc-theme-surface: rgba(20, 24, 33, 0.88);
    #         --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.56);
    #         --dialog-box-shadow: 0 0 24px rgba(62, 132, 255, 0.22), 0 0 70px rgba(62, 132, 255, 0.14);
    #         --dialog-content-padding: 8px 8px 4px 8px;
    #         backdrop-filter: blur(12px);
    #         -webkit-backdrop-filter: blur(12px);
    #       }
    # fullscreen: true
    # --- FIM ANTERIOR ---
    # FULLSCREEN REAL — initial_style é o parâmetro correto (ver livingroom_fullscreen.yaml)
    initial_style: fullscreen
    dismissable: true
    style: >
      --popup-width: 100vw;
      --popup-max-width: 100vw;
      --popup-border-width: 0;
      --popup-background-color: rgba(15, 20, 35, 0.75);
      --mdc-theme-surface: rgba(20, 24, 33, 0.88);
      --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.56);
      --dialog-box-shadow: 0 0 24px rgba(62, 132, 255, 0.22), 0 0 70px rgba(62, 132, 255, 0.14);
    card_mod:
      style:
        .: |
          ha-dialog {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
          }
          ha-dialog > ha-dialog-header {
            display: none !important;
          }
        ha-dialog$: |
          .mdc-dialog__scrim {
            background-color: rgba(0, 0, 0, 0.56) !important;
          }
          .mdc-dialog__container {
            padding: 0 !important;
            align-items: stretch !important;
            justify-content: stretch !important;
          }
          .mdc-dialog__surface {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            overflow: hidden !important;
          }
          .mdc-dialog__title {
            display: none !important;
          }
          .mdc-dialog__content {
            padding: 8px 8px 4px 8px !important;
            height: 100vh !important;
            max-height: 100vh !important;
            overflow: hidden !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: stretch !important;
            justify-content: center !important;
          }
    content:
      type: custom:layout-card
      # card_mod no layout-card: suprime scrollbar residual do ha-card (overflow: auto padrão do tema HA)
      card_mod:
        style: |
          ha-card {
            overflow: hidden !important;
            scrollbar-width: none !important;
          }
          ha-card::-webkit-scrollbar {
            display: none !important;
          }
      layout_type: custom:grid-layout
      layout:
        grid-template-columns: 300px minmax(0, 1fr) 260px
        grid-template-rows: minmax(0, 1fr)
        grid-template-areas: '"summary map settings"'
        grid-gap: 8px
        # ANTERIOR: height: calc(100vh - 12px) — forçava layout a preencher 100vh; 90vh deixa margem e centering via flex no mdc-dialog__content
        height: 90vh
        max-height: 90vh
        margin: 0
        padding: 0
        box-sizing: border-box
        # ANTERIOR: align-items: start — colunas cresciam livremente além da altura do container
        align-items: stretch
        overflow: hidden
      cards:

        # ==================================================================
        # COLUNA 1 — SUMMARY
        # ==================================================================
        - type: vertical-stack
          view_layout:
            grid-area: summary
          cards:
            - type: entities
              title: Summary
              show_header_toggle: false
              entities:
                - entity: vacuum.roborock_s7
                  name: Roborock S7
                  secondary_info: last-changed
                - entity: sensor.roborock_s7_vacuum_error
                  name: Erro
                - entity: sensor.roborock_s7_comodo_atual
                  name: Cômodo Atual
                - entity: binary_sensor.roborock_s7_mop_attached
                  name: Mop Acoplado
                - entity: sensor.roborock_s7_bateria
                  name: Bateria
                - type: attribute
                  entity: vacuum.roborock_s7
                  attribute: fan_speed
                  name: Fan Speed
                - type: divider
                - entity: select.roborock_s7_intensidade_do_mop
                  name: Intensidade do Mop
                - entity: select.roborock_s7_modo_mop
                  name: Modo do Mop
            - type: horizontal-stack
              cards:
                - type: custom:button-card
                  entity: vacuum.roborock_s7
                  icon: mdi:play-pause
                  show_name: false
                  styles:
                    card:
                      - height: 42px
                      - border-radius: 10px
                      - background: rgba(255,255,255,0.07)
                      - box-shadow: none
                      - border: none
                    icon:
                      - color: rgba(255,255,255,0.70)
                      - width: 22px
                  tap_action:
                    action: call-service
                    service: vacuum.start
                    service_data:
                      entity_id: vacuum.roborock_s7
                - type: custom:button-card
                  entity: vacuum.roborock_s7
                  icon: mdi:home
                  show_name: false
                  styles:
                    card:
                      - height: 42px
                      - border-radius: 10px
                      - background: rgba(255,255,255,0.07)
                      - box-shadow: none
                      - border: none
                    icon:
                      - color: rgba(255,255,255,0.70)
                      - width: 22px
                  tap_action:
                    action: call-service
                    service: vacuum.return_to_base
                    service_data:
                      entity_id: vacuum.roborock_s7
                - type: custom:button-card
                  entity: vacuum.roborock_s7
                  icon: mdi:map-marker
                  show_name: false
                  styles:
                    card:
                      - height: 42px
                      - border-radius: 10px
                      - background: rgba(255,255,255,0.07)
                      - box-shadow: none
                      - border: none
                    icon:
                      - color: rgba(255,255,255,0.70)
                      - width: 22px
                  tap_action:
                    action: call-service
                    service: vacuum.locate
                    service_data:
                      entity_id: vacuum.roborock_s7

        # ==================================================================
        # COLUNA 2 — MAPA
        # tiles: [] remove tiles autogenerated (README L191)
        # icons: [] remove icons autogenerated (README L189)
        # ==================================================================
        - type: custom:xiaomi-vacuum-map-card
          view_layout:
            grid-area: map
          vacuum_platform: Roborock
          entity: vacuum.roborock_s7
          map_source:
            camera: image.roborock_s7_map_0_custom
          calibration_source:
            camera: true
          map_locked: true
          tiles: []
          icons: []
          card_mod:
            style: |
              ha-card {
                /* ANTERIOR: height: calc(100vh - 20px) — referenciava 100vh; agora usa 90vh alinhado com o layout */
                height: calc(90vh - 16px) !important;
                max-height: calc(90vh - 16px) !important;
                overflow: hidden !important;
                --map-card-primary-color: #FFFFFF30;
                --map-card-secondary-color: #FFFFFF10;
                --map-card-secondary-text-color: #9da0a2;
                --map-card-zoomer-background: none;
                --map-card-internal-big-radius: 0.6em !important;
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
              }
              div.map-wrapper {
                /* ANTERIOR: calc(100vh - 76/96/130px) — todas baseadas em 100vh; agora usa 90vh alinhado com layout */
                /* 90vh - 16px ha-card margin - 32px toolbar - 54px controls = 90vh - 102px */
                max-height: calc(90vh - 112px) !important;
                padding: 0.35rem 0 0.25rem !important;
              }
              div.controls-wrapper {
                padding-top: 0;
                padding-bottom: 0;
                margin: 0;
              }
              div.map-controls-wrapper {
                padding: 2px 6px;
              }
              xvmc-zoom-buttons {
                display: none !important;
              }
              paper-button {
                --mdc-icon-size: 1.35em;
                color: #9da0a2 !important;
                padding: 0.32em;
              }
              #map-image {
                filter: brightness(0.7);
              }

        # ==================================================================
        # COLUNA 3 — SETTINGS
        # ==================================================================
        - type: entities
          view_layout:
            grid-area: settings
          title: Settings
          show_header_toggle: false
          card_mod:
            style: |
              ha-card {
                /* ANTERIOR: max-height: calc(100vh - 20px) — alinhado agora com 90vh do layout */
                max-height: calc(90vh - 16px) !important;
                overflow: hidden !important;
              }
              .card-header {
                padding: 10px 16px 4px !important;
                font-size: 16px !important;
                line-height: 20px !important;
              }
              .card-content {
                padding: 4px 12px 8px !important;
              }
              #states > * {
                margin: 0 !important;
              }
          entities:
            - entity: number.roborock_s7_volume
              name: Volume
            - entity: switch.roborock_s7_nao_perturbe
              name: Não Perturbe
            - entity: time.roborock_s7_comecar_nao_perturbe
              name: Início NP
            - entity: time.roborock_s7_terminar_nao_perturbe
              name: Fim NP
            - entity: switch.roborock_s7_dock_luz_indicadora_de_status
              name: Luz Indicadora
            - entity: switch.roborock_s7_dock_bloqueio_infantil
              name: Bloqueio Infantil
            - type: divider
            - entity: sensor.roborock_s7_area_de_limpeza
              name: Área (Última)
            - entity: sensor.roborock_s7_tempo_de_limpeza
              name: Tempo (Última)
            - entity: sensor.roborock_s7_area_total_de_limpeza
              name: Área Total
            - entity: sensor.roborock_s7_tempo_total_de_limpeza
              name: Tempo Total
            - entity: sensor.roborock_s7_contagem_total_de_limpeza
              name: Nº de Limpezas
