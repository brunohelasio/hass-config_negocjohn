      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-src/package-lock.json

      - name: Install dependencies
        working-directory: dashboard-src
        run: npm ci

      - name: YAML
        working-directory: dashboard-src
        run: npm run check:yaml

      - name: Backtick guard changed sources
        run: |
          node scripts/validation/check-backtick.mjs \
            dashboard-src/src/components/rooms/bruno-room-tile.ts \
            dashboard-src/src/themes/josh-phone-on-bridge.ts \
            config/www/bruno-ui/core/bruno-josh.js

      - name: Typecheck
        working-directory: dashboard-src
        run: npm run typecheck

      - name: Lint
        working-directory: dashboard-src
        run: npm run lint

      - name: Tests
        working-directory: dashboard-src
        run: npm run test

      - name: Build
        working-directory: dashboard-src
        run: npm run build

      - name: Publish active bundle pointer and docs
        run: |
          python3 <<'PY'
          import json, re
          from pathlib import Path
          bundle = json.loads(Path('config/www/dashboard/manifest.json').read_text(encoding='utf-8'))['bundle']
          p = Path('config/configuration.yaml')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^(\s*)- /local/dashboard/(bruno-dashboard\.[A-Za-z0-9_-]+\.js)\s*$')
          matches = list(pattern.finditer(text))
          if len(matches) != 1: raise SystemExit(f'expected one active bundle; found {len(matches)}')
          old = matches[0].group(2)
          if old != bundle:
              indent = matches[0].group(1)
              repl = f'{indent}# ANTERIOR (rollback Josh round2): - /local/dashboard/{old}\n{indent}- /local/dashboard/{bundle}'
              p.write_text(pattern.sub(repl, text, count=1), encoding='utf-8')
          cp = Path('docs/CHECKPOINT-ATUAL.md')
          cp.write_text(cp.read_text(encoding='utf-8').replace('BUNDLE_PENDENTE', bundle), encoding='utf-8')
          rd = Path('docs/38-v3-josh-hemma-lavabo-20260822.md')
          rd.write_text(rd.read_text(encoding='utf-8') + f'\n## Build round2\nBundle gerado: `{bundle}`.\n', encoding='utf-8')
          print(f'{old} -> {bundle}')
          PY

      - name: Scope guard
        run: |
          python3 <<'PY'
          import subprocess
          allowed = {
            '.github/workflows/build-josh-round4-final.yml',
            'dashboard-src/src/components/rooms/bruno-room-tile.ts',
            'dashboard-src/src/themes/josh-phone-on-bridge.ts',
            'config/www/bruno-ui/core/bruno-josh.js',
            'docs/CHECKPOINT-ATUAL.md','docs/38-v3-josh-hemma-lavabo-20260822.md',
            'docs/LEIA-PRIMEIRO.md','docs/16-ai-working-guide.md','docs/33-runtime-mobile-consolidado.md','docs/15-decisions-log.md',
            'config/configuration.yaml',
          }
          bad=[]
          for line in subprocess.check_output(['git','status','--porcelain=v1'], text=True).splitlines():
              path=line[3:]
              if ' -> ' in path: path=path.split(' -> ',1)[1]
              if path.startswith('config/www/dashboard/'): continue
              if path not in allowed: bad.append(line)
          if bad: raise SystemExit('unexpected files:\n'+'\n'.join(bad))
          print('scope ok')
          PY

      - name: Commit round2 candidate
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-src/src/components/rooms/bruno-room-tile.ts \
                  dashboard-src/src/themes/josh-phone-on-bridge.ts \
