type: custom:layout-card
layout_type: custom:grid-layout
layout:
  grid-template-columns: repeat(3, minmax(0, 1fr))
  # A MÁGICA DA ALTURA: Força as duas linhas a dividirem os 40vh exatos
  grid-template-rows: repeat(2, calc((40vh - 10px) / 2))
  grid-gap: 10px
  margin: 0px !important
  padding: 0px !important
  # NOVO (2026-07-09) — MODO PHONE (Opcao A mobile): em <=800px a matriz vira
  # 2 colunas x 3 linhas com altura FIXA por card (as linhas de 40vh do tablet
  # dependiam da celula do grid da home, que no phone e empilhada/auto).
  # ROLLBACK: remover este bloco mediaquery.
  mediaquery:
    '(max-width: 800px)':
      grid-template-columns: repeat(2, minmax(0, 1fr))
      # Fase 2 (2026-07-09): 150px cortava status semanticos e o 4o indicador
      # (feedback do usuario). 176px + PNG reduzido nos cards resolve.
      # ANTERIOR (Fase 1): repeat(3, 150px)
      # ANTERIOR (2026-07-09 a 2026-08-10): repeat(3, 176px)
      #
      # ANTERIOR (2026-08-10): 160px. Os 16px por linha entravam no orcamento que
      # deixa a terceira dupla (Marina/Miguel) aparecendo pela metade em vez de
      # comecar fora da tela — o recorte parcial e o que sinaliza que ha mais.
      # A verificacao geometrica mostrou que 160px ainda corta o quarto dot do
      # Office: 28 + 7 + (4x26 + 3x4) + 21 = 172px. Esta e a menor altura que
      # preserva os tamanhos e gaps ja aprovados.
      # ANTERIOR (2026-08-16, revertido): 172px 172px 14px 172px — a linha de
      # 14px hospedava o indicador textual. Ela criava um vao de 30px entre a 2a
      # e a 3a faixa (8 + 14 + 8) contra 8px das demais, e o vao permanecia
      # visivel durante a rolagem, quando o indicador ja havia sumido.
      #
      # NOVO (2026-08-16, rev.2): tres linhas iguais, row-gap uniforme em toda a
      # matriz, em qualquer estado de rolagem. O aviso de atividade abaixo da
      # dobra passou a ser o microindicador da rail (bento-sidebar-card.js), que
      # nao ocupa espaco no grid.
      grid-template-rows: repeat(3, 172px)
      # ANTERIOR: grid-gap: 10px — 8px pelo mesmo motivo do grid da secao.
      grid-gap: 8px
card_mod:
  style: |
    :host { 
      height: 100% !important; 
      margin: 0 !important; 
      padding: 0 !important; 
      display: block !important; 
    }
    #root { 
      height: 100% !important; 
      margin: 0 !important; 
      padding: 0 !important; 
    }
    #root > * { 
      height: 100% !important; 
      min-width: 0 !important;
      margin: 0 !important; 
    }
cards:
  - !include ../../views/main-grid/bento_office.yaml
  - !include ../../views/main-grid/bento_cozinha.yaml
  - !include ../../views/main-grid/bento_lavabo.yaml
  - !include ../../views/main-grid/bento_quarto_casal.yaml
