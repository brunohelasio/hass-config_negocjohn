# ══════════════════════════════════════════════════════════════════════════════
# mobile_comodos_grid.yaml  (V3.4) — grade 2-col dos comodos secundarios
# Criado: 2026-05-10
#
# Reusa os mesmos wrappers mobile_card_<comodo>.yaml usados pelo carrossel
# da aba Casa. Sala compacta preservada comentada para rollback; a Sala
# horizontal agora fica acima deste grid em mobile-comodos.yaml.
# ══════════════════════════════════════════════════════════════════════════════

type: custom:layout-card
layout_type: custom:grid-layout
layout:
  # ANTERIOR: grid-template-columns: 1fr 1fr
  # minmax(0,1fr) previne que conteúdo interno expanda a coluna além do viewport.
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)
  grid-auto-rows: 168px
  gap: 12px
  # align-items/justify-items: stretch garante que cada card preencha
  # toda a célula do grid (sem desalinhamento esquerdo/direito).
  align-items: stretch
  justify-items: stretch
  margin: 0
  padding: 0
card_mod:
  style: |
    ha-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
    }
cards:
  # ANTERIOR (V3): Sala compacta dentro do grid.
  # Mantida comentada para rollback; a Sala horizontal é incluída na view.
  # - !include mobile_card_sala_compact.yaml
  - !include mobile_card_office.yaml
  - !include mobile_card_cozinha.yaml
  - !include mobile_card_lavabo.yaml
  - !include mobile_card_quarto_casal.yaml
  - !include mobile_card_quarto_marina.yaml
  - !include mobile_card_quarto_miguel.yaml
