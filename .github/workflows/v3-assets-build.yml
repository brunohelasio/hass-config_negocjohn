name: Build V3 Assets

on:
  push:
    branches:
      - feat/assets-v3-5g
    paths:
      - 'config/www/bruno-ui/assets/V3/**'
      - 'scripts/assets/build_v3.py'
      - '.github/workflows/v3-assets-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/assets-v3-5g
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: python -m pip install --upgrade pillow

      - name: Gerar assets V3
        run: python scripts/assets/build_v3.py

      - name: Registrar assets otimizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/www/bruno-ui/assets/v3/ docs/_tmp/v3-build/
          if ! git diff --cached --quiet; then
            git commit -m "feat(assets): publish optimized V3 room assets"
            git push
          fi
