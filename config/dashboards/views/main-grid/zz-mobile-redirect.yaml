##################################################
#                                                #
#         MOBILE AUTO-REDIRECT (V3 — 2026-05-10) #
#                                                #
#  Card invisivel inserido apenas para detectar  #
#  largura de tela <= 800px e redirecionar       #
#  automaticamente para /lovelace/mobile-casa.   #
#                                                #
#  Nao modifica desktop/tablet de forma alguma:  #
#  - sem grid-area no layout principal;          #
#  - display: none + 0px em todos os breakpoints;#
#  - JS so dispara em /lovelace/summary          #
#    (path padrao do main.yaml) e quando a       #
#    largura for mobile.                         #
#                                                #
#  Rollback: deletar/renomear este arquivo ou    #
#  comentar este bloco. Nada mais a fazer.       #
##################################################

- type: custom:button-card
  show_icon: false
  show_name: false
  show_state: false
  show_label: false
  tap_action:
    action: none
  triggers_update:
    - sensor.time
  card_mod:
    style: |
      :host {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        position: absolute !important;
        pointer-events: none !important;
        visibility: hidden !important;
      }
      ha-card {
        display: none !important;
        width: 0 !important;
        height: 0 !important;
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
      }
  custom_fields:
    redirect: |
      [[[
        try {
          var path = location.pathname || '';
          var isMobile = window.matchMedia('(max-width: 800px)').matches;
          var alreadyOnMobile = path.indexOf('/mobile-') !== -1;
          var alreadyRedirected = window.__negocjohn_mobile_redirected === true;
          if (isMobile && !alreadyOnMobile && !alreadyRedirected) {
            window.__negocjohn_mobile_redirected = true;
            // Mantem o slug do dashboard (lovelace) e troca apenas o path da view.
            var parts = path.split('/').filter(function(s){ return s.length > 0; });
            // parts[0] = 'lovelace' (slug do dashboard)
            var slug = parts[0] || 'lovelace';
            location.replace('/' + slug + '/mobile-casa');
          }
        } catch (e) {
          // Falha silenciosa: nunca quebra o card desktop.
        }
        return '';
      ]]]
