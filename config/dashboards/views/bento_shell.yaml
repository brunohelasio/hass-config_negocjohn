# View-shell (Etapa 2) — PAINEL PADRAO. Assumiu o path `bento-lab` (antes do
# bento_main, agora comentado). Assim, "voltar ao painel principal" a partir de
# qualquer subview (que navega para `bento-lab`) cai DENTRO da shell.
# Alterna secoes por hash: bento-lab#home / bento-lab#cameras.
# type: panel => 1 unico card (a shell) ocupando a tela toda. Como a view e
# unica, a rail (dentro da shell) nunca re-monta ao alternar de secao.
# Rollback: voltar path para `bento-shell` e descomentar bento_main em ui-lovelace-main.yaml.
title: Home
path: bento-lab
subview: false
theme: tablet
type: panel
cards:
  - type: custom:bruno-shell
    default_section: home
    # NOVO (Etapa A/B): rail POR SEÇÃO. `default` (app-nav) nas seções gerais;
    # `rooms` (Home + cômodos) nas seções de cômodo. A shell troca os ITENS no
    # MESMO elemento (moldura/posição fixas; Home ancorado).
    # ROLLBACK: voltar para `rail: !include shell/rail.yaml` e remover rails/
    # section_rails + a seção `sala`.
    rails:
      default: !include shell/rail.yaml
      rooms: !include shell/rail_rooms.yaml
    default_rail: default
    section_rails:
      sala: rooms
      office: rooms
      cozinha: rooms
      casal: rooms
      marina: rooms
      miguel: rooms
    # NOVO (full-bleed): imagem de fundo da shell por seção (sangra sob rail +
    # faixas + blocos). Seção sem entrada aqui => camada transparente (grafite).
    # ROLLBACK: comentar este bloco `backdrops` (volta ao fundo grafite de hoje).
    backdrops:
      home: /local/images/home_savant.jpg?v=20260702-all-images-1
      # Cache-bust da imagem da Sala (atualizada pelo usuário em 2026-06-27).
      sala: /local/images/sala_estar.jpg?v=20260702-all-images-1
      office: /local/images/office.jpg?v=20260702-all-images-1
      cozinha: /local/images/cozinha.jpg?v=20260702-all-images-1
      casal: /local/images/quarto_casal.jpg?v=20260702-all-images-1
      marina: /local/images/quarto_marina.jpg?v=20260702-all-images-1
      miguel: /local/images/quarto_miguel.jpg?v=20260702-all-images-1
      cameras: /local/images/home_savant.jpg?v=20260702-all-images-1
      roborock: /local/images/home_savant.jpg?v=20260702-all-images-1
      floorplan: /local/images/home_savant.jpg?v=20260702-all-images-1
    backdrop_effects:
      cameras:
        blur: 24px
        scale: 1.035
        saturate: 1.08
        brightness: 0.94
        dim: 0.20
      roborock:
        blur: 24px
        scale: 1.035
        saturate: 1.08
        brightness: 0.94
        dim: 0.20
      floorplan:
        blur: 24px
        scale: 1.035
        saturate: 1.08
        brightness: 0.94
        dim: 0.20
    sections:
      # HOME V2 — unica versao ativa desde 2026-08-03.
      #
      # A Home V1 (shell/section_home.yaml) foi APOSENTADA: ela dependia de 8
      # arquivos de views/main-grid/, arquivados na Fase 3 (decisao D2). A V2
      # esta em producao desde 2026-07-24 e recebeu todo o trabalho posterior
      # (tema Josh, modo tile, faixa de comodos) — reverter desfaria tudo isso.
      #
      # RESTAURAR A V1, se um dia for preciso (3 comandos):
      #   git checkout pre-dashboard-architecture -- config/dashboards/views/shell/section_home.yaml
      #   git checkout pre-dashboard-architecture -- config/dashboards/views/main-grid/
      #   git checkout pre-dashboard-architecture -- config/dashboards/shared/grid-cards/
      #   (e trocar a linha abaixo por: home: !include shell/section_home.yaml)
      #
      # Conferir integridade a qualquer momento:
      #   perl scripts/validation/check-includes.pl .
      home: !include shell/section_home_v2.yaml
      cameras: !include shell/section_cameras.yaml
      # ROBOROCK inline (evita "Unable to read file" caso o arquivo novo
      # shell/section_roborock.yaml nao tenha sincronizado no /config). Conteudo
      # identico ao do arquivo (mantido como referencia/rollback).
      roborock:
        type: custom:bruno-roborock-subview
      # PLANTA 3D inline (mesmo padrao do Roborock): conteudo da planta dentro
      # da shell fixa. Rollback: remover esta secao e voltar o item floorplan da
      # rail para o popup shared/popup/planta_3d.yaml.
      floorplan:
        type: custom:bruno-planta-3d-subview
      # NOVO (Etapa B): a Sala vira SEÇÃO da mesma shell (conteúdo-only; rail é da
      # shell, via section_rails: rooms).
      # ══ FASE 5c, 2026-08-05 — as seis subviews viram UM componente ═════════
      # Os seis arquivos de ~8.900 linhas cada — 41.421 no total, das quais só
      # 5.876 eram distintas — dão lugar a seis instâncias de
      # `bruno-room-subview`, parametrizadas por `room:`.
      #
      # A medição que autorizou a troca está em `scripts/harness/`: a geometria
      # dos seis, módulo a módulo, contra `subview-baseline.json`. Resultado:
      # 36 de 36 campos com delta ZERO, viewport 1280×720, incluindo as três
      # particularidades da Cozinha (sem linha de câmeras+hub, coluna direita de
      # 308px, sem A/C).
      #
      # ROLLBACK (sem reiniciar): comentar este bloco e descomentar o ANTERIOR
      # logo abaixo. Os seis arquivos antigos continuam no disco e carregados.
      sala:
        type: custom:bruno-room-subview
        room: sala
      office:
        type: custom:bruno-room-subview
        room: office
      cozinha:
        type: custom:bruno-room-subview
        room: cozinha
      casal:
        type: custom:bruno-room-subview
        room: casal
      marina:
        type: custom:bruno-room-subview
        room: marina
      miguel:
        type: custom:bruno-room-subview
        room: miguel
      # ── ANTERIOR (rollback) — um arquivo JS por cômodo ──────────────────────
      # sala:
      #   type: custom:bruno-sala-subview
      # office:
      #   type: custom:bruno-office-subview
      # cozinha:
      #   type: custom:bruno-cozinha-subview
      # casal:
      #   type: custom:bruno-quarto-casal-subview
      # marina:
      #   type: custom:bruno-quarto-marina-subview
      # miguel:
      #   type: custom:bruno-quarto-miguel-subview
      # ───────────────────────────────────────────────────────────────────────
      # NOVO (2026-08-01): Music Assistant - redireciona para ingress nativo do addon
      music:
        type: custom:bruno-music-subview
