name: Prepare PR601 release package

on:
  push:
    branches:
      - fix/tv-office-state-semantics
    paths:
      - .github/workflows/pr601-package.yml

permissions:
  contents: write

jobs:
  package:
    if: github.event.head_commit.message == 'chore: prepare PR601 release package'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-office-state-semantics
          fetch-depth: 0

      - name: Replace temporary long-press bridge with validated minimal fix
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          # main.ts só havia sido tocado para registrar a ponte temporária.
          subprocess.run([
              'git', 'checkout', 'origin/main', '--',
              'dashboard-src/src/main.ts'
          ], check=True)

          guard = Path('dashboard-src/src/services/ui/ios-longpress-guard.ts')
          if guard.exists():
              guard.unlink()

          p = Path('dashboard-src/src/components/rooms/bruno-room-tile.ts')
          s = p.read_text(encoding='utf-8')

          old_css = """      transition: opacity 420ms ease, filter 420ms ease;\n    }"""
          new_css = """      transition: opacity 420ms ease, filter 420ms ease;\n      -webkit-touch-callout: none;\n      -webkit-user-drag: none;\n      -webkit-user-select: none;\n      user-select: none;\n    }"""
          if old_css not in s:
              raise SystemExit('Bloco CSS esperado de .room-asset não encontrado')
          s = s.replace(old_css, new_css, 1)

          old_off = 'html`<img class="room-asset room-asset-off" src=${off} alt="" decoding="async" />`'
          new_off = 'html`<img class="room-asset room-asset-off" src=${off} alt="" decoding="async" draggable="false" />`'
          old_on = 'html`<img class="room-asset room-asset-on" src=${onImg} alt="" decoding="async" />`'
          new_on = 'html`<img class="room-asset room-asset-on" src=${onImg} alt="" decoding="async" draggable="false" />`'
          if old_off not in s or old_on not in s:
              raise SystemExit('Tags img esperadas do room-tile não encontradas')
          s = s.replace(old_off, new_off, 1).replace(old_on, new_on, 1)
          p.write_text(s, encoding='utf-8')

      - name: Install dependencies
        working-directory: dashboard-src
        run: npm ci

      - name: Full validation gate
        working-directory: dashboard-src
        run: npm run check

      - name: Align bundle reference and create copy-only package
        shell: python
        run: |
          from pathlib import Path
          import shutil

          dist = Path('config/www/dashboard')
          bundles = [p for p in dist.glob('bruno-dashboard.*.js') if not p.name.endswith('.map')]
          if len(bundles) != 1:
              raise SystemExit(f'Esperava 1 bundle, encontrei {len(bundles)}: {bundles}')
          bundle = bundles[0].name

          cfg = Path('config/configuration.yaml')
          s = cfg.read_text(encoding='utf-8')
          old = '    - /local/dashboard/bruno-dashboard.DqBPUi80.js'
          new = (
              '    # ANTERIOR (rollback PR601 antes do long-press): - /local/dashboard/bruno-dashboard.DqBPUi80.js\n'
              f'    - /local/dashboard/{bundle}'
          )
          if old not in s:
              raise SystemExit('Linha ativa DqBPUi80 não encontrada em configuration.yaml')
          cfg.write_text(s.replace(old, new, 1), encoding='utf-8')

          root = Path('_deploy/pr601')
          if root.exists():
              shutil.rmtree(root)
          target = root / 'config'
          (target / 'www').mkdir(parents=True, exist_ok=True)
          shutil.copy2(cfg, target / 'configuration.yaml')
          shutil.copytree(dist, target / 'www' / 'dashboard')

          (root / 'LEIA-ME.txt').write_text(
              'PACOTE DE TESTE DO PR #601\n\n'
              'Este diretório existe só para validação no Everex/iPhone.\n'
              'Não será levado ao main depois da aprovação.\n\n'
              'Uso: copie TODO o conteúdo da pasta config deste pacote para a pasta config local '
              'e depois para \\\\192.168.3.154\\config, substituindo os arquivos quando solicitado.\n\n'
              f'Bundle ativo deste pacote: {bundle}\n',
              encoding='utf-8'
          )
          print(f'PACKAGE_BUNDLE={bundle}')

      - name: Validate YAML after bundle alignment
        working-directory: dashboard-src
        run: npm run check:yaml

      - name: Whitespace gate
        run: git diff --check

      - name: Commit clean source and validation package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr601-package.yml
          git add -A \
            dashboard-src/src/components/rooms/bruno-room-tile.ts \
            dashboard-src/src/main.ts \
            dashboard-src/src/services/ui/ios-longpress-guard.ts \
            config/configuration.yaml \
            _deploy/pr601 \
            .github/workflows/pr601-package.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix: finalize PR601 validation package'
          git push origin HEAD:fix/tv-office-state-semantics
