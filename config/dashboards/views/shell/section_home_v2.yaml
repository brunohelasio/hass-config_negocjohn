# ==========================================================================
# Secao HOME V2 da shell — REV.4 (2026-07-25, pos-feedback).
#
# FEATURE FLAG: a "flag" da Home V2 e a troca de UMA linha em
# views/bento_shell.yaml:
#   sections: home: !include shell/section_home_v2.yaml   (V2 LIGADA)
#   sections: home: !include shell/section_home.yaml      (V1 / rollback)
# Nunca as duas ao mesmo tempo => zero render duplo / listeners duplicados.
#
# LICAO ESTRUTURAL (rev.1-3): card_mod NAO atua em custom:layout-card e
# `height: 100%` NAO resolve dentro do <hui-card> que o HA 2026.3 cria em
# volta de cada card. Por isso TODAS as alturas aqui sao explicitas
# (px/vh/calc) e a soma fecha o viewport por construcao.
#
# MUDANCAS DA REV.4:
#   - Comodos + Acoes Rapidas viraram UM bloco unico (`bottom_block`), com
#     moldura unica na base (fim da sensacao de duas faixas).
#   - `dynamic` passou de 4 para 8 colunas: a metade esquerda so recebe card
#     quando ha um TERCEIRO ativo (2a coluna). A area vazia e transparente e
#     nao captura toque, entao o hero segue clicavel por baixo.
#   - `welcome` passou a 4 colunas: o hero e alinhado a esquerda e seu fundo
#     vem do backdrop da shell, entao nada muda visualmente.
#
# Aritmetica do desktop (content-slot tem padding 12px x2):
#   48px (badges) + HERO + 0px (safety) + (23vh + 52px) (bloco inferior)
#   + 3 gaps de 10px (30px) + 24px (padding) = 100vh
#   => HERO = calc(77vh - 154px)
#   (a mesma constante esta em v2/bento_dynamic.yaml -> available_height;
#    mudar aqui exige mudar la.)
#
# Layout desktop/tablet:
#   linha 1  top_badges (48px)
#   linha 2  HERO (welcome, 4 col) | AREA DINAMICA (dynamic, 8 col)
#   linha 3  0px — safety net Sagaland p/ areas usadas so no phone
#   linha 4  BLOCO INFERIOR (moldura unica: 7 comodos + acoes rapidas)
#
# PHONE (<=800px): layout IDENTICO ao da V1 (decisao do usuario) — mesmo
# empilhamento, mesmos cards; `dynamic` e `bottom_block` como linhas 0px.
# ==========================================================================
type: custom:layout-card
layout_type: custom:grid-layout
layout:
  margin: 0
  padding: 0
  grid-gap: 10px
  grid-template-columns: 0px repeat(12, minmax(0, 1fr))
  # ══ REV.6 (2026-08-06) — A LINHA-FANTASMA SAI, E COM ELA O DEGRAU ═════════
  #
  # ANTERIOR (rev.5): 0px 48px calc(77vh - 154px) calc(23vh + 52px)
  # ANTERIOR (rev.4): 48px calc(77vh - 154px) 0px calc(23vh + 52px)
  # ANTERIOR (rev.3): 48px calc(77vh - 166px) 23vh 0px 54px
  #
  # A rev.5 moveu a linha-fantasma de 0px para o TOPO e aceitou, por escrito,
  # que "a faixa de badges desce 10px" — o grid-gap passou a ficar ACIMA dela.
  # Era esse o degrau na transicao Home -> subview: nas subviews a barra e a
  # PRIMEIRA linha real, sem gap acima.
  #
  # TENTATIVA FRUSTRADA (2026-08-06, 2 rodadas): margin-top: -10px no :host do
  # bruno-top-badges-card. NAO FUNCIONA na Home — o layout-card envolve cada
  # card num wrapper, e o item do grid e o WRAPPER, nao o card. A margem movia
  # o card DENTRO do wrapper. No banco de medicao o card era anexado direto ao
  # slot, sem wrapper, e por isso a medicao dizia que funcionava.
  #
  # CORRECAO REAL: a linha-fantasma nao e mais necessaria. As quatro areas que
  # ela sustentava (sala, comodos, energy, media) pertencem a cards com
  # show.mediaquery (max-width: 800px) — no desktop eles NAO renderizam, e
  # area de card nao renderizado nao precisa existir. As outras tres (camera,
  # roborock, quick_actions) nao sao usadas por card nenhum desde a Home V3 e a
  # remocao da faixa de acoes rapidas (5e.2).
  #
  # Aritmetica com 3 linhas (content-slot tem padding 12px x2):
  #   48px (badges) + HERO + BLOCO INFERIOR + 2 gaps de 10px + 24px = 100vh
  #   BLOCO INFERIOR = calc(23vh - 12px)   <- so os comodos; o dock de 54px saiu
  #   => HERO = calc(77vh - 80px)
  #   (a mesma constante esta em v2/bento_dynamic.yaml -> available_height;
  #    mudar aqui exige mudar la.)
  grid-template-rows: 48px calc(77vh - 80px) calc(23vh - 12px)
  grid-template-areas: |
    "sidebar top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges"
    "sidebar welcome welcome welcome welcome dynamic dynamic dynamic dynamic dynamic dynamic dynamic dynamic"
    "sidebar bottom_block bottom_block bottom_block bottom_block bottom_block bottom_block bottom_block bottom_block bottom_block bottom_block bottom_block bottom_block"
  # PHONE: reproducao fiel do bloco phone da V1 (layout mobile intocado),
  # com as areas extras `dynamic` e `bottom_block` como linhas 0px
  # (Sagaland: toda area existe em todo breakpoint).
  mediaquery:
    '(max-width: 800px)':
      grid-gap: 10px
      grid-template-columns: minmax(0, 1fr)
      grid-template-rows: minmax(44px, auto) minmax(0, auto) 176px auto minmax(140px, auto) 0px minmax(180px, auto) 0px 0px 0px 0px 0px
      grid-template-areas: |
        "top_badges"
        "welcome"
        "sala"
        "comodos"
        "energy"
        "roborock"
        "media"
        "camera"
        "quick_actions"
        "sidebar"
        "dynamic"
        "bottom_block"
cards:
  # Faixa superior de status: mesma da V1 (shell preservada).
  - !include ../main-grid/bento_top_badges.yaml
  # Hero com protagonismo + agenda integrada (hero_layout: v2).
  - !include ../main-grid/v2/bento_welcome_v2.yaml
  # Sala especial APENAS no phone (desktop: card padrao no bloco inferior).
  - !include ../main-grid/v2/bento_sala_phone.yaml
  # Matriz 2x3 de comodos APENAS no phone.
  - !include ../main-grid/v2/bento_comodos_phone.yaml
  # Area dinamica (container JS): camera / Roborock / midia por relevancia.
  - !include ../main-grid/v2/bento_dynamic.yaml
  # Energia e midia permanentes APENAS no phone (mobile intocado).
  - !include ../main-grid/v2/bento_energy_phone.yaml
  - !include ../main-grid/v2/bento_media_phone.yaml
  # Bloco inferior unificado (7 comodos + acoes rapidas na mesma moldura).
  # ANTERIOR (rev.3, blocos separados — arquivos preservados no disco):
  #   - !include ../main-grid/v2/bento_comodos_strip.yaml
  #   - !include ../main-grid/v2/bento_quick_actions_v2.yaml
  - !include ../main-grid/v2/bento_bottom_block.yaml
