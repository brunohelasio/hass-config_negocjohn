# ===========================================================================
# Pacote: q_marina_presence
# Objetivo: replicar no Q. Marina a mesma camada logica usada na Sala.
#
# - Motion Recent: movimento/passagem recente para acender apenas o dot.
# - Occupancy: ocupacao real, exigindo permanencia antes de ligar.
#
# FALLBACK RAPIDO:
# - Remover/comentar `q_marina_presence: !include packages/q_marina_presence.yaml`
#   em configuration.yaml para voltar ao uso direto do sensor 4-in-1.
# ===========================================================================

template:
  - binary_sensor:
      - name: Q Marina Motion Recent
        unique_id: q_marina_motion_recent
        device_class: motion
        icon: mdi:account
        # NOVO (2026-07-12): falha/cache nao pode virar OFF/ON valido.
        availability: >-
          {{ is_state('sensor.q_marina_presence_health', 'ok') }}
        # ANTERIOR (2026-07-03): gating por motion_state ('medium' nao existe no
        # enum do sensor; 'static' ficava de fora; gate atrasava o dot).
        # state: >-
        #   {% set presence = is_state('binary_sensor.sensor_4_in_1_q_marina_presence', 'on') %}
        #   {% set motion = states('sensor.sensor_4_in_1_q_marina_motion_state') | lower %}
        #   {{ presence and (motion in ['small', 'medium', 'large']) }}
        # delay_off:
        #   seconds: 25
        # NOVO (molde unico): presenca imediata = espelho do sensor bruto.
        state: >-
          {{ is_state('binary_sensor.sensor_4_in_1_q_marina_presence', 'on') }}
        delay_off:
          seconds: 5
        attributes:
          source_entity: binary_sensor.sensor_4_in_1_q_marina_presence
          motion_state: "{{ states('sensor.sensor_4_in_1_q_marina_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_q_marina_illuminance') }}"
          semantic_role: passage_indicator
          fallback_note: "Presenca imediata: espelho do sensor bruto, apenas para o dot."

      - name: Q Marina Occupancy
        unique_id: q_marina_occupancy
        device_class: occupancy
        icon: mdi:account
        availability: >-
          {{ is_state('sensor.q_marina_presence_health', 'ok') }}
        # ANTERIOR (2026-07-03): exigia motion 'medium'/'large' ('medium' nao existe;
        # crianca parada/lendo = 'static' → ocupacao nunca ligava).
        # state: >-
        #   {% set presence = is_state('binary_sensor.sensor_4_in_1_q_marina_presence', 'on') %}
        #   {% set motion = states('sensor.sensor_4_in_1_q_marina_motion_state') | lower %}
        #   {% set room_active = is_state('light.grupo_luzes_quarto_marina', 'on') %}
        #   {{ presence and (motion in ['medium', 'large'] or (motion == 'small' and room_active)) }}
        # delay_on:
        #   seconds: 45
        # delay_off:
        #   seconds: 90
        # ANTERIOR (2026-07-04, trava de contexto — REMOVIDA): com AC/Echo ligados,
        # a ocupacao ficava presa em ON indefinidamente (defeito confirmado no
        # Q. Miguel; a Marina so nao apresentou porque o AC estava desligado).
        # state: >-
        #   {% set presence = is_state('binary_sensor.sensor_4_in_1_q_marina_presence', 'on') %}
        #   {% set ac_on = states('climate.ac_quarto_marina') in ['cool', 'fan_only', 'dry', 'heat', 'heat_cool', 'auto'] %}
        #   {% set echo_on = is_state('media_player.echo_pop_marina', 'playing') %}
        #   {% set context = ac_on or echo_on %}
        #   {{ presence or (is_state('binary_sensor.q_marina_occupancy', 'on') and context) }}
        # delay_off: 300
        # NOVO: ocupacao = SOMENTE presenca sustentada; folga de 3 min cobre as
        # piscadas do radar.
        state: >-
          {{ is_state('binary_sensor.sensor_4_in_1_q_marina_presence', 'on') }}
        delay_on:
          seconds: 60
        delay_off:
          seconds: 180
        attributes:
          source_entity: binary_sensor.sensor_4_in_1_q_marina_presence
          motion_state: "{{ states('sensor.sensor_4_in_1_q_marina_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_q_marina_illuminance') }}"
          semantic_role: real_occupancy
          fallback_note: "Ocupacao real: somente presenca sustentada (60s liga / 180s solta)."

  - sensor:
      - name: Q Marina Semantic State
        unique_id: q_marina_semantic_state
        # ANTERIOR (2026-07-04): texto seguia so a ocupacao (ficava visivel apos o
        # dot apagar). NOVO: exige presenca ativa junto; a entidade q_marina_occupancy
        # mantem a liberacao longa para automacoes.
        icon: >-
          {% if is_state('binary_sensor.q_marina_occupancy', 'on') and is_state('binary_sensor.q_marina_motion_recent', 'on') %}
            mdi:account
          {% else %}
            mdi:bed-single
          {% endif %}
        state: >-
          {% if is_state('binary_sensor.q_marina_occupancy', 'on') and is_state('binary_sensor.q_marina_motion_recent', 'on') %}
            occupied
          {% else %}
            none
          {% endif %}
        attributes:
          display: >-
            {% if is_state('binary_sensor.q_marina_occupancy', 'on') and is_state('binary_sensor.q_marina_motion_recent', 'on') %}
              Ocupada
            {% else %}

            {% endif %}
          priority: >-
            {% if is_state('binary_sensor.q_marina_occupancy', 'on') and is_state('binary_sensor.q_marina_motion_recent', 'on') %}1
            {% else %}0
            {% endif %}
          motion_recent: "{{ states('binary_sensor.q_marina_motion_recent') }}"
          occupancy: "{{ states('binary_sensor.q_marina_occupancy') }}"
          source_entity: binary_sensor.sensor_4_in_1_q_marina_presence
          motion_state: "{{ states('sensor.sensor_4_in_1_q_marina_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_q_marina_illuminance') }}"
