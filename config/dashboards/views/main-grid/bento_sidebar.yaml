# NOVO 2026-05-09 (revisão): flex aplicado em #root, não em ha-card.
# CAUSA da regressão observada na primeira tentativa:
#   custom:stack-in-card envolve TODOS os filhos em um <div id="root"> interno.
#   Aplicar display:flex em ha-card só fazia o #root ser o único flex item —
#   align-items:center "centralizava" o div root, mas justify-content:space-between
#   não tinha o que espaçar (1 só item). Resultado: 11 ícones empilhados no topo.
# Correção:
#   - ha-card mantém apenas o glass + altura 100%.
#   - #root recebe o flex column space-between align-items center
#     → os 2 vertical-stack viram flex items reais e se distribuem topo/base.
card_mod:
  style: |
    :host {
      height: 100% !important;
      margin: 0 !important;
      display: block !important;
    }
    ha-card {
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
      background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)) !important;
      backdrop-filter: blur(18px) saturate(1.2) !important;
      -webkit-backdrop-filter: blur(18px) saturate(1.2) !important;
      border: 1px solid rgba(255,255,255,0.10) !important;
      border-radius: 16px !important;
      overflow: hidden !important;
      --ha-card-backdrop-filter: none !important;
      --ha-card-background: transparent !important;
      --ha-card-border-width: 0 !important;
    }
    ha-card::before {
      display: none !important;
    }
    /* container real dos filhos do stack-in-card */
    #root {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: space-between !important;
      height: 100% !important;
      width: 100% !important;
      box-sizing: border-box !important;
      padding: 8px 0 !important;
    }
    /* cada filho de #root (vertical-stack TOP/BOTTOM) — não estica */
    #root > * {
      flex: 0 0 auto !important;
      width: auto !important;
    }
# Fix 1 (P1): "- !include" criava [[array]] duplo pois bento_sidebar.yaml é sequência YAML
# ANTERIOR: cards:\n  - !include ../../shared/grid-cards/bento_sidebar.yaml
cards: !include ../../shared/grid-cards/bento_sidebar.yaml
