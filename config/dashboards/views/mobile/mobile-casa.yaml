# ══════════════════════════════════════════════════════════════════════════════
# mobile-casa.yaml  (V3) — Aba Casa
# Criado: 2026-05-10 — Mobile V3
#
# Estrutura: badges (scroll horiz) → hero compacto → Sala → rail comodos
#            → quick actions → pill navbar (fixed).
#
# Slug do dashboard confirmado: "lovelace" → URL: /lovelace/mobile-casa
#
# REGRA DE OURO: arquivo NOVO. Nada do views/main.yaml ou main-grid foi
# alterado. Rollback: comentar !include em ui-lovelace-main.yaml.
# ══════════════════════════════════════════════════════════════════════════════

title: Casa
path: mobile-casa
icon: mdi:home-variant
subview: false
theme: tablet

type: custom:grid-layout
card_mod:
  style: |
    hui-grid-layout {
      background: rgb(0, 0, 0);
      min-height: 100vh;
      overflow-x: hidden !important;
      max-width: 100vw !important;
    }
layout:
  margin: 0
  padding: 14px 14px calc(96px + env(safe-area-inset-bottom, 0px)) 14px
  # ANTERIOR: grid-template-columns: 1fr
  # 1fr = minmax(auto,1fr) — min-content de filhos pode expandir a coluna.
  # minmax(0,1fr) forca o minimo a zero, contendo qualquer overflow horizontal.
  grid-template-columns: minmax(0, 1fr)
  grid-auto-rows: min-content
  grid-gap: 10px

cards:
  # ── 0) Reverse redirect — envia desktop/tablet de volta para bento-lab ───
  # Se largura >= 801px (tablet landscape / desktop) e a sessão do HA
  # tiver persistido a view mobile como última visitada, este card redireciona
  # de volta para /slug/bento-lab silenciosamente.
  # Flag __negocjohn_desktop_redirected evita loop com zz-mobile-redirect.
  - !include ../mobile/mobile-desktop-redirect.yaml

  # ── 1) Badges (scroll horizontal) ───────────────────────────────────────
  - !include ../../shared/mobile/mobile_top_badges.yaml

  # ── 2) Hero compacto ────────────────────────────────────────────────────
  - !include ../../shared/mobile/mobile_hero_welcome.yaml

  # ── 3) Sala (largura total) ─────────────────────────────────────────────
  - !include ../../shared/mobile/mobile_sala_card.yaml

  # ── 4) Carrossel dos demais comodos (2 cards por slide) ─────────────────
  # ANTERIOR (V3 rail contínuo — rollback rápido):
  # - !include ../../shared/mobile/mobile_rooms_rail.yaml
  - !include ../../shared/mobile/mobile_rooms_carousel.yaml

  # ── 5) Acoes rapidas ────────────────────────────────────────────────────
  - !include ../../shared/mobile/mobile_quick_actions.yaml

  # ── 6) Pill navbar (position: fixed — ancora ao final da view) ──────────
  - !include ../../shared/mobile/mobile_pill_nav.yaml
