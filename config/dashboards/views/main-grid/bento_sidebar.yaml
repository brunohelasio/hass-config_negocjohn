# NOVO 2026-05-09: ha-card como flex column com space-between + align-items center.
# - flex column distribui filhos no eixo vertical
# - justify-content: space-between empurra grupo inferior para a base sem precisar
#   de spacer 1fr nem propagação de altura através de hui-grid-layout aninhado
# - align-items: center centraliza horizontalmente cada filho (vertical-stack TOP/BOTTOM),
#   desde que os filhos não tenham largura 100% (garantido em shared/grid-cards/bento_sidebar.yaml
#   via :host width 42px nos botões individuais).
card_mod:
  style: |
    :host {
      height: 100% !important;
      margin: 0 !important;
      display: block !important;
    }
    ha-card {
      height: 100% !important;
      margin: 0 !important;
      padding: 8px 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: space-between !important;
      box-sizing: border-box !important;
      background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)) !important;
      backdrop-filter: blur(18px) saturate(1.2) !important;
      -webkit-backdrop-filter: blur(18px) saturate(1.2) !important;
      border: 1px solid rgba(255,255,255,0.10) !important;
      border-radius: 16px !important;
      overflow: hidden !important;
      --ha-card-backdrop-filter: none !important;
      --ha-card-background: transparent !important;
      --ha-card-border-width: 0 !important;
    }
    ha-card::before {
      display: none !important;
    }
    /* cada filho direto (vertical-stack TOP/BOTTOM) é flex item:
       não estica, mantém largura natural dos botões (42px). */
    ha-card > * {
      flex: 0 0 auto !important;
    }
# Fix 1 (P1): "- !include" criava [[array]] duplo pois bento_sidebar.yaml é sequência YAML
# ANTERIOR: cards:\n  - !include ../../shared/grid-cards/bento_sidebar.yaml
cards: !include ../../shared/grid-cards/bento_sidebar.yaml
