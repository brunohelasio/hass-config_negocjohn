name: Align local dashboard bundle

on:
  push:
    branches:
      - fix/tv-office-state-semantics
    paths:
      - .github/workflows/align-local-bundle.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tv-office-state-semantics

      - name: Align configuration.yaml to validated local build
        shell: python
        run: |
          from pathlib import Path
          p = Path('config/configuration.yaml')
          s = p.read_text(encoding='utf-8')
          old = '    - /local/dashboard/bruno-dashboard.DqBPUi80.js'
          new = ('    # ANTERIOR (rollback TV/Office + long-press): - /local/dashboard/bruno-dashboard.DqBPUi80.js\n'
                 '    - /local/dashboard/bruno-dashboard.BgWkHdc4.js')
          if old not in s:
              raise SystemExit('hash anterior esperado não encontrado')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

      - name: Commit alignment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/configuration.yaml
          git commit -m 'chore: align dashboard bundle BgWkHdc4'
          git push origin HEAD:fix/tv-office-state-semantics
