name: Finalize mobile runtime PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'fix/mobile-runtime-tv-curtain-20260819' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dashboard-src/package-lock.json

      - name: Finalize, validate, build and publish branch
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/finalize-mobile-runtime.sh /tmp/finalize-mobile-runtime.sh
          python3 <<'PY'
          from pathlib import Path
          path = Path('/tmp/finalize-mobile-runtime.sh')
          text = path.read_text(encoding='utf-8')
          old = """  config/www/dashboard \\
"""
          if old not in text:
              raise SystemExit('linha config/www/dashboard não encontrada no staging')
          text = text.replace(old, '', 1)
          old_force = "git add -f config/www/dashboard/*.br config/www/dashboard/*.gz"
          new_force = """git add -u config/www/dashboard || true
git add -f \\
  config/www/dashboard/*.js \\
  config/www/dashboard/*.js.map \\
  config/www/dashboard/manifest.json \\
  config/www/dashboard/bruno-loader.js \\
  config/www/dashboard/*.br \\
  config/www/dashboard/*.gz"""
          if old_force not in text:
              raise SystemExit('linha git add -f não encontrada')
          path.write_text(text.replace(old_force, new_force, 1), encoding='utf-8')
          PY
          bash /tmp/finalize-mobile-runtime.sh
