# ══════════════════════════════════════════════════════════════════════════════
# mobile_rooms_rail.yaml  (V3) — rail horizontal dos comodos secundarios
# Criado: 2026-05-10
#
# Office, Cozinha, Lavabo, Quarto Casal, Quarto Marina, Quarto Miguel.
# Cada item e um wrapper mobile dedicado (mobile_card_<comodo>.yaml) que
# inclui o respectivo shared/grid-cards/bento_<comodo>.yaml — preserva
# 100% das entidades, templates, ações e visual definidos no desktop.
#
# Largura por card: calc(50vw - 22px) — mostra 2 cards completos + peek
# do terceiro. Scroll horizontal touch via overflow-x: scroll + scroll-snap.
# ══════════════════════════════════════════════════════════════════════════════

type: custom:mod-card
card_mod:
  style: |
    :host {
      display: block !important;
      width: 100% !important;
    }
    ha-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      overflow-x: auto !important;
      overflow-y: visible !important;
      -webkit-overflow-scrolling: touch !important;
      scrollbar-width: none !important;
      scroll-snap-type: x mandatory !important;
      /* scroll-padding garante que o snap leve em conta o padding lateral do layout-card */
      scroll-padding-left: 14px !important;
      padding: 0 !important;
      display: block !important;
    }
    ha-card::-webkit-scrollbar { display: none !important; }
card:
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-auto-flow: column
    grid-auto-columns: calc(50vw - 22px)
    grid-template-rows: 168px
    gap: 10px
    margin: 0
    padding: 0 14px
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        overflow: visible !important;
      }
  cards:
    - type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            scroll-snap-align: start !important;
            min-width: calc(50vw - 22px) !important;
            width: calc(50vw - 22px) !important;
            height: 168px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            overflow: visible !important;
          }
      card: !include mobile_card_office.yaml

    - type: custom:mod-card
      card_mod:
        style: |
          ha-card {
            scroll-snap-align: start !important;
            min-width: calc(50vw - 22px) !important;
            width: calc(50vw - 22px) !important;
            height: 168px !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
            overflow: visible !important;
          }
