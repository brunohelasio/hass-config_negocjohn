# Secao HOME da shell.
# Reproduz o mosaico do bento_main SEM risco de transcricao: mantem EXATAMENTE as
# mesmas colunas/linhas/areas do painel atual, apenas com a 1a coluna (a da rail)
# em 0px — ja que a rail agora vive na moldura da shell. Os cards de conteudo sao
# reaproveitados por include, SEM edicao (mesmos arquivos do bento_main).
#   - NAO inclui bento_sidebar (a rail e da shell).
#   - NAO inclui zz-mobile-redirect (mobile segue tratado fora da shell).
type: custom:layout-card
layout_type: custom:grid-layout
card_mod:
  style: |
    :host { height: 100% !important; }
    #root { height: 100% !important; }
layout:
  margin: 0
  padding: 0
  grid-gap: 10px
  grid-template-columns: 0px repeat(3, minmax(0, 1.15fr)) repeat(4, minmax(0, 1fr)) repeat(2, minmax(0, 0.84fr)) repeat(3, minmax(0, 1.22fr))
  # NOVO (E1): faixa inferior (ações rápidas) 74px -> 54px (régua compartilhada
  # com as subviews). O dock preenche a faixa (height:100%); botões cabem em 54px.
  # NOVO (full-bleed fix): a linha de energia/mídia (3ª) vira minmax(16vh,1fr)
  # para ABSORVER a sobra de altura e deixar o dock ENCOSTADO na base (antes a
  # sobra caía abaixo do dock, que ficava "alto" com vazio embaixo). Demais
  # blocos intactos. ANTERIOR (rollback): grid-template-rows: auto 40vh 16vh 24vh 54px
  grid-template-rows: auto 40vh minmax(16vh, 1fr) 24vh 54px
  grid-template-areas: |
    "sidebar top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges top_badges"
    "sidebar welcome welcome welcome welcome welcome sala sala comodos comodos comodos comodos comodos"
    "sidebar welcome welcome welcome welcome welcome energy energy energy energy roborock roborock roborock"
    "sidebar welcome welcome welcome welcome welcome media media media media camera camera camera"
    "sidebar quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions quick_actions"
cards:
  # Redirect mobile preservado (vinha do bento_main): so renderiza/age em <=800px.
  - !include ../main-grid/zz-mobile-redirect.yaml
  # NOVO (full-bleed): a imagem migrou para a camada .backdrop da SHELL (sangra
  # sob o rail). O hero_stage cobria só o conteúdo (col 2/-1), deixando seam na
  # borda do rail. Desativado. ROLLBACK: descomentar a linha abaixo e comentar o
  # bloco `backdrops` em bento_shell.yaml.
  # - !include ../main-grid/bento_hero_stage.yaml
  - !include ../main-grid/bento_top_badges.yaml
  - !include ../main-grid/bento_welcome.yaml
  - !include ../main-grid/bento_sala.yaml
  - !include ../main-grid/bento_comodos.yaml
  - !include ../main-grid/bento_energy.yaml
  - !include ../main-grid/bento_roborock.yaml
  - !include ../main-grid/bento_camera.yaml
  - !include ../main-grid/bento_quick_actions.yaml
  - !include ../main-grid/bento_media.yaml
