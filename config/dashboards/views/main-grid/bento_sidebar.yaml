# YAML sidebar retry 2026-05-15
#
# Intentional constraints:
# - Home is a static visual marker for the Bento view.
# - No icon uses input_select state for selected styling.
# - No YAML anchors or aliases are used.
# - Top and bottom groups are positioned by the root button-card grid.
# - The JavaScript custom card remains in /www as fallback, but is not loaded.
type: custom:button-card
view_layout:
  grid-area: sidebar
show_icon: false
show_name: false
show_state: false
show_label: false
tap_action:
  action: none
hold_action:
  action: none
card_mod:
  style: |
    :host {
      width: 65px !important;
      height: 100% !important;
      display: block !important;
      margin: 0 !important;
    }
styles:
  card:
    - height: 100%
    - width: 65px
    - padding: 8px 0
    - background: 'linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30))'
    - backdrop-filter: blur(18px) saturate(1.2)
    - -webkit-backdrop-filter: blur(18px) saturate(1.2)
    - border: 1px solid rgba(255,255,255,0.10)
    - border-radius: 16px
    - overflow: hidden
    - box-shadow: none
  grid:
    - grid-template-areas: '"top" "bottom"'
    - grid-template-columns: 1fr
    - grid-template-rows: max-content 1fr
    - height: 100%
    - width: 100%
  custom_fields:
    top:
      - place-self: start center
      - width: max-content
      - padding-top: 4px
    bottom:
      - place-self: end center
      - width: max-content
      - padding-bottom: 4px
custom_fields:
  top:
    card:
      type: vertical-stack
      cards:
        - type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: none
          hold_action:
            action: none
          card_mod:
            style: |
              :host {
                width: 42px !important;
                display: block !important;
                margin: 3px 0 !important;
              }
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.82)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';
              ]]]
          styles:
            card:
              - width: 42px
              - height: 42px
              - border-radius: 12px
              - padding: 0
              - background: rgba(255,255,255,0.12)
              - backdrop-filter: blur(12px) saturate(1.15)
              - -webkit-backdrop-filter: blur(12px) saturate(1.15)
              - border: 1px solid rgba(255,255,255,0.18)
              - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 10px rgba(0,0,0,0.20)
              - pointer-events: none
            custom_fields:
              ico:
                - display: flex
                - align-items: center
                - justify-content: center
                - width: 100%
                - height: 100%
            grid:
              - grid-template-areas: '"ico"'
              - grid-template-columns: 1fr
              - grid-template-rows: 1fr
              - place-items: center

        - type: custom:button-card
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: navigate
            navigation_path: /lovelace/mass-media
          hold_action:
            action: none
          card_mod:
            style: |
              :host {
                width: 42px !important;
                display: block !important;
                margin: 3px 0 !important;
              }
              :host(:active) ha-card {
                background: rgba(255,255,255,0.14) !important;
                transition: background 0.12s ease;
              }
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
              ]]]
          styles:
