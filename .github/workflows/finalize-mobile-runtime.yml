          BUNDLE=$(find config/www/dashboard -maxdepth 1 -type f -name 'bruno-dashboard.*.js' -printf '%f\n')
          git add -f "config/www/dashboard/$BUNDLE" "config/www/dashboard/$BUNDLE.br" "config/www/dashboard/$BUNDLE.gz" config/www/dashboard/manifest.json

          git status --short
          if git diff --cached --quiet; then
