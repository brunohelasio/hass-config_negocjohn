# OFFICE GRID
grid_office:
  card:
    type: custom:button-card
    entity: light.office_group
    name: Office
    double_tap_action: !include ../../shared/popup/rooms/office.yaml
    hold_action: !include ../../shared/honeycomb/office_mode.yaml
    template:
      - rooms_base
      - icon_office
      - climate_tooltip
    variables:
      state_on: >
        [[[
          let state = states['sensor.office_active'].state;
          if (state == 'yes') return state;
        ]]]
      light_entity: light.office_group
      server: binary_sensor.mbproserver_active
      active: sensor.office_active
      occupancy: binary_sensor.office_occupancy
      badges:
        motion: '[[[ return variables.generate_badge_active("input_boolean.brma"); ]]]'
        server: >
          [[[
            let state = states['binary_sensor.mbproserver_active'];
            if (state) {
                let idle = state.attributes.Idle === true,
                    sleep = state.attributes.Sleeping === true;
                let icon = 'mdi:server-network',
                    color = '#3F8148';
                if (state.state === 'off' && idle) {
                    color = '';
                } else if (state.state === 'off' && sleep) {
                    icon = 'mdi:server-network-off';
                    color = 'var(--state-icon-inactive-color)';
                }

                return variables.create_badge(icon, color);
            }
          ]]]
        mood_light: '[[[return variables.generate_badge_active("light.office_ripple_mood_light", "custom:iris"); ]]]'
        desk_light: '[[[return variables.generate_badge_active("light.office_led_light_strip", "mdi:led-strip-variant"); ]]]'

      climate_sensors:
        tempsensor: sensor.office_temp_humid_temperature
        humidsensor: sensor.office_temp_humid_humidity
        pm25_sensor: sensor.zhimi_mb4_b008_pm25_density
  # LIVING ROOM GRID
grid_living_room:
  card:
    type: custom:button-card
    entity: light.living_room_group
    name: Lounge
    double_tap_action: !include ../../shared/popup/rooms/livingroom.yaml
    hold_action: !include ../../shared/honeycomb/living.yaml
    template:
      - rooms_base
      - climate_tooltip
      - icon_couch_lamp
    hidden: true
    variables:
      light_entity: light.living_room_group
      active: sensor.living_room_active
      climate_sensors:
        tempsensor: sensor.dyson_ph04_temperature
        humidsensor: sensor.dyson_ph04_humidity
        pm25_sensor: sensor.dyson_ph04_pm2_5
    card_mod:
      style: |
        #circle {
        {%- if not is_state('light.shelly_rgbw_kitchen_led_strip', 'on') -%}
          display:none !important;
        {% endif %}
        }

# KITCHEN NORMAL
grid_kitchen_normal:
  card:
    type: custom:button-card
    entity: sensor.kitchen_active
    name: Kitchen
    template:
      - rooms_base
      - icon_noodles
      - kitchen_badges
    double_tap_action: !include ../../shared/popup/rooms/kitchen.yaml
    hold_action: !include ../../shared/honeycomb/kitchen.yaml
    variables:
      fan_circle: sensor.hood_operation_state
      light_entity: light.kitchen_table_light
      active: sensor.kitchen_active
      motion: binary_sensor.motion_sensor_kitchen_occupancy

  # KITCHEN DISHWASING
grid_kitchen_dishwasing:
  card:
    type: custom:button-card
    entity: timer.dishwasher_remaining
    name: >
      [[[
        if (entity) {
          let phaseState = helpers.localize(states['sensor.dishwasher_program_phase'])
          if (phaseState !== undefined) {
            return phaseState;
          } else {
            return 'Dishwasher';
          }
        }
      ]]]
    template:
      - base
      - appliance_circle
      - icon_dish
    double_tap_action:
      action: fire-dom-event
      browser_mod:
        service: browser_mod.popup
        data:
          title: 'Dishwasher'
          # card_mod:
          #   style:
          #     #popup header
          #     .:
          content:
            type: vertical-stack
            cards:
              - type: entities
                entities:
                  - entity: switch.dishwasher_power
                    name: Power
                    icon: mdi:power
                    secondary_info: last-changed
                  - entity: binary_sensor.dishwasher_door
                    name: Door
                  - entity: sensor.dishwasher_operation_state
                    name: Operation State
                  - entity: sensor.dishwasher_program_progress
                    name: Program Progress
                  - entity: sensor.dishwasher_remaining_program_time
                    name: Remaining Program Time
    tap_action: !include ../../shared/popup/rooms/kitchen.yaml
    hold_action: !include ../../shared/honeycomb/kitchen.yaml
    variables:
      light_entity: light.kitchen_table_light
      appliance: sensor.dishwasher_program_progress
    custom_fields:
      timer:
        card:
          type: custom:timer-bar-card
          layout: full_row
          text_width: 0px
          entity: timer.dishwasher_remaining
          bar_direction: rt
          invert: true
          bar_background: '#ffffff4d'
          bar_foreground: '#e5a00d9e'
    styles:
      card:
        - overflow: hidden
      custom_fields:
        timer:
          - display: block
          - position: absolute
          - top: >
              [[[
                return window.matchMedia('(max-width: 800px)').matches
                  ? '77%'
                  : '98%';
              ]]]
          - left: -15%
          - width: 127%

  # BEDROOM
grid_bedroom:
  card:
    type: custom:button-card
    entity: light.bedroom_group
    name: Bedroom
    double_tap_action: !include ../../shared/popup/rooms/bedroom.yaml
    hold_action: !include ../../shared/honeycomb/bedroom.yaml
    template:
      - rooms_base
      - climate_tooltip
      - icon_double_bed
      # - icon_bedroom
      # - icon_bed
    variables:
      active: sensor.bedroom_active
      light_entity: light.bedroom_group
      climate_sensors:
        tempsensor: sensor.bedroom_tem_humid_temperature
        humidsensor: sensor.bedroom_tem_humid_humidity
        pm25_sensor: sensor.philips_air_purifier_pm2_5
      state_on: >
        [[[
          let state = states['sensor.bedroom_active'].state;
          if (state == 'yes') return state;
        ]]]
      badges:
        babycam: '[[[ return variables.generate_badge_active("switch.office_socket", "custom:arlo-cam"); ]]]'
        motion: '[[[ return variables.generate_badge_active("binary_sensor.motion_sensor_bedroom_occupancy"); ]]]'
