# Bento sidebar retry 2026-05-15
#
# This keeps the part that was known to work in the old YAML sidebar:
# a layout-card grid with a real middle 1fr spacer, so the bottom group
# stays anchored. The buttons use native mdi icons instead of custom_fields
# SVG snippets to avoid the button-card rendering error seen in PR #396.
type: custom:layout-card
layout_type: custom:grid-layout
view_layout:
  grid-area: sidebar
layout:
  grid-template-columns: 1fr
  grid-template-rows: min-content 1fr min-content
  justify-items: center
  align-items: stretch
  height: 100%
  padding: 8px 0
  margin: 0
card_mod:
  style:
    .: |
      :host {
        width: 65px !important;
        height: 100% !important;
        display: block !important;
        margin: 0 !important;
      }
      ha-card {
        width: 65px !important;
        height: 100% !important;
        box-sizing: border-box !important;
        background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)) !important;
        backdrop-filter: blur(18px) saturate(1.2) !important;
        -webkit-backdrop-filter: blur(18px) saturate(1.2) !important;
        border: 1px solid rgba(255,255,255,0.10) !important;
        border-radius: 16px !important;
        box-shadow: none !important;
        overflow: hidden !important;
      }
      hui-grid-layout {
        height: 100% !important;
        display: grid !important;
      }
    $: |
      .card-content {
        padding: 0 !important;
        margin: 0 !important;
        height: 100% !important;
        width: 100% !important;
        box-sizing: border-box !important;
      }
      hui-grid-layout {
        height: 100% !important;
      }
cards:
  - type: custom:layout-card
    view_layout:
      grid-row: 1
    layout_type: custom:grid-layout
    layout:
      grid-template-columns: 1fr
      justify-items: center
      grid-row-gap: 6px
      margin: 0
      padding: 0
    card_mod:
      style:
        .: |
          :host,
          ha-card {
            width: 100% !important;
          }
          ha-card {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
          }
        $: |
          .card-content {
            padding: 0 !important;
            margin: 0 !important;
          }
    cards:
      - type: custom:button-card
        icon: mdi:home
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: none
        hold_action:
          action: none
        card_mod:
          style: |
            :host {
              width: 42px !important;
              display: block !important;
              margin: 3px 0 !important;
            }
        styles:
          card:
            - width: 42px
            - height: 42px
            - border-radius: 12px
            - padding: 0
            - background: rgba(255,255,255,0.12)
            - backdrop-filter: blur(12px) saturate(1.15)
            - -webkit-backdrop-filter: blur(12px) saturate(1.15)
            - border: 1px solid rgba(255,255,255,0.18)
            - box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 10px rgba(0,0,0,0.20)
            - pointer-events: none
          icon:
            - width: 20px
            - color: rgba(255,255,255,0.86)

      - type: custom:button-card
        icon: mdi:music-note
        show_name: false
        show_state: false
        show_label: false
        tap_action:
          action: navigate
          navigation_path: /lovelace/mass-media
        hold_action:
          action: none
        card_mod:
          style: |
            :host {
              width: 42px !important;
              display: block !important;
              margin: 3px 0 !important;
            }
            :host(:active) ha-card {
              background: rgba(255,255,255,0.14) !important;
              transition: background 0.12s ease;
            }
        styles:
          card:
            - width: 42px
            - height: 42px
            - border-radius: 12px
            - padding: 0
            - background: transparent
            - border: 1px solid transparent
            - box-shadow: none
          icon:
            - width: 20px
            - color: rgba(255,255,255,0.78)

