          doc=f'''# 34 — Implementação integral TV + cold start remoto (2026-08-20)

## Escopo aplicado

Esta candidata implementa os diagnósticos 32 e 33 sem alterar `main`.
Base de rollback antes desta rodada: `{PRE}`.

### TV
- `media_player.smart_tv_pro_2`: autoridade de energia, volume e power.
- `media_player.smart_tv_pro`: reprodução, fonte, título e artwork.
- `remote.smart_tv_pro`: controle remoto.
- `media_player.android_tv_192_168_3_17`: retirado das decisões do dashboard; integração não foi desabilitada.
- Removido grace period de 45 s dos caminhos ativos.
- Power deixa de usar `homeassistant.toggle`; direção passa a ser explícita.

### Performance
- árvores globais button-card/streamline não são mais parseadas pela shell ativa.
- Lovelace usa `resource_mode: yaml` com núcleo necessário; `.storage/lovelace_resources` permanece intacto para rollback.
- subviews de cômodo, câmeras, Roborock, planta e Music são chunks sob demanda.
- o cold start pré-carrega somente o backdrop da seção atual.
- todos os JS gerados do dashboard recebem irmãos Brotli e gzip frescos a cada build.
- `window.brunoStartup` registra marcas de bootstrap e quantidade/bytes de recursos observados.

## Rollback rápido

