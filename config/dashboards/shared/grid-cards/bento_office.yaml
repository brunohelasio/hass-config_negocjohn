type: custom:button-card
entity: light.grupo_luzes_office
name: Office
triggers_update:
  - sensor.time
  - sensor.office_active
  - sensor.office_semantic_state
  - binary_sensor.office_occupancy
  - binary_sensor.office_pc_active
  - binary_sensor.office_working_active
  - binary_sensor.office_meeting_active
  # ANTERIOR: o card só reagia a switch.macbook, AC, Alexa e temp/umidade.
  # Mantido para fallback/compatibilidade visual do dot PC.
  - switch.macbook
  - climate.ac_office
  - media_player.echo_pop_office
  - person.bruno_helasio
  - sensor.of_sensor_temp_humid_temperatura
  - sensor.of_sensor_temp_humid_umidade
  # NOVO: PIR tratado como presença/mmWave + sensores HASS.Agent.
  - binary_sensor.of_sensor_presenca_movimento
  - sensor.of_sensor_presenca_iluminancia
  - sensor.of_sensor_presenca_bateria
  - event.of_sensor_presenca_device_notifications
  - sensor.desktop_melg9vv_office_pc_session_state
  - sensor.desktop_melg9vv_office_pc_idle_time
  - sensor.desktop_melg9vv_office_pc_active_window
  - binary_sensor.desktop_melg9vv_office_pc_microphone_active
  - binary_sensor.desktop_melg9vv_office_pc_webcam_active
  - sensor.desktop_melg9vv_office_pc_teams_active
  - binary_sensor.desktop_melg9vv_janela_meet
template:
  - rooms_base
  - icon_office

variables:
  # ANTERIOR: state usava apenas entity.state (light.grupo_luzes_office).
  # NOVO: usa sensor.office_active para presença/semântica, com fallback para a luz.
  state: "[[[ return states['sensor.office_active']?.state || entity.state; ]]]"
  state_on: >
    [[[
      // Regra visual original preservada: o card só fica branco quando
      // alguma luz do grupo Office estiver acesa. Presença/semântica
      // aparecem no status/dots, mas não ligam o fundo do card.
      return entity?.state === 'on';
    ]]]
  light_entity: light.office_switch_3
  active: sensor.office_active

state_display: >
  [[[
    const lines = [];

    // Mantém o status de luzes/tempo como informação independente.
    const activeEntity = states['sensor.office_active'];
    const lightsOnCount = activeEntity?.attributes?.lights_on_count;
    let count = null;
    if (lightsOnCount != null && lightsOnCount !== '' && !isNaN(lightsOnCount)) {
      count = parseInt(lightsOnCount, 10);
    }
    const ids = entity?.attributes?.entity_id;
    if (count === null && Array.isArray(ids)) {
      count = ids.filter(id => states[id]?.state === 'on').length;
    }

    if (count && count > 0) {
      const timeFmt = c => {
        const m = (c / 6e4), h = (c / 36e5), d = (c / 864e5);
        return m < 1 ? '< 1m' : m < 60 ? `${parseInt(m)}m` : h < 24 ? `${parseInt(h)}h` : `${parseInt(d)}d`;
      };
      let earliestOn = null;
      if (Array.isArray(ids)) {
        ids.forEach(id => {
          const st = states[id];
          if (st?.state === 'on' && st.last_changed) {
            const ts = Date.parse(st.last_changed);
            if (!isNaN(ts) && (earliestOn === null || ts < earliestOn)) earliestOn = ts;
          }
        });
      }
      const elapsed = earliestOn !== null ? timeFmt(Date.now() - earliestOn) : '';
      const label = count === 1 ? '1 light' : `${count} lights`;
      lines.push(elapsed ? `${label} · ${elapsed}` : label);
    } else if (variables.state_on) {
      lines.push('On');
    }

    // Sem prioridade: status semântico entra como linha adicional quando ativo.
    const semantic = states['sensor.office_semantic_state'];
    const display = semantic?.attributes?.display;
    if (display && !['none','unknown','unavailable'].includes((semantic.state || '').toLowerCase())) {
      lines.push(display);
    }

    if (!lines.length) return ' ';
    return `<div style="display:flex;flex-direction:column;gap:1px;line-height:1.15;">${lines.map(line => `<span>${line}</span>`).join('')}</div>`;
  ]]]

tap_action:
  action: perform-action
  perform_action: light.toggle
  data:
    entity_id: light.office_switch_3
double_tap_action: !include ../../shared/popup/rooms/office.yaml
hold_action:
  action: perform-action
  perform_action: light.turn_off
  data:
    entity_id: light.grupo_luzes_office

styles:
  card:
    # ANTERIOR: border/box-shadow sempre removidos.
    # NOVO: em reunião, mantém fundo original (luz continua controlando o branco)
    # e adiciona apenas destaque vermelho suave para "não perturbe".
    - border: >
        [[[
          const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
            || states['sensor.office_semantic_state']?.state === 'meeting';
          return 'none !important';
        ]]]
    - box-shadow: >
        [[[
          const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
            || states['sensor.office_semantic_state']?.state === 'meeting';
          return meeting
            ? '0 0 18px rgba(239,68,68,0.22), inset 0 0 28px rgba(127,29,29,0.10) !important'
            : 'none !important';
        ]]]
    - background-image: >
        [[[
          const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
            || states['sensor.office_semantic_state']?.state === 'meeting';
          return meeting ? 'linear-gradient(145deg, rgba(127,29,29,0.13), rgba(239,68,68,0.04))' : 'none';
        ]]]
    - padding: "16px !important"
    - overflow: "visible !important"
    - position: "relative"
  grid:
    - grid-template-areas: '"icon temp dots" "n n dots" "s s dots"'
    - grid-template-columns: "min-content 1fr min-content"
    - grid-template-rows: "0.90fr min-content min-content"
  name:
    - justify-self: "start"
    - align-self: "end"
    - font-size: "15px"
    - font-weight: "700"
    - margin-bottom: "0px !important"
    - color: >
        [[[ return variables.state_on ? 'black' : 'white'; ]]]
  state:
    - justify-self: "start"
    - align-self: "end"
    - font-size: "11px"
    - font-weight: "500"
    - line-height: "1.15"
    - white-space: "normal"
    - margin-bottom: "-1px !important"
    - color: >
        [[[ return variables.state_on ? 'rgba(0,0,0,0.6)' : 'rgba(255,255,255,0.4)'; ]]]
  custom_fields:
    icon:
      - justify-self: "start"
      - align-self: "start"
      - width: "65px !important"
      - height: "65px !important"
      - margin-top: "2px !important"
      # FALLBACK: comentar as regras opacity/filter abaixo restaura o icon_office
      # sem tratamento visual durante reuniao.
      - opacity: >
          [[[
            const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
              || states['sensor.office_semantic_state']?.state === 'meeting';
            return meeting ? (variables.state_on ? '0.62' : '0.48') : '1';
          ]]]
      - filter: >
          [[[
            const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
              || states['sensor.office_semantic_state']?.state === 'meeting';
            if (meeting) {
              return variables.state_on
                ? 'saturate(0.48) brightness(0.78) contrast(0.9) drop-shadow(0 0 6px rgba(0,0,0,0.20))'
                : 'grayscale(1) brightness(0.58) contrast(0.82)';
            }
            return variables.state_on ? 'drop-shadow(2px 3px 6px grey) contrast(1.1)' : null;
          ]]]
      - transition: "opacity 140ms ease, filter 140ms ease"
    meeting_frame:
      # O wrapper externo corta a base do card; este frame fica levemente
      # para dentro para manter o brilho inferior visivel sem borda solida.
      - position: "absolute"
      - left: "1px"
      - right: "1px"
      - top: "1px"
      - bottom: "10px"
      - border-radius: "14px"
      - box-shadow: "inset 0 0 0 1px rgba(248,113,113,0.26), inset 0 0 18px rgba(239,68,68,0.16), 0 0 14px rgba(239,68,68,0.18)"
      - background: "linear-gradient(145deg, rgba(239,68,68,0.07), rgba(239,68,68,0.015) 58%, rgba(239,68,68,0.055))"
      - z-index: 1
      - pointer-events: none
      - display: >
          [[[
            const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
              || states['sensor.office_semantic_state']?.state === 'meeting';
            return meeting ? 'block' : 'none';
          ]]]
    meeting_icon:
      # FALLBACK: comentar este custom_field meeting_icon mantem apenas o
      # icon_office de fundo. O overlay fica absoluto para nao criar coluna/linha
      # extra nem deslocar os dots.
      - position: "absolute"
      # Calibrado para o centro visual do icon_office local.
      - left: "2px"
      - top: "6px"
      - width: "70px !important"
      - height: "70px !important"
      - z-index: 4
      - pointer-events: none
      - display: >
          [[[
            const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
              || states['sensor.office_semantic_state']?.state === 'meeting';
            return meeting ? 'block' : 'none';
          ]]]
    temp:
      - justify-self: "start"
      - align-self: "start"
      - margin-left: "12px"
      - margin-top: "4px"
    dots:
      - justify-self: "end"
      - align-self: "start"

custom_fields:
  meeting_frame: >
    [[[
      const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
        || states['sensor.office_semantic_state']?.state === 'meeting';
      return meeting ? '<span></span>' : '';
    ]]]

  meeting_icon: >
    [[[
      const meeting = states['binary_sensor.office_meeting_active']?.state === 'on'
        || states['sensor.office_semantic_state']?.state === 'meeting';
      if (!meeting) return '';

      // Overlay local do Office em reuniao: mantem o icon_office ao fundo
      // sem alterar templates globais nem o template icon_office.
      return `
        <svg viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;filter:drop-shadow(0 0 10px rgba(239,68,68,0.42));">
          <style>
            @keyframes officeMeetingPulse {
              0%, 100% { opacity: .78; transform: scale(.98); }
              50% { opacity: 1; transform: scale(1.03); }
            }
            @keyframes officeMeetingSlash {
              0%, 100% { stroke-opacity: .82; }
              50% { stroke-opacity: 1; }
            }
            .meeting-pulse {
              transform-origin: center;
              animation: officeMeetingPulse 2.6s ease-in-out infinite;
            }
            .meeting-slash {
              animation: officeMeetingSlash 1.8s ease-in-out infinite;
            }
          </style>
          <circle cx="25" cy="25" r="21" fill="rgba(127,29,29,0.34)" stroke="rgba(248,113,113,0.72)" stroke-width="2.5" class="meeting-pulse"/>
          <circle cx="25" cy="25" r="15.5" fill="none" stroke="rgba(254,202,202,0.92)" stroke-width="4.2"/>
          <line x1="14.2" y1="14.2" x2="35.8" y2="35.8" stroke="rgba(254,202,202,0.98)" stroke-width="5.2" stroke-linecap="round" class="meeting-slash"/>
          <circle cx="25" cy="25" r="22.5" fill="none" stroke="rgba(239,68,68,0.22)" stroke-width="5"/>
        </svg>
      `;
    ]]]

  temp: >
    [[[
      const firstValid = (ids) => {
        for (const id of ids) {
          const e = states[id];
          if (e && !['unknown','unavailable','none',''].includes((e.state || '').toLowerCase())) return e;
        }
        return null;
      };
      // ANTERIOR: priorizava sensores genericos/legados de temperatura e umidade do Office.
      const t = firstValid(['sensor.of_sensor_temp_humid_temperatura', 'sensor.temperatura_office', 'sensor.office_temperatura', 'sensor.of_temperatura']);
      const h = firstValid(['sensor.of_sensor_temp_humid_umidade', 'sensor.umidade_office', 'sensor.office_umidade', 'sensor.of_umidade']);
      if (!t) return '';
      const color = variables.state_on ? 'rgba(0,0,0,0.8)' : 'rgba(255,255,255,0.9)';
      const subColor = variables.state_on ? 'rgba(0,0,0,0.4)' : 'rgba(255,255,255,0.5)';
      return `
        <div style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.1;">
          <span style="font-size: 13px; font-weight: 700; color: ${color};">${t.state}°</span>
          <span style="font-size: 11px; color: ${subColor};">${h ? h.state + '%' : ''}</span>
        </div>
      `;
    ]]]

  dots: >
    [[[
      // ANTERIOR: const home = states['person.bruno_helasio']?.state === 'home';
      // ANTERIOR: const officePresence = false;
      // NOVO: presença consolidada em binary_sensor.office_occupancy (PIR com delay_off, futuro mmWave).
      const officePresence = states['binary_sensor.office_occupancy']?.state === 'on';
      const pcOn = states['binary_sensor.office_pc_active']?.state === 'on' || states['switch.macbook']?.state === 'on';
      const acOn = !['off','unavailable','unknown',''].includes(states['climate.ac_office']?.state ?? 'off');
      // ANTERIOR: const alexaOn = ['playing','on','paused','idle'].includes(states['media_player.echo_pop_office']?.state ?? '');
      // Replica o padrao da Sala: idle nao deve manter o status da Alexa aceso.
      const alexaOn = ['playing','on','paused'].includes(states['media_player.echo_pop_office']?.state ?? '');
      const baseBg = variables.state_on ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.08)';
      const baseColor = variables.state_on ? 'rgba(0,0,0,0.45)' : 'rgba(255,255,255,0.6)';
      const renderDot = (icon, active, activeColor) => `
        <div style="width: 26px; height: 26px; border-radius: 50%; box-sizing: border-box; background: ${active ? activeColor + '22' : baseBg}; border: 1px solid ${active ? activeColor + '55' : 'rgba(255,255,255,0.12)'}; display: flex; justify-content: center; align-items: center; color: ${active ? activeColor : baseColor};">
          <ha-icon icon="${icon}" style="width: 14px; height: 14px; display: flex; color: ${active ? activeColor : baseColor};"></ha-icon>
        </div>
      `;
      return `
        <div style="display: flex; flex-direction: column; gap: 5px; padding-top: 2px;">
          ${renderDot('mdi:account', officePresence, '#60a5fa')}
          ${renderDot('mdi:desktop-classic', pcOn, '#a78bfa')}
          ${renderDot('mdi:snowflake', acOn, '#4facfe')}
          ${renderDot('mdi:speaker-wireless', alexaOn, '#ff9900')}
        </div>
      `;
    ]]]
