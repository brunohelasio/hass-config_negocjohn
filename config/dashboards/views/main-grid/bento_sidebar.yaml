# Bento sidebar custom card.
# The visual rail, selected Home state, icon centering, spacer, and bottom
# anchoring are owned by config/www/bento-sidebar-card.js.
type: custom:bento-sidebar-glass-card
view_layout:
  grid-area: sidebar
top_items:
  - key: home
    icon: home
    label: Home
    selected: true
    tap_action:
      action: none

  - key: music
    icon: music
    label: Musica
    tap_action:
      action: navigate
      navigation_path: /lovelace/mass-media

  - key: cameras
    icon: cameras
    label: Cameras
    tap_action: !include ../../shared/popup/cameras_user.yaml

  - key: system
    icon: system
    label: Sistema
    tap_action: !include ../../shared/popup/footer/footer_system.yaml

  - key: vacuum
    icon: vacuum
    label: Aspirador
    tap_action: !include ../../shared/popup/footer/footer_vacuum.yaml

  - key: network
    icon: network
    label: Rede
    tap_action: !include ../../shared/popup/footer/footer_network.yaml

  - key: refresh
    icon: refresh
    label: Atualizar
    tap_action:
      action: call-service
      service: browser_mod.javascript
      service_data:
        code: location.reload()

  - key: updates
    icon: updates
    label: Updates
    tap_action: !include ../../shared/popup/footer/footer_updates.yaml

  - key: floorplan
    icon: floorplan
    label: Planta 3D
    tap_action: !include ../../shared/popup/planta_3d.yaml

bottom_items:
  - key: monitor
    icon: monitor
    label: Monitor
    tap_action:
      action: none

  - key: power
    icon: power
    label: Power
    tap_action:
      action: navigate
      navigation_path: /
