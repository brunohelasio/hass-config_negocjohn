title: Câmeras
path: mobile-cameras
icon: mdi:cctv
subview: false
theme: tablet

type: custom:grid-layout
card_mod:
  style: |
    hui-grid-layout {
      background: rgb(0, 0, 0);
      min-height: 100vh;
      overflow-x: hidden !important;
      max-width: 100vw !important;
    }
layout:
  margin: 0
  padding: 14px 14px calc(96px + env(safe-area-inset-bottom, 0px)) 14px
  # ANTERIOR: grid-template-columns: 1fr
  grid-template-columns: minmax(0, 1fr)
  grid-auto-rows: min-content
  grid-gap: 10px

cards:
  - !include ../../shared/mobile/mobile_js_cameras_card.yaml
  # FALLBACK - Mobile Lovelace original:
  # - !include ../../shared/mobile/mobile_cameras_card.yaml
  - !include ../../shared/mobile/mobile_js_pill_nav.yaml
