# Config da rail para a bruno-shell.
# Identica a views/main-grid/bento_sidebar.yaml, EXCETO os itens de SECAO (home,
# cameras) que, em vez de navegar para outra view, usam fire-dom-event com
# `bruno_section`. A shell intercepta o `ll-custom`, troca a secao no lugar e
# acende o item ativo — a rail NUNCA re-monta.
# Popups (system/vacuum/network/floorplan) e music/power seguem
# inalterados (serao migrados por etapas).
#
# NOVO (2026-07-09) — MODO PHONE (Opcao A mobile): em <=800px a rail vira DOCK
# horizontal na base da shell. `hide_on_phone: true` esconde o item do dock e
# o move para o menu "Mais" (botao no fim do dock — Fase 2, feedback do
# usuario). Tablet/desktop seguem exibindo tudo na rail vertical.
# Curadoria do dock:
#   VISIVEIS: Home, Cameras, Aspirador, Planta 3D, Mais (5 itens).
#   NO MENU "MAIS": Musica, Sistema, Rede, Atualizar, Config, Power.
# ROLLBACK: remover as linhas hide_on_phone (itens voltam ao dock).
type: custom:bento-sidebar-liquid-card
top_items:
  - key: home
    icon: home
    label: Home
    selected: true
    tap_action:
      action: fire-dom-event
      bruno_section: home

  - key: music
    icon: music
    label: Musica
    hide_on_phone: true
    indicator:
      type: state
      entity: sensor.media_focus_visuals
      active_states: ['playing']
    # ANTERIOR (rollback): action: navigate + navigation_path: mass-media (token hardcoded expirava)
    # NOVO (2026-08-01): fire-dom-event -> bruno_section: music -> subview busca URL de ingress ATUAL
    tap_action:
      action: fire-dom-event
      bruno_section: music

  - key: cameras
    icon: cameras
    label: Cameras
    # NOVO: separador removido (espaçamento uniforme entre botões).
    # ROLLBACK: descomentar a linha abaixo.
    # divider_after: true
    tap_action:
      action: fire-dom-event
      bruno_section: cameras

  # ANTERIOR (rollback 2026-08-06) — item Sistema:
  #   - key: system
  #     icon: system
  #     label: Sistema
  #     hide_on_phone: true
  #     indicator:
  #       type: state
  #       entity: binary_sensor.pi_docker_containers_problem
  #       active_states: ['on']
  #     tap_action:
  #       action: fire-dom-event
  #       bruno_action: system
  #
  # NOVO (Fase 5e.6) — DISPOSITIVOS no lugar de Sistema.
  # O painel Sistema renderizava literalmente "Modulo indisponivel". No lugar
  # dele entra o ponto central de acesso rapido aos equipamentos da casa, que
  # tambem recebe a TV e o ar-condicionado da Sala vindos das acoes rapidas.
  # O indicador de problema do Docker sai junto: ele pertencia ao Sistema.
  # A shell aceita as duas chaves (devices e system) durante a transicao.
  # FALLBACK: tap_action: !include ../../shared/popup/footer/footer_system.yaml
  - key: devices
    icon: system
    label: Dispositivos
    hide_on_phone: true
    tap_action:
      action: fire-dom-event
      bruno_action: devices

  # key = roborock para casar com a secao/hash (#roborock) e ACENDER o item
  # ativo (a shell marca selected por data-key === chave da secao). icon: vacuum.
  - key: roborock
    icon: vacuum
    label: Aspirador
    indicator:
      type: state
      entity: vacuum.roborock_s7
      active_states: ['cleaning']
    # ANTERIOR (rollback): abria o popup footer_vacuum.yaml.
    # tap_action: !include ../../shared/popup/footer/footer_vacuum.yaml
    # NOVO: troca para a secao #roborock da shell (mesmo padrao das Cameras).
    tap_action:
      action: fire-dom-event
      bruno_section: roborock

  - key: network
    icon: network
    label: Rede
    hide_on_phone: true
    indicator:
      type: state
      entity: binary_sensor.unifi_controller_alert
      active_states: ['on']
    # FALLBACK: tap_action: !include ../../shared/popup/footer/footer_network.yaml
    tap_action:
      action: fire-dom-event
      bruno_action: network

  - key: scenes
    icon: scenes
    label: Cenas
    hide_on_phone: true
    tap_action:
      action: fire-dom-event
      bruno_action: scenes

  - key: floorplan
    icon: floorplan
    label: Planta 3D
    # NOVO: separador removido (espaçamento uniforme entre botões).
    # ROLLBACK: descomentar a linha abaixo.
    # divider_after: true
    # ANTERIOR (rollback): abria o popup fullscreen da planta.
    # tap_action: !include ../../shared/popup/planta_3d.yaml
    # NOVO: troca para a secao #floorplan da shell, igual Cameras/Roborock.
    tap_action:
      action: fire-dom-event
      bruno_section: floorplan

  - key: config
    icon: settings
    label: Config
    # NOVO (Fase 2): no phone o Config sai do dock e entra no menu "Mais".
    hide_on_phone: true
    indicator:
      type: updates
    tap_action:
      action: fire-dom-event
      bruno_config: open

bottom_items:
  - key: power
    icon: power
    label: Power
    hide_on_phone: true
    tap_action:
      action: navigate
      navigation_path: /

# ── MICROINDICADOR DE ATIVIDADE ABAIXO DA DOBRA (2026-08-16) ────────────────
#
# Substitui a linha textual que ocupava uma faixa do grid de comodos. Aqui ele
# nao ocupa espaco nenhum: e absoluto sobre a propria rail.
#
# So aparece nesta rail (a `default`, usada pela Home). As secoes de comodo usam
# `rail_rooms.yaml`, onde a nocao de "ambientes ocultos abaixo" nao existe.
#
# O contador e a quantidade de AMBIENTES com atividade, nao de eventos: Marina
# ativo = 1; Marina e Miguel ativos = 2.
#
# ROLLBACK: remover este bloco. Sem ele o indicador simplesmente nao existe.
# ── SEMANTICA NOVA (HOME PHONE, 2026-08-22) ────────────────────────────────
#
# O indicador da rail NAO representa mais comodos ocultos abaixo da dobra.
# Com o pager, a atividade de comodos passou a ter indicador proprio, ao lado
# dos dots de pagina, dentro do compositor.
#
# A rail passa a indicar EXCLUSIVAMENTE conteudo em execucao abaixo da dobra —
# exatamente os mesmos tres sensores que fazem a secao "Em execucao" existir.
# Sem camera, Roborock ou midia, o contador e zero e o indicador some sozinho,
# pelo comportamento que bento-sidebar-card.js ja tem. Nao ha patch novo.
#
# Cada entrada e uma fonte, entao o numero e: 1 = uma ativa, 3 = as tres.
#
# ESCOPO: o indicador so existe em max-width 800px (regra de CSS do proprio
# bento-sidebar-card.js). O tablet nao tem esse indicador e nao muda aqui.
#
# ANTERIOR (rollback):
# overflow_hint:
#   rooms:
#     - name: Q. Marina
#       entities:
#         - light.grupo_luzes_quarto_marina
#         - climate.ac_quarto_marina
#         - binary_sensor.q_marina_motion_recent
#         - binary_sensor.q_marina_occupancy
#         - media_player.echo_pop_marina
#     - name: Q. Miguel
#       entities:
#         - light.grupo_luzes_quarto_miguel
#         - climate.ac_quarto_miguel
#         - binary_sensor.q_miguel_motion_recent
#         - binary_sensor.q_miguel_occupancy
overflow_hint:
  rooms:
    - name: Camera
      entities:
        - binary_sensor.home_activity_camera
    - name: Roborock
      entities:
        - binary_sensor.home_activity_roborock
    - name: Midia
      entities:
        - binary_sensor.home_activity_media
