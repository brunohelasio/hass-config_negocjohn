# ═══════════════════════════════════════════════════════════════════
# POPUP PLANTA 3D — Apartamento do usuário
# Imagem local confirmada: /local/images/planta_apartamento_home_assistant.png
# Criado como ação local da sidebar Bento; não altera floorplan global/original.
# ═══════════════════════════════════════════════════════════════════
action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Planta 3D
    tag: planta_3d
    initial_style: fullscreen
    dismissable: true
    style: >
      --popup-width: 100vw;
      --popup-max-width: 100vw;
      --popup-border-width: 0;
      --popup-background-color: rgba(8, 12, 22, 0.92);
      --mdc-theme-surface: rgba(8, 12, 22, 0.92);
      --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.42);
    card_mod:
      style:
        .: |
          ha-dialog {
            backdrop-filter: blur(16px) saturate(1.25);
            -webkit-backdrop-filter: blur(16px) saturate(1.25);
          }
          ha-dialog > ha-dialog-header {
            display: none !important;
          }
        ha-dialog$: |
          .mdc-dialog__container {
            padding: 0 !important;
            align-items: stretch !important;
            justify-content: stretch !important;
          }
          .mdc-dialog__surface {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            overflow: hidden !important;
          }
          .mdc-dialog__title {
            display: none !important;
          }
          .mdc-dialog__content {
            padding: 0 !important;
            height: 100vh !important;
            max-height: 100vh !important;
            overflow: hidden !important;
          }
    content:
      type: picture
      image: /local/images/planta_apartamento_home_assistant.png
      tap_action:
        action: none
      hold_action:
        action: none
      card_mod:
        style: |
          ha-card {
            height: 100vh !important;
            width: 100vw !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            border-radius: 0 !important;
            overflow: hidden !important;
          }
          img {
            width: 100% !important;
            height: 100% !important;
            object-fit: contain !important;
          }
