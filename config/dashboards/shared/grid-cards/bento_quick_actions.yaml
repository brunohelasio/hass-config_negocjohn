- type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-auto-flow: column
    grid-auto-columns: 52px
    grid-column-gap: 8px
    align-items: center
    justify-content: start
    margin: 0
    padding: 0
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
  cards:
    - type: custom:button-card
      icon: mdi:lightbulb-off-outline
      show_name: false
      tap_action:
        action: call-service
        service: homeassistant.turn_off
        data:
          entity_id: light.todas_as_luzes
      hold_action:
        action: none
      styles: &quick_icon_styles
        card:
          - width: 52px
          - height: 52px
          - border-radius: 14px
          - background: rgba(255,255,255,0.10)
          - border: 1px solid rgba(255,255,255,0.18)
          - backdrop-filter: blur(14px) saturate(1.15)
          - -webkit-backdrop-filter: blur(14px) saturate(1.15)
          - box-shadow: none
          - margin: 0
          - padding: 0
        icon:
          - color: rgba(255,255,255,0.92)
          - width: 22px

    - type: custom:button-card
      icon: mdi:movie-roll
      show_name: false
      tap_action:
        action: none
      hold_action:
        action: none
      styles: *quick_icon_styles

    - type: custom:button-card
      icon: mdi:laptop
      show_name: false
      tap_action:
        action: none
      hold_action:
        action: none
      styles: *quick_icon_styles

    - type: custom:button-card
      icon: mdi:sofa-outline
      show_name: false
      tap_action:
        action: none
      hold_action:
        action: none
      styles: *quick_icon_styles

    # NOVO (2026-05-08): Wi-Fi QR Code (inline para evitar falha de include)
    - type: custom:button-card
      icon: mdi:wifi
      show_name: false
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Wi-Fi
            tag: wifi_qr
            size: wide
            style: >
              --popup-width: min(420px, 92vw);
              --popup-max-width: 520px;
              --popup-background-color: rgba(15, 20, 35, 0.75);
              --mdc-theme-surface: rgba(20, 24, 33, 0.88);
              --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.56);
              --dialog-box-shadow: 0 0 24px rgba(62, 132, 255, 0.22), 0 0 70px rgba(62, 132, 255, 0.14);
              --tablet-popup-content-padding: 0.4em 0.6em 0.6em 0.5em;
            # Mesmo kit de estilo de popup usado no Office
            card_mod: !include ../snippets/style_popup_complete.yaml
            content:
              type: picture
              image: /local/images/wifi_main_scanme.png
      hold_action:
        action: none
      styles: *quick_icon_styles
