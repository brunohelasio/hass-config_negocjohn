# ══════════════════════════════════════════════════════════════════════════════
# mobile-comodos.yaml  (V3) — Aba Comodos
# Criado: 2026-05-10 — Mobile V3
#
# Grade 2-col com TODOS os comodos (Sala compacta + 6 outros), reusando
# os mesmos wrappers mobile_card_<comodo>.yaml do rail da Casa.
# ══════════════════════════════════════════════════════════════════════════════

title: Cômodos
path: mobile-comodos
icon: mdi:sofa
subview: false
theme: tablet

type: custom:grid-layout
card_mod:
  style: |
    hui-grid-layout {
      background: rgb(0, 0, 0);
      min-height: 100vh;
      overflow-x: hidden !important;
      max-width: 100vw !important;
    }
layout:
  margin: 0
  padding: 14px 14px calc(96px + env(safe-area-inset-bottom, 0px)) 14px
  # ANTERIOR: grid-template-columns: 1fr
  grid-template-columns: minmax(0, 1fr)
  grid-auto-rows: min-content
  grid-gap: 10px

cards:
  # ── Sala horizontal no topo (mesmo formato da aba Casa) ────────────────
  - !include ../../shared/mobile/mobile_js_sala_card.yaml
  # FALLBACK - Mobile Lovelace original:
  # - !include ../../shared/mobile/mobile_sala_card.yaml

  # ── Grade 2 colunas com os demais comodos ──────────────────────────────
  - !include ../../shared/mobile/mobile_js_comodos_grid.yaml
  # FALLBACK - Mobile Lovelace original:
  # - !include ../../shared/mobile/mobile_comodos_grid.yaml

  # ── Pill navbar ─────────────────────────────────────────────────────────
  - !include ../../shared/mobile/mobile_js_pill_nav.yaml
  # FALLBACK - Mobile Lovelace original:
  # - !include ../../shared/mobile/mobile_pill_nav.yaml
