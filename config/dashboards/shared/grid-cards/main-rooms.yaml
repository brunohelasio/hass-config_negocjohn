# MAIN ROOMS GRID CARDS
# TPL: dashboards/templates/streamline_templates/tpl_grid_mainrooms.yaml
#################################################
# Living Room
- type: custom:streamline-card
  template: grid_living_room

# Kitchen
# - type: custom:state-switch
#   entity: sensor.kitchen_active
#   default: 'no'
#   states:
#     'no':
#       type: custom:streamline-card
#       template: grid_kitchen_normal
#     dishwashing:
#       type: custom:streamline-card
#       template: grid_kitchen_dishwasing
- type: conditional
  conditions:
    - condition: state
      entity: sensor.kitchen_active
      state_not: dishwashing
  card:
    type: custom:streamline-card
    template: grid_kitchen_normal
- type: conditional
  conditions:
    - condition: state
      entity: sensor.kitchen_active
      state: dishwashing
  card:
    type: custom:streamline-card
    template: grid_kitchen_dishwasing

# Bedroom
- type: custom:streamline-card
  template: grid_bedroom

# OFFICE
- type: custom:streamline-card
  template: grid_office
