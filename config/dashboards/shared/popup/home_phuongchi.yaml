action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Phuong Chi
    adaptive: true
    content:
      type: custom:mod-card
      card_mod: !include ../snippets/style-person-popup.yaml
      card:
        type: vertical-stack
        cards:
          - type: entities
            visibility:
              - condition: user
                users:
                  - c133973b11744db7a8f2afa0366b6aa3
            card_mod:
              class: content
            entities:
              - entity: person.phuong_chi
                secondary_info: last-changed
          - type: history-graph
            entities:
              - entity: person.phuong_chi
            visibility:
              - condition: user
                users:
                  - c133973b11744db7a8f2afa0366b6aa3
          - type: map
            visibility:
              - condition: user
                users:
                  - c133973b11744db7a8f2afa0366b6aa3
            default_zoom: 16
            auto_fit: true
            dark_mode: true
            entities:
              - entity: device_tracker.phuong_chi
                focus: false
            hours_to_show: 24
