type: custom:stack-in-card
card_mod:
  style: |
    {% set meeting = is_state('binary_sensor.office_meeting_active', 'on') or is_state('sensor.office_semantic_state', 'meeting') %}
    :host {
      height: 100% !important;
      margin: 0 !important;
      display: block !important;
    }
    ha-card {
      height: 100% !important;
      margin: 0 !important;
      display: block !important;
      padding: 0px !important;

      background: {% if meeting %}linear-gradient(145deg, rgba(127,29,29,0.13), rgba(239,68,68,0.04)), linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)){% else %}linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)){% endif %} !important;
      backdrop-filter: blur(20px) saturate(1.35) !important;
      -webkit-backdrop-filter: blur(20px) saturate(1.35) !important;
      border: {% if meeting %}1px solid rgba(248,113,113,0.68){% else %}1px solid rgba(255,255,255,0.10){% endif %} !important;
      box-shadow: {% if meeting %}0 0 0 1px rgba(248,113,113,0.18), 0 0 22px rgba(239,68,68,0.28), inset 0 0 28px rgba(127,29,29,0.10), 0 8px 32px rgba(0,0,0,0.2){% else %}0 0 32px rgba(59,130,246,0.12), inset 0 1px 0 rgba(191,219,254,0.15), 0 8px 32px rgba(0,0,0,0.2){% endif %} !important;
      border-radius: 16px !important;
      overflow: hidden !important;

      --ha-card-backdrop-filter: none !important;
      --ha-card-background: transparent !important;
      --ha-card-border-width: 0 !important;
    }
    ha-card::before { display: none !important; }
cards:
  - !include ../../shared/grid-cards/bento_office.yaml
