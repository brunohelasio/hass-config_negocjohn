# View-shell (Etapa 2) — PAINEL PADRAO. Assumiu o path `bento-lab` (antes do
# bento_main, agora comentado). Assim, "voltar ao painel principal" a partir de
# qualquer subview (que navega para `bento-lab`) cai DENTRO da shell.
# Alterna secoes por hash: bento-lab#home / bento-lab#cameras.
# type: panel => 1 unico card (a shell) ocupando a tela toda. Como a view e
# unica, a rail (dentro da shell) nunca re-monta ao alternar de secao.
# Rollback: voltar path para `bento-shell` e descomentar bento_main em ui-lovelace-main.yaml.
title: Home
path: bento-lab
subview: false
theme: tablet
type: panel
cards:
  - type: custom:bruno-shell
    default_section: home
    rail: !include shell/rail.yaml
    sections:
      home: !include shell/section_home.yaml
      cameras: !include shell/section_cameras.yaml
      roborock: !include shell/section_roborock.yaml
