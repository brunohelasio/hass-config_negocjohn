name: Build Josh ON + presence round4

on:
  push:
    branches:
      - feat/mobile-runtime-v3-20260821
    paths:
      - '.github/workflows/build-josh-on-presence-round4.yml'
      - 'scripts/assets/fix_josh_on_presence_round4.py'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout da candidata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar round4 Josh e presenca
        run: python scripts/assets/fix_josh_on_presence_round4.py

      - name: Validar escopo estrutural do round4
        run: |
          python - <<'PY'
          from pathlib import Path

          tile = Path('dashboard-src/src/components/rooms/bruno-room-tile.ts').read_text(encoding='utf-8')
          rooms = Path('dashboard-src/src/config/rooms.config.ts').read_text(encoding='utf-8')
          sala = Path('config/www/bruno-ui/cards/bruno-sala-card.js').read_text(encoding='utf-8')
          lavabo = Path('config/packages/lavabo_presence.yaml').read_text(encoding='utf-8')
          corredor = Path('config/packages/corredor_presence.yaml').read_text(encoding='utf-8')

          required = {
              'tile wash ON': '.room-card.is-tile.is-room-on::before',
              'tile line ON': '--bruno-tile-on-line',
              'mobile leite ON': '.room-card.is-josh-phone-card.is-room-on',
              'mobile card OFF': '.room-card.is-josh-phone-card {',
              'tablet 8pct': 'height: 120%;',
              'mobile 8pct': 'height: 127.5%;',
              'Lavabo semantic config': "semanticState: 'sensor.lavabo_semantic_state'",
          }
          for label, needle in required.items():
              if needle not in tile + '\n' + rooms:
                  raise SystemExit(f'{label}: ausente')

          if '.sala-card.is-josh-theme.is-room-on' not in sala:
              raise SystemExit('Sala nao recebeu material Josh ON do mobile')
          if 'width: 101.5%;' not in sala or 'height: 101.5%;' not in sala:
              raise SystemExit('Sala perdeu escala V3 de ~8%')
          if 'unique_id: lavabo_semantic_state' not in lavabo:
              raise SystemExit('sensor semantico do Lavabo ausente')
          if "sensor_offline" not in lavabo or "Sensor indisponivel" not in lavabo:
              raise SystemExit('Lavabo nao diferencia sensor offline')
          if "sensor_offline" not in corredor or "Sensor indisponivel" not in corredor:
              raise SystemExit('Corredor nao diferencia sensor offline')

          # Invariante: Josh tablet/desktop continua tile; somente phone cai para card.
          if 'return this._joshHomeMode && !this._phoneJoshCard;' not in tile:
              raise SystemExit('breakpoint Josh tile/card regrediu')

          print('round4 estrutural OK')
          PY

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-src/package-lock.json

      - name: Instalar dependencias
        working-directory: dashboard-src
        run: npm ci

      - name: YAML
        working-directory: dashboard-src
        run: npm run check:yaml

      - name: Typecheck
        working-directory: dashboard-src
        run: npm run typecheck

      - name: Lint
        working-directory: dashboard-src
        run: npm run lint

      - name: Testes
        working-directory: dashboard-src
        run: npm run test

      - name: Build completo
        working-directory: dashboard-src
        run: npm run build

      - name: Atualizar bundle ativo em configuration.yaml
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          manifest = json.loads(Path('config/www/dashboard/manifest.json').read_text(encoding='utf-8'))
          bundle = manifest['bundle']
          p = Path('config/configuration.yaml')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(?m)^(\s*)- /local/dashboard/(bruno-dashboard\.[A-Za-z0-9_-]+\.js)\s*$')
          matches = list(pattern.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'esperava 1 bundle ativo; encontrei {len(matches)}')
          old = matches[0].group(2)
          if old == bundle:
              raise SystemExit('hash do bundle nao mudou; abortando por seguranca')
          indent = matches[0].group(1)
          repl = f'{indent}# ANTERIOR (rollback Josh/presenca round4): - /local/dashboard/{old}\n{indent}- /local/dashboard/{bundle}'
          p.write_text(pattern.sub(repl, text, count=1), encoding='utf-8')
          print(f'bundle ativo: {old} -> {bundle}')
          PY

      - name: Bloquear alteracoes inesperadas
        run: |
          python - <<'PY'
          import subprocess

          allowed_exact = {
              'dashboard-src/src/components/rooms/bruno-room-tile.ts',
              'dashboard-src/src/config/rooms.config.ts',
              'dashboard-src/src/config/rooms.config.test.ts',
              'config/www/bruno-ui/cards/bruno-sala-card.js',
              'config/packages/lavabo_presence.yaml',
              'config/packages/corredor_presence.yaml',
              'config/configuration.yaml',
          }
          lines = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          unexpected = []
          for line in lines:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if path in allowed_exact or path.startswith('config/www/dashboard/'):
                  continue
              unexpected.append(line)
          if unexpected:
              raise SystemExit('arquivos inesperados apos build:\n' + '\n'.join(unexpected))
          print('escopo round4 confirmado')
          PY

      - name: Registrar candidata round4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard-src/src/components/rooms/bruno-room-tile.ts
          git add dashboard-src/src/config/rooms.config.ts
          git add dashboard-src/src/config/rooms.config.test.ts
          git add config/www/bruno-ui/cards/bruno-sala-card.js
          git add config/packages/lavabo_presence.yaml
          git add config/packages/corredor_presence.yaml
          git add config/configuration.yaml
          git add -f -A config/www/dashboard
          git commit -m 'fix: destacar Josh ON e restaurar presenca Lavabo Corredor'
          git push
