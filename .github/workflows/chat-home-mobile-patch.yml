    this._scheduleRefresh(true);
  }

  disconnectedCallback() {
    if (!this._refreshTimer) return;
    clearInterval(this._refreshTimer);
    this._refreshTimer = null;
  }
''', '''  connectedCallback() {
    this._scheduleRefresh(true);
    this._ensureHeroViewportListener();
    this._syncHeroCarousel(this.shadowRoot?.querySelectorAll('[data-hero-page]').length || 0);
  }

  disconnectedCallback() {
    if (this._refreshTimer) {
      clearInterval(this._refreshTimer);
      this._refreshTimer = null;
    }
    this._clearHeroCarouselTimer();
    if (this._heroViewportQuery && this._onHeroViewportChange) {
      this._heroViewportQuery.removeEventListener?.('change', this._onHeroViewportChange);
    }
    this._heroViewportQuery = null;
    this._onHeroViewportChange = null;
  }

  _isPhoneViewport() {
    return Boolean(globalThis.matchMedia?.('(max-width: 800px)').matches);
  }

  _ensureHeroViewportListener() {
    if (this._heroViewportQuery || !globalThis.matchMedia) return;
    this._heroViewportQuery = globalThis.matchMedia('(max-width: 800px)');
    this._onHeroViewportChange = () => {
      this._clearHeroCarouselTimer();
      this._render();
    };
    this._heroViewportQuery.addEventListener?.('change', this._onHeroViewportChange);
  }

  _clearHeroCarouselTimer() {
    if (!this._heroCarouselTimer) return;
    clearInterval(this._heroCarouselTimer);
    this._heroCarouselTimer = null;
  }

  _applyHeroCarouselState() {
    if (!this.shadowRoot) return;
    const lines = [...this.shadowRoot.querySelectorAll('[data-hero-page]')];
    const dots = [...this.shadowRoot.querySelectorAll('[data-hero-dot]')];
    if (!lines.length) return;
    const count = lines.length;
    const index = Math.max(0, Number(this._heroLineIndex) || 0) % count;
    this._heroLineIndex = index;
    lines.forEach((line, page) => {
      const active = page === index;
      line.classList.toggle('is-active', active);
      line.setAttribute('aria-hidden', active ? 'false' : 'true');
      line.tabIndex = active && !line.classList.contains('is-insight') ? 0 : -1;
    });
    dots.forEach((dot, page) => dot.classList.toggle('is-active', page === index));
  }

  _syncHeroCarousel(count) {
    const total = Math.max(0, Number(count) || 0);
    const enabled = this.isConnected
      && this._config?.hero_layout === 'v2'
      && this._isPhoneViewport()
      && total > 0;

    if (!enabled) {
      this._clearHeroCarouselTimer();
      this._heroCarouselCount = 0;
      this._heroLineIndex = 0;
      return;
    }

    if (this._heroCarouselCount !== total) {
      this._clearHeroCarouselTimer();
      this._heroCarouselCount = total;
    }
    this._heroLineIndex = Math.max(0, Number(this._heroLineIndex) || 0) % total;
    this._applyHeroCarouselState();

    if (total <= 1) {
      this._clearHeroCarouselTimer();
      return;
    }
    if (this._heroCarouselTimer) return;

    this._heroCarouselTimer = setInterval(() => {
      if (!this.isConnected || !this._isPhoneViewport()) {
        this._clearHeroCarouselTimer();
        return;
      }
      this._heroLineIndex = (this._heroLineIndex + 1) % this._heroCarouselCount;
      this._applyHeroCarouselState();
    }, 6000);
  }
''')

