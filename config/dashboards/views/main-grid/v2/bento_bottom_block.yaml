        #   divider_left: true
        # - type: custom:bruno-quarto-casal-card
        #   section: casal
        #   double_tap_action:
        #     action: fire-dom-event
        #     bruno_section: casal
        #   variant: tile
        #   divider_left: true
        # - type: custom:bruno-quarto-marina-card
        #   section: marina
        #   double_tap_action:
        #     action: fire-dom-event
        #     bruno_section: marina
