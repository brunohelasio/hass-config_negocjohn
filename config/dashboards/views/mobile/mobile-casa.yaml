# ══════════════════════════════════════════════════════════════════════════════
# mobile-casa.yaml  (V3) — Aba Casa
# Criado: 2026-05-10 — Mobile V3
#
# Estrutura: badges (scroll horiz) → hero compacto → Sala → rail comodos
#            → quick actions → pill navbar (fixed).
#
# Slug do dashboard confirmado: "ngocjohn-main" → URL: /ngocjohn-main/mobile-casa
# CORRECAO 2026-05-10: slug corrigido + overflow-x: hidden na view para
# eliminar scroll lateral global (causado por min-width: max-content vazando
# do mobile_top_badges para o container pai).
#
# REGRA DE OURO: arquivo NOVO. Nada do views/main.yaml ou main-grid foi
# alterado. Rollback: comentar !include em ui-lovelace-main.yaml.
# ══════════════════════════════════════════════════════════════════════════════

title: Casa
path: mobile-casa
icon: mdi:home-variant
subview: false
theme: tablet

type: custom:grid-layout
card_mod:
  style: |
    hui-grid-layout {
      background: rgb(0, 0, 0);
      min-height: 100vh;
      overflow-x: hidden !important;
      max-width: 100vw !important;
    }
layout:
  margin: 0
  padding: 14px 14px calc(96px + env(safe-area-inset-bottom, 0px)) 14px
  grid-template-columns: 1fr
  grid-auto-rows: min-content
  grid-gap: 10px

cards:
  # ── 1) Badges (scroll horizontal) ───────────────────────────────────────
  - !include ../../shared/mobile/mobile_top_badges.yaml

  # ── 2) Hero compacto ────────────────────────────────────────────────────
  - !include ../../shared/mobile/mobile_hero_welcome.yaml

  # ── 3) Sala (largura total) ─────────────────────────────────────────────
  - !include ../../shared/mobile/mobile_sala_card.yaml

  # ── 4) Rail horizontal dos demais comodos ───────────────────────────────
  - !include ../../shared/mobile/mobile_rooms_rail.yaml

  # ── 5) Acoes rapidas ────────────────────────────────────────────────────
  - !include ../../shared/mobile/mobile_quick_actions.yaml

  # ── 6) Pill navbar (position: fixed — ancora ao final da view) ──────────
  - !include ../../shared/mobile/mobile_pill_nav.yaml
