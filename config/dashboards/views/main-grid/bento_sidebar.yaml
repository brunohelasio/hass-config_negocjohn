# Bento sidebar custom card.
# The visual rail, selected Home state, icon centering, spacer, and bottom
# anchoring are owned by config/www/bento-sidebar-card.js.
type: custom:bento-sidebar-liquid-card
view_layout:
  grid-area: sidebar
top_items:
  - key: home
    icon: home
    label: Home
    active_paths:
      - /lovelace
      - /lovelace/bento-lab
      - /ngocjohn-main
      - /ngocjohn-main/bento-lab
    tap_action:
      action: navigate
      navigation_path: /lovelace/bento-lab

  - key: music
    icon: music
    label: Musica
    active_paths:
      - /lovelace/mass-media
      - /ngocjohn-main/mass-media
    tap_action:
      action: navigate
      navigation_path: /lovelace/mass-media

  - key: cameras
    icon: cameras
    label: Cameras
    active_paths:
      - /lovelace/sidebar-cameras
      - /ngocjohn-main/sidebar-cameras
    divider_after: true
    tap_action:
      action: navigate
      navigation_path: /lovelace/sidebar-cameras

  - key: system
    icon: system
    label: Sistema
    tap_action: !include ../../shared/popup/footer/footer_system.yaml

  - key: vacuum
    icon: vacuum
    label: Aspirador
    active_paths:
      - /lovelace/sidebar-roborock
      - /ngocjohn-main/sidebar-roborock
    tap_action:
      action: navigate
      navigation_path: /lovelace/sidebar-roborock

  - key: network
    icon: network
    label: Rede
    tap_action: !include ../../shared/popup/footer/footer_network.yaml

  - key: refresh
    icon: refresh
    label: Atualizar
    tap_action:
      action: call-service
      service: browser_mod.javascript
      service_data:
        code: location.reload()

  - key: updates
    icon: updates
    label: Updates
    tap_action: !include ../../shared/popup/footer/footer_updates.yaml

  - key: floorplan
    icon: floorplan
    label: Planta 3D
    active_paths:
      - /lovelace/sidebar-floorplan
      - /ngocjohn-main/sidebar-floorplan
    divider_after: true
    tap_action:
      action: navigate
      navigation_path: /lovelace/sidebar-floorplan

bottom_items:
  - key: power
    icon: power
    label: Power
    tap_action:
      action: navigate
      navigation_path: /
