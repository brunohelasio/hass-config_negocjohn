# mobile_cameras_card.yaml  (V3.1) — lista vertical das 8 câmeras mobile
# Criado: 2026-05-10
# Atualizado: 2026-05-11 — substituído bento_cameras.yaml por lista vertical
#
# O bento_cameras.yaml (v7/v10) usa input_select.bento_active_camera para
# mostrar 1 câmera em destaque + 4 miniaturas — padrão de "foco" desenhado
# para desktop. Na aba Câmeras mobile o usuário quer as 8 câmeras empilhadas
# verticalmente para scroll completo.
#
# Câmeras (8 total, confirmadas em cameras_user.yaml):
#   sl_camera_2     — Sala
#   vr_camera_2     — Varanda
#   cz_camera_2     — Cozinha
#   as_camera_2     — Área de Serviço
#   of_camera_2     — Office
#   camera_quarto_casal_2  — Quarto Casal
#   qmi_camera_2    — Quarto Miguel
#   qma_camera_2    — Quarto Marina
#
# ROLLBACK RÁPIDO para V3.0 (bento_cameras.yaml):
#   Descomentar o bloco original no final deste arquivo e comentar o bloco NOVO.
# ══════════════════════════════════════════════════════════════════════════════

