# ══════════════════════════════════════════════════════════════════════════════
# mobile-midia.yaml  (V3) — Aba Midia
# Criado: 2026-05-10 — Mobile V3
#
# Reusa shared/grid-cards/bento_media.yaml via wrapper mobile.
# ══════════════════════════════════════════════════════════════════════════════

title: Mídia
path: mobile-midia
icon: mdi:music
subview: false
theme: tablet

type: custom:grid-layout
card_mod:
  style: |
    hui-grid-layout {
      background: rgb(0, 0, 0);
      min-height: 100vh;
    }
layout:
  margin: 0
  padding: 14px 14px calc(96px + env(safe-area-inset-bottom, 0px)) 14px
  grid-template-columns: 1fr
  grid-auto-rows: min-content
  grid-gap: 10px

cards:
  - !include ../../shared/mobile/mobile_media_card.yaml
  - !include ../../shared/mobile/mobile_pill_nav.yaml
