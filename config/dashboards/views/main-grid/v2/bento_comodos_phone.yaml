# HOME V4 (2026-08-22): a matriz vertical antiga fica DESATIVADA no phone.
# Os 7 cômodos agora são montados pelo compositor em bento_sala_phone.yaml,
# em duas páginas horizontais. Mantemos este arquivo inteiro como rollback.
type: grid
columns: 1
square: false
view_layout:
  grid-area: comodos
  show:
    # ANTERIOR: mediaquery: '(max-width: 800px)'
    # V4: condição impossível; o grid continua parseável, mas não monta.
    mediaquery: '(max-width: 0px)'
card_mod:
  style: |
    :host {
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
    }
    #root {
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      gap: 0 !important;
    }
    #root > * {
      height: 100% !important;
      margin: 0 !important;
    }
cards:
  - !include ../../../shared/grid-cards/bento_comodos_matriz.yaml
