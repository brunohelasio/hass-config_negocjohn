#  QUICK ACTIONS (BENTO)
#  Regra de Ouro: NUNCA deletar — sempre comentar antes de substituir.
#-

- type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-auto-flow: column
    grid-auto-columns: 52px
    grid-column-gap: 8px
    align-items: center
    justify-content: start
    margin: 0
    padding: 0 10px
  card_mod:
    style: |
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }
  cards:
    - type: custom:button-card
      icon: mdi:lightbulb-off-outline
      show_name: false
      tap_action:
        action: call-service
        service: homeassistant.turn_off
        data:
          entity_id: light.todas_as_luzes
      hold_action:
        action: none
      styles: &quick_icon_styles
        card:
          - width: 52px
          - height: 52px
          - border-radius: 14px
          # ANTERIOR: rgba(255,255,255,0.10) + borda simples.
          - background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30))
          - border: 1px solid rgba(255,255,255,0.10)
          - backdrop-filter: blur(20px) saturate(1.35)
          - -webkit-backdrop-filter: blur(20px) saturate(1.35)
          - box-shadow: 0 0 32px rgba(59,130,246,0.12), inset 0 1px 0 rgba(191,219,254,0.15), 0 8px 32px rgba(0,0,0,0.20)
          - margin: 0
          - padding: 0
        icon:
          - color: rgba(255,255,255,0.92)
          - width: 22px

    - type: custom:button-card
      icon: mdi:movie-roll
      show_name: false
      tap_action:
        action: none
      hold_action:
        action: none
      styles: *quick_icon_styles

    - type: custom:button-card
      icon: mdi:laptop
      show_name: false
      tap_action:
        action: none
      hold_action:
        action: none
      styles: *quick_icon_styles

    - type: custom:button-card
      icon: mdi:sofa-outline
      show_name: false
      tap_action:
        action: none
      hold_action:
        action: none
      styles: *quick_icon_styles

    # NOVO (2026-05-08): Wi-Fi QR Code (inline para evitar falha de include)
    - type: custom:button-card
      icon: mdi:wifi
      show_name: false
      tap_action:
        action: fire-dom-event
        browser_mod:
          service: browser_mod.popup
          data:
            title: Wi-Fi
            tag: wifi_qr
            # ANTERIOR: size: wide deixava o QR em popup grande demais.
            style: >
              --popup-width: 450px;
              --popup-max-width: min(450px, calc(100vw - 32px));
              --popup-background-color: rgba(15, 20, 35, 0.75);
              --mdc-theme-surface: rgba(20, 24, 33, 0.88);
              --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.56);
              --dialog-box-shadow: 0 0 24px rgba(62, 132, 255, 0.22), 0 0 70px rgba(62, 132, 255, 0.14);
              --tablet-popup-content-padding: 0.4em 0.6em 0.6em 0.5em;
            card_mod:
              style:
                .: |
                  ha-dialog {
                    backdrop-filter: blur(12px);
                    -webkit-backdrop-filter: blur(12px);
                  }
                ha-dialog$: |
                  .mdc-dialog__scrim {
                    background-color: rgba(0, 0, 0, 0.56) !important;
                  }
                  .mdc-dialog__container {
                    align-items: center !important;
                    justify-content: center !important;
                  }
                  .mdc-dialog__surface {
                    width: 450px !important;
                    max-width: min(450px, calc(100vw - 32px)) !important;
                    max-height: 88vh !important;
                    overflow-y: auto !important;
                  }
            content:
              type: picture
              image: /local/images/wifi_main_scanme.png
      hold_action:
        action: none
      styles: *quick_icon_styles
