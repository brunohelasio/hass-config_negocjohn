#
# Wrapper para o card da Sala no layout mobile.
# O bento_sala.yaml tem view_layout: grid-area: sala — aqui não é necessário.
# O card original (shared/grid-cards/bento_sala.yaml) já contém todo o glass
# style e a lógica de acendimento quando light.grupo_luzes_sala está on.
# ──────────────────────────────────────────────────────────────────────────────

type: custom:mod-card
card_mod:
  style: |
    ha-card {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }
card: !include ../../shared/grid-cards/bento_sala.yaml
