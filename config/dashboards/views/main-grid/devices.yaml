#                    DEVICES                    #
#                                               #
#################################################
- type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    margin: 0
    padding: 0
    grid-template-columns: 1fr
    grid-template-rows: min-content 1fr
  view_layout:
    grid-area: devices
    show:
      mediaquery: '(min-height: 463px)'
  cards:
    - type: custom:streamline-card
      template: grid_heading
      variables:
        - heading_title: 'Devices'
    - type: grid
      columns: 2
      cards: !include ../../shared/grid-cards/devices.yaml
