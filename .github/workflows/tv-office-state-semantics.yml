name: TV Office state semantics

on:
  push:
    branches:
      - fix/tv-office-state-semantics

permissions:
  contents: write

jobs:
  patch-and-check:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/tv-office-state-semantics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-src/package-lock.json

      - name: Apply guarded migration
        run: node scripts/validation/apply-tv-office-state-semantics.mjs

      - name: Install dashboard dependencies
        working-directory: dashboard-src
        run: npm ci

      - name: Run dashboard checks
        working-directory: dashboard-src
        run: npm run check

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard-src/src/config/rooms.config.ts dashboard-src/src/components/rooms/bruno-room-subview.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix(state): align TV and Office semantics"
          git push origin HEAD:fix/tv-office-state-semantics
