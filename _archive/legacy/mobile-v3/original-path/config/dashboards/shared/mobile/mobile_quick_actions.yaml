# mobile_quick_actions.yaml  (V3) — wrapper mobile das Acoes Rapidas
# Criado: 2026-05-10
# Atualizado: 2026-05-11 — override de justify-content para centralizar botões
#
# Reusa shared/grid-cards/bento_quick_actions.yaml — botoes ja sao
# pequenos e horizontais por padrao. Aqui apenas aplicamos pílula glass
# externa para coesao visual com os demais cards mobile.
#
# bento_quick_actions.yaml usa justify-content:start no seu layout-card.
# Para nao tocar em templates globais, usamos card_mod dict-style para
# piercear o shadow DOM do hui-layout-card filho e sobrescrever a propriedade.
# Se o pierce nao for suportado na versao do card-mod instalada, os botoes
# continuarão à esquerda (comportamento aceitável pois o container tem
# overflow-x: auto e todos os botões ficam acessíveis via scroll).
# ══════════════════════════════════════════════════════════════════════════════

