# --- ESTRUTURA ANTERIOR COMENTADA — fallback rápido se nova estrutura falhar ---
# Histórico:
#   1) type:grid (commit antigo) → backdrop-filter não propagava
#   2) custom:stack-in-card + pirâmide de custom:layout-card aninhados
#      → ícones não centralizavam (host width:100%) e grupo inferior não
#         ancorava na base (1fr da row do meio colapsava por falta de
#         propagação de altura até hui-grid-layout interno).
#   3) refactor flexbox em ha-card (commits f7e608e/d875981) → 1 só flex item
#      (#root wrapper interno do stack-in-card consumia os filhos).
#   4) cirúrgico (:host width 42px + hui-grid-layout 100%) → seletores não
#      atingiram o elemento real renderizado pelo plugin.
# Para reverter para estrutura anterior:
#   • descomentar bloco abaixo (até "FIM ESTRUTURA ANTERIOR");
#   • comentar tudo abaixo de "NOVA ESTRUTURA 2026-05-09 (rev.3)";
#   • garantir que shared/grid-cards/bento_sidebar.yaml volte ao estado original
#     (commit 80b9410 ou anterior).
#
# type: custom:stack-in-card
# view_layout:
#   grid-area: sidebar
# card_mod:
#   style: |
#     :host {
#       height: 100% !important;
#       margin: 0 !important;
#       display: block !important;
#     }
#     ha-card {
#       height: 100% !important;
#       margin: 0 !important;
#       display: block !important;
#       padding: 0 !important;
#       background: linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30)) !important;
#       backdrop-filter: blur(18px) saturate(1.2) !important;
#       -webkit-backdrop-filter: blur(18px) saturate(1.2) !important;
#       border: 1px solid rgba(255,255,255,0.10) !important;
#       border-radius: 16px !important;
#       overflow: hidden !important;
#       --ha-card-backdrop-filter: none !important;
#       --ha-card-background: transparent !important;
#       --ha-card-border-width: 0 !important;
#     }
#     ha-card::before {
#       display: none !important;
#     }
# cards: !include ../../shared/grid-cards/bento_sidebar.yaml
# --- FIM ESTRUTURA ANTERIOR ---

# ════════════════════════════════════════════════════════════════════════════
# NOVA ESTRUTURA 2026-05-09 (rev.3): custom:button-card raiz + custom_fields
# ════════════════════════════════════════════════════════════════════════════
# Por que esta estrutura é diferente das anteriores:
#   • NÃO depende de seletores frágeis de plugin (#root, hui-grid-layout)
#   • NÃO depende do comportamento interno do custom:stack-in-card
#   • CSS Grid 2 rows (max-content + 1fr) com place-self:end center no bottom
#     field é a forma canônica do CSS Grid de ancorar conteúdo na base
#   • button-card responde nativamente a styles.grid e styles.custom_fields,
#     padrão usado em vários outros lugares do projeto (tpl_sectors, tpl_chips,
#     subviews/sala, etc.)
#
# Como os 2 problemas são resolvidos:
#   1) CENTRALIZAÇÃO: cada botão filho tem :host{width:42px} via card_mod;
#      o vertical-stack pai herda max-content (~42px); place-self:center
#      no styles.custom_fields.top/bottom centraliza essa coluna estreita
#      dentro da grid-area (que é mais larga).
#   2) ANCORAGEM: grid-template-rows: max-content 1fr define duas rows;
#      a row "bottom" recebe o 1fr (fica grande); place-self:end alinha o
#      conteúdo da bottom-area ao final dessa row (= base do sidebar).
#
# Conteúdo de shared/grid-cards/bento_sidebar.yaml não é mais incluído.
# Aquele arquivo continua existindo no repo como fallback.

type: custom:button-card
view_layout:
  grid-area: sidebar
show_icon: false
show_name: false
show_state: false
show_label: false
tap_action:
  action: none
hold_action:
  action: none
# FIX largura/altura: força o host do button-card raiz a preencher 100% da
# grid-area "sidebar" (64px × altura total das 5 rows). Sem isto, o host
# encolhe para max-content do grid interno e a sidebar fica estreita/curta.
card_mod:
  style: |
    :host {
      width: 100% !important;
      height: 100% !important;
      display: block !important;
    }
styles:
  card:
    - height: 100%
    - width: 100%
    - padding: 8px 0
    - background: 'linear-gradient(160deg, rgba(15,20,35,0.46), rgba(20,24,33,0.30))'
    - backdrop-filter: blur(18px) saturate(1.2)
    - -webkit-backdrop-filter: blur(18px) saturate(1.2)
    - border: 1px solid rgba(255,255,255,0.10)
    - border-radius: 16px
    - overflow: hidden
    - box-shadow: none
  grid:
    - grid-template-areas: '"top" "bottom"'
    - grid-template-columns: 1fr
    - grid-template-rows: max-content 1fr
    # FIX altura: grid container precisa height/width 100% explicito para o
    # 1fr da row "bottom" expandir e ancorar o grupo inferior na base.
    - height: 100%
    - width: 100%
  custom_fields:
    top:
      - place-self: start center
      - width: max-content
      - padding-top: 4px
    bottom:
      - place-self: end center
      - width: max-content
      - padding-bottom: 4px
custom_fields:
  # ──────────────── GRUPO TOP (9 ícones) ────────────────
  top:
    card:
      type: vertical-stack
      cards:
        # ── home (anchor base — todos os outros botões fazem merge dele) ─
        - &nav_btn
          type: custom:button-card
          entity: input_select.bento_sidebar_active
          triggers_update:
            - input_select.bento_sidebar_active
          show_icon: false
          show_name: false
          show_state: false
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: home
          hold_action: { action: none }
          variables:
            nav_key: home
          # FIX centralização: força :host width 42px (default seria 100%)
          # com margin auto para se centralizar dentro do vertical-stack pai
          # (que ocupa a largura total da coluna 64px da sidebar).
          # FIX background falso: --ha-card-background do tema (cor escura) era
          # herdada pelo ha-card interno mesmo com styles.card.background:transparent
          # — a variável CSS tem precedência sobre a propriedade quando renderiza.
          # Override explícito da variável + variantes que algumas versões usam.
          card_mod:
            style: |
              :host {
                width: 42px !important;
                display: block !important;
                margin: 3px auto !important;
                align-self: center !important;
                justify-self: center !important;
                --ha-card-background: transparent !important;
                --ha-card-background-color: transparent !important;
                --card-background-color: transparent !important;
                --primary-background-color: transparent !important;
                --ha-card-border-width: 0 !important;
                --ha-card-box-shadow: none !important;
              }
              :host(:active) ha-card {
                background: rgba(255,255,255,0.14) !important;
                transition: background 0.12s ease;
              }
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>';
              ]]]
          styles:
            card:
              - width: 42px
              - height: 42px
              - border-radius: 12px
              - padding: 0
              - background: >
                  [[[
                    return entity?.state === variables.nav_key
                      ? 'rgba(255,255,255,0.12)'
                      : 'transparent';
                  ]]]
              # FIX contornos: backdrop-filter agora condicional ao estado ativo.
              # Aplicado sempre criava efeito frosted visivel mesmo com
              # background:transparent — fronteira de cada icone aparecia
              # como contorno permanente. Solucao: filter:none quando inativo.
              - backdrop-filter: >
                  [[[
                    return entity?.state === variables.nav_key
                      ? 'blur(12px) saturate(1.15)'
                      : 'none';
                  ]]]
              - -webkit-backdrop-filter: >
                  [[[
                    return entity?.state === variables.nav_key
                      ? 'blur(12px) saturate(1.15)'
                      : 'none';
                  ]]]
              - border: >
                  [[[
                    return entity?.state === variables.nav_key
                      ? '1px solid rgba(255,255,255,0.18)'
                      : '1px solid transparent';
                  ]]]
              - box-shadow: >
                  [[[
                    return entity?.state === variables.nav_key
                      ? 'inset 0 1px 0 rgba(255,255,255,0.12), 0 4px 10px rgba(0,0,0,0.20)'
                      : 'none';
                  ]]]
              - transition: background 0.12s ease
            custom_fields:
              ico: [display: flex, align-items: center, justify-content: center, width: 100%, height: 100%]
            grid: [grid-template-areas: '"ico"', grid-template-columns: 1fr, grid-template-rows: 1fr, place-items: center]
        # ── música ──────────────────────────────────────────────────
        - <<: *nav_btn
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: music
          variables:
            nav_key: music
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
              ]]]
        # ── segurança (popup câmeras) ───────────────────────────────
        - <<: *nav_btn
          entity: input_select.bento_sidebar_action
          triggers_update:
            - input_select.bento_sidebar_action
          tap_action: !include ../../shared/popup/cameras_user.yaml
          variables:
            nav_key: security
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>';
              ]]]
        # ── atividade / radar ───────────────────────────────────────
        - <<: *nav_btn
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: activity
          variables:
            nav_key: activity
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>';
              ]]]
        # ── vacuum (popup roborock) ─────────────────────────────────
        - <<: *nav_btn
          entity: input_select.bento_sidebar_action
          triggers_update:
            - input_select.bento_sidebar_action
          tap_action: !include ../../shared/popup/footer/footer_vacuum.yaml
          variables:
            nav_key: vacuum
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2"/><line x1="12" y1="3" x2="12" y2="5"/></svg>';
              ]]]
        # ── wifi ────────────────────────────────────────────────────
        - <<: *nav_btn
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: wifi
          variables:
            nav_key: wifi
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>';
              ]]]
        # ── refresh ─────────────────────────────────────────────────
        - <<: *nav_btn
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: refresh
          variables:
            nav_key: refresh
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>';
              ]]]
        # ── download ────────────────────────────────────────────────
        - <<: *nav_btn
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: download
          variables:
            nav_key: download
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
              ]]]
        # ── cubo ────────────────────────────────────────────────────
        - <<: *nav_btn
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: cube
          variables:
            nav_key: cube
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>';
              ]]]
  # ──────────────── GRUPO BOTTOM (2 ícones) ────────────────
  # Ancorado na base via place-self:end center em styles.custom_fields.bottom.
  bottom:
    card:
      type: vertical-stack
      cards:
        # ── monitor / dashboard ─────────────────────────────────────
        - <<: *nav_btn
          tap_action:
            action: call-service
            service: input_select.select_option
            data:
              entity_id: input_select.bento_sidebar_active
              option: monitor
          variables:
            nav_key: monitor
          custom_fields:
            ico: >
              [[[
                return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:20px;height:20px;display:block;"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>';
              ]]]
        # ── power ───────────────────────────────────────────────────
