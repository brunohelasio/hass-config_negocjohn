action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: System Information
    dismissable: true
    style: >
      --popup-width: min(960px, 94vw);
      --popup-max-width: min(960px, 94vw);
      --popup-border-width: 0;
      --popup-background-color: rgba(12, 16, 24, 0.86);
      --mdc-theme-surface: rgba(12, 16, 24, 0.86);
      --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.38);
    card_mod: !include ../../snippets/style_popup_center.yaml
    content:
      type: custom:bruno-system-panel-card
      metrics:
        cpu:
          - sensor.ha_system_cpu_usage
          - sensor.system_monitor_processor_use
        temperature:
          - sensor.ha_system_cpu_thermal_0_temperature
          - sensor.system_monitor_processor_temperature
        memory:
          - sensor.ha_system_memory_usage
          - sensor.system_monitor_memory_usage
        disk:
          - sensor.ha_system_data_disk_usage
          - sensor.system_monitor_disk_usage
      rpi:
        status: binary_sensor.192_168_0_146
        cpu: sensor.rpi_monitor_docker_rpi_cpu_use_pidocker
        temperature: sensor.rpi_monitor_docker_rpi_temp_pidocker
        memory: sensor.rpi_monitor_docker_rpi_used_pidocker
        disk: sensor.rpi_monitor_docker

