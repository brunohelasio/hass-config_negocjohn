# ══════════════════════════════════════════════════════════════════════════════
# mobile_card_room_compact.yaml  (V3)
# Criado: 2026-05-10 — Mobile V3
#
# Componente "card de comodo compacto" para mobile.
# Aplica o vidro Bento (mesmo glass dos wrappers desktop) com altura
# controlada e reusa o conteudo original de cada cômodo via includes
# diretos a shared/grid-cards/bento_<X>.yaml — esses arquivos NAO tem
# `view_layout` no topo, sao seguros para reuso fora do main grid.
#
# Como usar:
#   - !include ../../shared/mobile/mobile_card_room_compact.yaml: { _src: bento_office.yaml }
# (mas como o HA YAML nao suporta argumentos de include, este arquivo e
#  apenas referencia / documentacao do padrao — os wrappers reais ficam em
#  arquivos separados por cômodo nesse mesmo diretorio.)
#
# REGRA DE OURO: arquivo NOVO; aditivo; nada do main-grid foi alterado.
# ══════════════════════════════════════════════════════════════════════════════

