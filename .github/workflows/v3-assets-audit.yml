name: V3 Assets Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'config/www/bruno-ui/assets/V3/**'
      - 'scripts/assets/audit_v3.py'
      - '.github/workflows/v3-assets-audit.yml'
  push:
    branches:
      - feat/assets-v3-5g
    paths:
      - 'config/www/bruno-ui/assets/V3/**'
      - 'scripts/assets/audit_v3.py'
      - '.github/workflows/v3-assets-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias
        run: python -m pip install --upgrade pillow

      - name: Auditar V3
        run: python scripts/assets/audit_v3.py

      - name: Publicar auditoria
        uses: actions/upload-artifact@v4
        with:
          name: v3-audit
          path: docs/_tmp/v3-audit/
          if-no-files-found: error
          retention-days: 7
