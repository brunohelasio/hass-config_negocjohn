      - name: Point configuration to generated entry and validate
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, json
          root=Path.cwd()
          out=root/'config/www/dashboard'
          entries=sorted([p for p in out.glob('bruno-dashboard.*.js') if p.is_file()])
          if len(entries)!=1:
              raise SystemExit(f'expected one entry bundle, got {[p.name for p in entries]}')
          entry=entries[0]
          cfg=(root/'config/configuration.yaml').read_text(encoding='utf-8')
          cfg,n=re.subn(r'^\s*- /local/dashboard/bruno-dashboard\.[^\s]+\.js\s*$',f'    - /local/dashboard/{entry.name}',cfg,count=1,flags=re.M)
          if n!=1: raise SystemExit(f'active bundle line replacements={n}')
          (root/'config/configuration.yaml').write_text(cfg,encoding='utf-8')

          required=[entry,Path(str(entry)+'.br'),Path(str(entry)+'.gz')]
          chunks=list((out/'chunks').glob('*.js'))
          if not chunks: raise SystemExit('no lazy chunks generated')
          for p in required+chunks:
              if not p.exists(): raise SystemExit(f'missing {p}')
          for p in chunks:
              for suffix in ['.br','.gz']:
                  if not Path(str(p)+suffix).exists(): raise SystemExit(f'missing compressed sibling {p}{suffix}')

          checks={
            'config/subviews':'dashboard-src/src/config/subviews.config.ts',
            'room config':'dashboard-src/src/config/rooms.config.ts',
            'room subview':'dashboard-src/src/components/rooms/bruno-room-subview.ts',
            'sala card':'config/www/bruno-ui/cards/bruno-sala-card.js',
            'media card':'config/www/bruno-ui/cards/bruno-media-card.js',
            'active player':'config/packages/active_player.yaml',
            'home activity':'config/packages/home_activity.yaml',
            'tv controls':'config/packages/sala_tv_controls.yaml',
          }
          for label,path in checks.items():
              t=(root/path).read_text(encoding='utf-8')
              if 'remote.atv' in t: raise SystemExit(f'{label}: remote.atv still active')
          # ADB may remain in comments/docs/rollback, but not in the active TV authority configs below.
          for path in checks.values():
              t=(root/path).read_text(encoding='utf-8')
              active='\n'.join(line for line in t.splitlines() if not line.lstrip().startswith(('#','//')))
              if 'media_player.android_tv_192_168_3_17' in active:
                  raise SystemExit(f'ADB still active in {path}')

          print('ENTRY',entry.name,entry.stat().st_size)
          print('CHUNKS',len(chunks))
          for p in sorted(chunks): print('CHUNK',p.name,p.stat().st_size,Path(str(p)+'.br').stat().st_size)
