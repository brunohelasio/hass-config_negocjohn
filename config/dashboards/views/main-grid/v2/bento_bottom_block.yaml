        #   double_tap_action:
        #     action: fire-dom-event
        #     bruno_section: cozinha
        #   variant: tile
        #   divider_left: true
        # - type: custom:bruno-lavabo-card
        #   double_tap_action: !include ../../../shared/popup/rooms/lavabo.yaml
        #   variant: tile
        #   divider_left: true
        # Corredor: 8o tile. Sem subview propria (nao tem uma) e sem popup —
        # o valor dele e o toggle direto.
        # - type: custom:bruno-corredor-card
