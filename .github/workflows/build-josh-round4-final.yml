O Josh phone tinha receita ON hard-coded propria e o bridge tentava impor outra depois. **Decisao:** uma autoridade. `bruno-josh.js` resolve diretamente os valores de `BrunoLiquidGlassOriginal.tokens['bruno-liquid-surface-on-*']`, expostos como `bruno-josh-room-on-*`; `bruno-room-tile.ts` consome esses tokens somente no ON do phone. Raio, OFF, semantica, logica, gestos, layout e assets nao mudam. O bridge fica inerte.

