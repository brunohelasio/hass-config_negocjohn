name: Execute full candidate on PR

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  execute:
    if: ${{ github.head_ref == 'fix/mobile-runtime-tv-curtain-20260819' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard generated commit
        id: guard
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -Fq '[generated candidate]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard-src/package-lock.json

      - name: Apply complete diagnosed implementation
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 scripts/build/apply-full-candidate-20260820.py
          sed -i '1iexport {};' dashboard-src/src/diagnostics/startup-metrics.ts

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        working-directory: dashboard-src
        run: npm ci

      - name: Typecheck lint tests
        if: steps.guard.outputs.skip != 'true'
        working-directory: dashboard-src
        run: |
          npm run typecheck
          npm run lint
          npm run test

      - name: Build split bundle and fresh compression
        if: steps.guard.outputs.skip != 'true'
        working-directory: dashboard-src
        run: npm run build

      - name: Validate generated candidate
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          python3 scripts/build/validate-full-candidate-20260820.py
          node scripts/validation/check-yaml.mjs

      - name: Commit and push full candidate
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'feat: implementar candidata integral TV e cold-start [generated candidate]'
          git push origin HEAD:fix/mobile-runtime-tv-curtain-20260819
