          metrics='''type StartupMetric = { at: number; resources?: number; transferBytes?: number };

type StartupState = {
  startedAt: number;
  marks: Record<string, StartupMetric>;
};

const state: StartupState = {
  startedAt: performance.now(),
  marks: {},
};

function mark(name: string): void {
  state.marks[name] = { at: Math.round(performance.now()) };
}

mark('module');

customElements.whenDefined('bruno-shell').then(() => mark('shell-defined'));
window.addEventListener('DOMContentLoaded', () => mark('dom-content-loaded'), { once: true });
window.addEventListener('load', () => {
  const entries = performance.getEntriesByType('resource') as PerformanceResourceTiming[];
  const transferBytes = entries.reduce((sum, entry) => sum + Number(entry.transferSize || 0), 0);
  state.marks.load = {
    at: Math.round(performance.now()),
    resources: entries.length,
    transferBytes,
  };
}, { once: true });

(globalThis as typeof globalThis & { brunoStartup?: StartupState }).brunoStartup = state;
'''
