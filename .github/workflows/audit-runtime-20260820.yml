name: Audit active dashboard runtime

on:
  push:
    branches: [fix/mobile-runtime-tv-curtain-20260819]
  pull_request:
    branches: [main]
    types: [synchronize]

jobs:
  audit:
    if: ${{ github.ref_name == 'fix/mobile-runtime-tv-curtain-20260819' || github.head_ref == 'fix/mobile-runtime-tv-curtain-20260819' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit active YAML and JS resource usage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re, json

          def active_text(path):
              lines=[]
              for line in path.read_text(encoding='utf-8',errors='ignore').splitlines():
                  if line.lstrip().startswith('#'): continue
                  line=re.sub(r'\s+#.*$','',line)
                  lines.append(line)
              return '\n'.join(lines)+'\n'

          entry=Path('config/dashboards/views/bento_shell.yaml')
          seen=set(); ordered=[]
          inc_re=re.compile(r'!include\s+([^\s#]+)')
          dir_re=re.compile(r'!include_dir_merge_(?:named|list)\s+([^\s#]+)')
          def visit(path):
              path=path.resolve()
              if path in seen or not path.exists(): return
              seen.add(path); ordered.append(path)
              text=active_text(path)
              for m in inc_re.finditer(text): visit((path.parent/m.group(1).strip('"\'')).resolve())
              for m in dir_re.finditer(text):
                  d=(path.parent/m.group(1).strip('"\'')).resolve()
                  if d.is_dir():
                      for c in sorted(d.rglob('*.yaml')): visit(c)
          visit(entry)
          yaml_custom=set()
          for p in ordered: yaml_custom.update(re.findall(r'custom:([A-Za-z0-9_.-]+)',active_text(p)))

          generated=Path('dashboard-src/src/legacy-runtime.generated.ts').read_text(encoding='utf-8')
          classic=[]
          for rel in re.findall(r"import ['\"]([^'\"]+\.js)['\"]",generated):
              p=(Path('dashboard-src/src')/rel).resolve()
              if p.exists(): classic.append(p)
          js_custom=set()
          for p in classic:
              js_custom.update(re.findall(r'custom:([A-Za-z0-9_.-]+)',p.read_text(encoding='utf-8',errors='ignore')))
          for p in Path('dashboard-src/src').rglob('*.ts'):
              js_custom.update(re.findall(r'custom:([A-Za-z0-9_.-]+)',p.read_text(encoding='utf-8',errors='ignore')))

          print('REACHABLE_YAML',len(ordered))
          print('YAML_CUSTOM',json.dumps(sorted(yaml_custom)))
          print('ACTIVE_CLASSIC_MODULES',len(classic))
          print('JS_CUSTOM',json.dumps(sorted(js_custom)))
          print('ALL_CUSTOM',json.dumps(sorted(yaml_custom|js_custom)))
          PY
