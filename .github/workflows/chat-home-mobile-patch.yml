name: Chat home mobile patch

on:
  push:
    branches:
      - chat/home-mobile-hero-rail-20260817

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/home-mobile-hero-rail-20260817
          fetch-depth: 0

      - name: Apply diagnosed patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          hero = 'config/www/bruno-ui/cards/bruno-hero-card.js'
          sidebar = 'config/www/bento-sidebar-card.js'
          config = 'config/configuration.yaml'

