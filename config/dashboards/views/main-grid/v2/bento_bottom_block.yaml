# ==========================================================================
# HOME V2/V3 — BLOCO INFERIOR UNIFICADO (7 tiles de cômodo).
#
# REV.8 (2026-07-26) — HOME V3: a pele da banda e dos cômodos passou a vir
# de TOKENS DE TEMA. Os defaults abaixo reproduzem a moldura em cartela de
# hoje, então iOS / visionOS / Liquid Glass ficam idênticos. Somente o
# Josh.ai declara os tokens novos e vira tiles + banda full-bleed.
#
# --------------------------------------------------------------------------
# INVARIANTE CRÍTICA — leia antes de mexer em blur nesta banda
# --------------------------------------------------------------------------
# A faixa Josh usa uma superficie estatica autonoma, sem backdrop-filter.
# Isso evita backdrop roots e torna a composicao deterministica em PC/tablet.
# Os demais temas continuam usando os defaults de cartela deste arquivo.
# --------------------------------------------------------------------------
#
# GEOMETRIA ATUAL (2026-09-01; determinística — nada depende de height:100%,
# que não resolve
# nesta base por causa do <hui-card> do HA 2026.3):
#   banda     = calc(26.285714vh - 15.428571px) [linha `bottom_block`]
#   padding   = 12px laterais/topo, 0 embaixo
#   conteúdo  = linha de tiles = calc(26.285714vh - 27.428571px)
#   fator     = conteúdo anterior calc(23vh - 24px) × 8/7
#   ANTERIOR (rollback 8 tiles): banda calc(23vh - 12px), conteúdo
#               calc(23vh - 24px)
#   sangramento lateral = --bruno-strip-bleed (0 default; 12px no Josh)
#               12px alcançam a borda da rail (86px) e a do viewport, pois o
#               content-slot da shell tem padding 12px e corta na padding box.
#   Verticalmente a banda NÃO sangra — preserva o alinhamento do dock.
#
# ROLLBACK: em shell/section_home_v2.yaml, voltar às áreas separadas
# `comodos` + `quick_actions` (bento_comodos_strip.yaml e
# bento_quick_actions_v2.yaml seguem preservados no disco).
# ==========================================================================
type: custom:mod-card
view_layout:
  grid-area: bottom_block
  show:
    mediaquery: '(min-width: 801px)'
card_mod:
  style: |
    :host {
      display: block;
      height: 100%;
      min-height: 0;
    }
    ha-card {
      position: relative;
      isolation: isolate;
      height: 100%;
      box-sizing: border-box;
      /* Sem padding inferior: o dock encosta na base (alinhamento c/ Power). */
      padding: 12px 12px 0;
      /* ---- Chrome por TOKEN. Defaults = moldura em cartela de hoje. ----
         No Josh.ai o elemento externo e neutralizado; a tinta e os dois
         filetes sao desenhados pelos pseudo-elementos abaixo. */
      border-radius: var(--bruno-strip-frame-radius, 22px);
      border: var(--bruno-strip-frame-border, 1px solid rgba(255,255,255,0.10)) !important;
      background: var(--bruno-strip-frame-background,
        linear-gradient(180deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018))) !important;
      /* Default `none` por causa da INVARIANTE no cabeçalho deste arquivo. */
      backdrop-filter: var(--bruno-strip-frame-filter, none) !important;
      -webkit-backdrop-filter: var(--bruno-strip-frame-filter, none) !important;
      box-shadow: var(--bruno-strip-frame-shadow,
        inset 0 1px 0 rgba(255,255,255,0.12)) !important;
      /* Sangramento lateral ASSIMETRICO (0 = comportamento atual).
         O grid da secao tem uma coluna `sidebar` de 0px seguida de um gap de
         10px — espaco morto entre a rail e a faixa. O sangramento de inicio
         recupera esse gap; o de fim leva a faixa ate a borda do viewport.
         Os tokens -start/-end caem no simetrico quando nao definidos. */
      margin:
        0
        calc(-1 * var(--bruno-strip-bleed-end, var(--bruno-strip-bleed, 0px)))
        0
        calc(-1 * var(--bruno-strip-bleed-start, var(--bruno-strip-bleed, 0px)));
      width: calc(100%
        + var(--bruno-strip-bleed-start, var(--bruno-strip-bleed, 0px))
        + var(--bruno-strip-bleed-end, var(--bruno-strip-bleed, 0px)));
      /* Pontas dissolvendo na borda atmosférica da shell (none = reto). */
      -webkit-mask-image: var(--bruno-strip-mask, none);
      mask-image: var(--bruno-strip-mask, none);
      overflow: hidden;
    }
    /* Camadas opcionais da faixa Josh. Nos demais temas os defaults
       transparentes preservam integralmente a cartela existente. */
    ha-card::before,
    ha-card::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: inherit;
    }
    ha-card::before {
      inset: 0;
      z-index: 0;
      background: var(--bruno-strip-frame-fill, none);
      opacity: var(--bruno-strip-frame-fill-opacity, 0);
      -webkit-mask-image: var(--bruno-strip-frame-fill-fade, none);
      mask-image: var(--bruno-strip-frame-fill-fade, none);
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
      mask-size: 100% 100%;
    }
    ha-card::after {
      inset: 0;
      z-index: 4;
      padding: 0;
      background:
        var(--bruno-strip-frame-top-line, linear-gradient(transparent, transparent)) top center / 100% 1px no-repeat,
        var(--bruno-strip-frame-bottom-line, linear-gradient(transparent, transparent)) bottom center / 100% 1px no-repeat;
      -webkit-mask: none;
      mask: none;
      opacity: var(--bruno-strip-frame-lines-opacity, 0);
    }
    ha-card > * {
      position: relative;
      z-index: 1;
      display: block;
      height: 100%;
      min-height: 0;
    }
card:
  type: custom:layout-card
  layout_type: custom:grid-layout
  layout:
    grid-template-columns: minmax(0, 1fr)
    # ANTERIOR (rollback 5e.2): duas linhas — comodos + dock de 54px.
    #   grid-template-rows: calc(23vh - 24px) 54px
    # NOVO: linha unica — a faixa de tiles ocupa a banda inteira.
    grid-template-rows: minmax(0, 1fr)
    grid-gap: 10px
    margin: 0
    padding: 0
  cards:
    # ---- Faixa dos 7 cômodos ----------------------------------------
    - type: custom:layout-card
      layout_type: custom:grid-layout
      layout:
        # ANTERIOR (2026-07-29): 8 colunas — o Corredor virou tile proprio. Das
        # tres alternativas estudadas (partir o tile do Lavabo, mover para a
        # rail, ou tile proprio), esta e a unica que preserva a homogeneidade
        # da serie, que e a regra que sustenta o visual de tiles + filetes.
        # O clique unico do Corredor vem da mecanica que ja existe: o tap do
        # tile e toggle da luz do comodo.
        # ANTERIOR (Fase 5a): repeat(9, ...) — a 9a coluna era o tile novo ao
        # lado do card antigo do Office, so para a comparacao lado a lado.
        # NOVO (2026-09-01): 7 colunas homogeneas. O Corredor continua em
        # ROOMS e na sheet global de iluminacao, mas deixa de ter tile visual.
        # O espaco liberado e absorvido integralmente pelos sete tracks.
        # ANTERIOR (rollback): repeat(8, minmax(0, 1fr))
        grid-template-columns: repeat(7, minmax(0, 1fr))
        # ANTERIOR (rollback 8 tiles): calc(23vh - 24px)
        grid-template-rows: calc(26.285714vh - 27.428571px)
        # Gap por TOKEN: 10px (cartela, como hoje) / 0 no Josh, onde o filete
        # vertical de 1px do tile substitui o gap.
        grid-gap: var(--bruno-tile-gap, 10px)
        margin: 0
        # No Josh, os insets start + end continuam somando os mesmos 60px da
        # calibragem anterior. O limite externo nao muda e todo o restante e
        # repartido entre os sete tracks; nenhum gap ou margem nova foi criado.
        padding: 0 var(--bruno-tile-grid-inset-end, var(--bruno-tile-grid-inline-inset, 0px)) 0 var(--bruno-tile-grid-inset-start, var(--bruno-tile-grid-inline-inset, 0px))
      cards:
        # ══ FASE 5b, 2026-08-04 — a faixa passa a ser UM componente ═════════
        # Os cômodos deixaram de ser cards separados e passaram a instâncias
        # homogêneas de `bruno-room-tile`, parametrizadas por `room:`. Tudo que
        # variava entre eles — entidades, alvo do toque, pontos de status,
        # seção da subview, painel próprio — vive em
        # `dashboard-src/src/config/rooms.config.ts`, declarado uma vez.
        #
        # A medição que autorizou a troca está em `scripts/harness/`: os oito
        # pares renderizados lado a lado, com os mesmos tokens e o mesmo estado.
        #
        # ISTO MUDA A APARÊNCIA DE SEIS TILES, de propósito. Os oito cards
        # antigos NÃO eram uniformes entre si: a caixa do ícone era 108×72 no
        # Office, Cozinha e Lavabo, 109×80 na Sala, Corredor, Casal e Miguel, e
        # 80×80 na Marina; o Lavabo e o Corredor reservavam 28px de métrica sem
        # ter sensor de clima. Agora todos seguem a composição do Office, que é
        # a documentada em docs/07.
        #
        # ROLLBACK (sem reiniciar): comentar este bloco e descomentar o bloco
        # ANTERIOR logo abaixo. Os oito cards antigos continuam no disco,
        # carregados e intactos.
        - type: custom:bruno-room-tile
          room: sala
          variant: tile
        - type: custom:bruno-room-tile
          room: office
          variant: tile
          divider_left: true
        - type: custom:bruno-room-tile
          room: cozinha
          variant: tile
          divider_left: true
        - type: custom:bruno-room-tile
          room: lavabo
          variant: tile
          divider_left: true
        # REMOVIDO VISUALMENTE (2026-09-01): o Corredor permanece em ROOMS,
        # automacoes e inventario da sheet Lights. Reativar esta instancia e
        # devolver a grade/alturas ao rollback de 8 tiles restaura o acesso.
        # - type: custom:bruno-room-tile
        #   room: corredor
        #   variant: tile
        #   divider_left: true
        - type: custom:bruno-room-tile
          room: casal
          variant: tile
          divider_left: true
        - type: custom:bruno-room-tile
          room: marina
          variant: tile
          divider_left: true
        - type: custom:bruno-room-tile
          room: miguel
          variant: tile
          divider_left: true
        # ── ANTERIOR (rollback) — os oito cards, um arquivo JS cada ──────────
        # ATENÇÃO: os 7 cards são declarados INLINE aqui, e não por
        # `!include ../bento_*.yaml`, porque a flag `variant: tile` não pode
        # entrar nos wrappers compartilhados — eles também alimentam a matriz
        # do phone (shared/grid-cards/bento_comodos_matriz.yaml) e a Home V1,
        # que devem permanecer idênticas. A config abaixo replica exatamente
        # a dos wrappers, apenas somando as flags de tile.
        # `divider_left` em todos MENOS o primeiro (Sala).
