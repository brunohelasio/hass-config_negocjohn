action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Updates
    dismissable: true
    style: >
      --popup-width: min(760px, 94vw);
      --popup-max-width: min(760px, 94vw);
      --popup-border-width: 0;
      --popup-background-color: rgba(12, 16, 24, 0.88);
      --mdc-theme-surface: rgba(12, 16, 24, 0.88);
      --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.38);
    card_mod: !include ../../snippets/style_popup_center.yaml
    content:
      type: custom:bruno-updates-panel-card
      entities:
        current: sensor.current_version
        latest: sensor.home_assistant_versions
        release_notes: sensor.hass_release_notes
        hacs_installed: sensor.hacs_installed
