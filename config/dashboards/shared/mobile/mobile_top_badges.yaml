# ══════════════════════════════════════════════════════════════════════════════
# mobile_top_badges.yaml  (V3) — barra de badges com scroll horizontal real
# Criado: 2026-05-10
#
# Reusa o conteudo original de views/main-grid/bento_top_badges.yaml — esse
# arquivo tem `view_layout: grid-area: top_badges` no topo, que e ignorado
# em silencio quando usado fora do main grid (parent nao e custom:grid-layout).
#
# O ponto-chave: o bento_top_badges interno e um custom:layout-card cuja
# coluna 5 e `minmax(0, 1fr)` — isso faz o conteudo se contrair na largura
# disponivel em vez de transbordar. Para forcar overflow no mobile, usamos
# card_mod profundo para neutralizar a coluna 1fr e fixar min-width:max-content
# no hui-grid-layout interno, criando overflow-x real.
# ══════════════════════════════════════════════════════════════════════════════

type: custom:mod-card
card_mod:
  style:
    .: |
      :host {
        display: block !important;
        width: 100% !important;
        overflow: hidden !important;
      }
      ha-card {
        background: transparent !important;
        border: none !important;
        box-shadow: none !important;
        overflow-x: auto !important;
        overflow-y: visible !important;
        -webkit-overflow-scrolling: touch !important;
        scrollbar-width: none !important;
        padding: 0 !important;
      }
      ha-card::-webkit-scrollbar {
        display: none !important;
      }
    # Forca o conteudo interno a transbordar horizontalmente:
    # neutraliza o `1fr` da coluna do bento_top_badges e empurra o grid
    # para `max-content`, criando overflow scroll.
    # ANTERIOR (errado): hui-card$ — custom:layout-card renderiza como
    # hui-layout-card, nao hui-card. Seletor nao alcancava o elemento certo.
    # hui-card$: |
    #   hui-grid-layout {
    #     min-width: max-content !important;
    #     width: max-content !important;
    #   }
    #   hui-grid-layout::part(container),
    #   hui-grid-layout > * {
    #     min-width: max-content !important;
    #   }
    hui-layout-card$: |
      hui-grid-layout {
        min-width: max-content !important;
        width: max-content !important;
      }
      hui-grid-layout::part(container),
      hui-grid-layout > * {
        min-width: max-content !important;
      }
card: !include ../../views/main-grid/bento_top_badges.yaml
