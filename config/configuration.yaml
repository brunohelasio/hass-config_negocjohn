# Loads default set of integrations. Do not remove.
default_config:

# ── LL-HLS: reduzir o atraso do video ao vivo das cameras (2026-08-08) ───────
#
# O PROBLEMA, medido na Fase 6.2B: no more-info da camera o relogio avanca
# continuamente, mas a imagem chega com 6 a 10 segundos de atraso — acender uma
# luz demora a aparecer. Vídeo liso porém atrasado e a assinatura do HLS: o
# componente `stream` corta a transmissao em segmentos e o player so comeca
# depois de encher o buffer.
#
# `part_duration` e o tamanho do PEDACO que o player pode consumir antes de o
# segmento inteiro terminar. Quanto menor, menos buffer — e menos atraso.
# Padrao do HA: 1.0 s. Aqui: 0.5 s.
#
# EXPECTATIVA HONESTA: de 6-10 s para algo em torno de 2 s. NAO chega a tempo
# real; para isso seria preciso go2rtc com RTSP local, tirando a nuvem da Tuya
# do caminho. Ver docs/24-performance-baseline.md.
#
# CUSTO: mais pedacos por segundo significa mais trabalho de empacotamento na
# VM. Se a CPU sofrer, subir `part_duration` para 0.75 ou 1.0 desfaz o efeito
# sem quebrar nada.
#
# ROLLBACK: comentar o bloco inteiro. O HA volta aos padroes.
stream:
  ll_hls: true
  part_duration: 0.5
  segment_duration: 6

