action: fire-dom-event
browser_mod:
  service: browser_mod.popup
  data:
    title: Network
    dismissable: true
    style: >
      --popup-width: min(900px, 94vw);
      --popup-max-width: min(900px, 94vw);
      --popup-border-width: 0;
      --popup-background-color: rgba(12, 16, 24, 0.86);
      --mdc-theme-surface: rgba(12, 16, 24, 0.86);
      --mdc-dialog-scrim-color: rgba(0, 0, 0, 0.38);
    card_mod: !include ../../snippets/style_popup_center.yaml
    content:
      type: custom:bruno-network-panel-card
      router_url: !secret router_url
      unifi_url: !secret unifi_url
      zigbee_url: /api/hassio_ingress/Ew2YSafnnerR2_NXuuOG-3KWDZvnNgFBSfdzoUmcR_Y/#/map
      entities:
        wan: binary_sensor.arris_tg3442de_wan_status
        clients: sensor.unifi_controller_clients
        all_clients: sensor.unifi_controller_all_clients
        alert: binary_sensor.unifi_controller_alert
        download: sensor.speedtest_download
        upload: sensor.speedtest_upload

