type: custom:bruno-room-card
name: Lavabo
icon_size: 74
entities:
  room_group: light.grupo_luzes_lavabo
  room_toggle: light.grupo_luzes_lavabo
  room_fallback_lights:
    - light.grupo_luzes_lavabo
  active_sensor: sensor.lavabo_active
icon:
  off: /local/bruno-ui/assets/lavabo-off.png?v=20260517-1
  on: /local/bruno-ui/assets/lavabo-on.png?v=20260517-1
  fallback: mdi:toilet
status_dots:
  - icon: mdi:account
    label: Presenca
    tone: blue
double_tap_action: !include ../../shared/popup/rooms/lavabo.yaml

