name: Finalize runtime cleanup 2026-08-19

on:
  push:
    branches:
      - fix/mobile-runtime-tv-curtain-20260819
    paths:
      - .github/workflows/finalize-runtime-cleanup-20260819.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean branch
        uses: actions/checkout@v4
        with:
          ref: fix/mobile-runtime-tv-curtain-20260819
          fetch-depth: 0

      - name: Apply guarded source transforms
        run: node scripts/validation/finalize-runtime-cleanup-20260819.mjs

      - name: Validate classic Sala card syntax
        run: node --check config/www/bruno-ui/cards/bruno-sala-card.js

      - name: Install dashboard dependencies
        working-directory: dashboard-src
        run: npm ci

      - name: Full dashboard validation and build
        working-directory: dashboard-src
        run: npm run check

      - name: Point configuration to new bundle and build copy-only package
        shell: python
        run: |
          from pathlib import Path
          import re, shutil

          dashboard = Path('config/www/dashboard')
          bundles = [p for p in dashboard.glob('bruno-dashboard.*.js') if not p.name.endswith('.map')]
          if len(bundles) != 1:
              raise SystemExit(f'Esperava 1 bundle JS, encontrei: {[p.name for p in bundles]}')
          bundle = bundles[0].name

          cfg = Path('config/configuration.yaml')
          text = cfg.read_text(encoding='utf-8')
          pattern = re.compile(r'^    - /local/dashboard/bruno-dashboard\.[^\s]+\.js$', re.M)
          matches = pattern.findall(text)
          if len(matches) != 1:
              raise SystemExit(f'Esperava 1 bundle ativo em configuration.yaml, encontrei {len(matches)}: {matches}')
          old = matches[0]
          new = f'    # ANTERIOR (rollback runtime consolidado 2026-08-19): {old.strip()}\n    - /local/dashboard/{bundle}'
          cfg.write_text(pattern.sub(new, text, count=1), encoding='utf-8')

          root = Path('_deploy/runtime-cleanup-20260819')
          if root.exists():
              shutil.rmtree(root)
          target = root / 'config'
          (target / 'dashboards' / 'shared' / 'grid-cards').mkdir(parents=True, exist_ok=True)
          (target / 'www' / 'bruno-ui' / 'cards').mkdir(parents=True, exist_ok=True)

          shutil.copy2(cfg, target / 'configuration.yaml')
          shutil.copy2('config/dashboards/ui-lovelace-main.yaml', target / 'dashboards' / 'ui-lovelace-main.yaml')
          shutil.copy2('config/dashboards/shared/grid-cards/bento_comodos_matriz.yaml', target / 'dashboards' / 'shared' / 'grid-cards' / 'bento_comodos_matriz.yaml')
          shutil.copy2('config/www/bruno-ui/cards/bruno-sala-card.js', target / 'www' / 'bruno-ui' / 'cards' / 'bruno-sala-card.js')
          shutil.copytree(dashboard, target / 'www' / 'dashboard')

          (root / 'LEIA-ME.txt').write_text(
              'RUNTIME CONSOLIDADO 2026-08-19 — PACOTE COPY-ONLY\n\n'
              '1. Copie TODO o conteudo da pasta config deste pacote para \\\\192.168.3.154\\config.\n'
              '2. Substitua os arquivos quando solicitado.\n'
              '3. Reinicie o Home Assistant.\n'
              '4. Valide: Home no iPhone, TV/Sala, Hub de Midia, Spotify, Office e cortina.\n\n'
              f'Bundle ativo: {bundle}\n'
              'Nenhum npm, build ou terminal e necessario no PC do usuario.\n',
              encoding='utf-8'
          )
          print(f'FINAL_BUNDLE={bundle}')

      - name: Validate final YAML and whitespace
        run: |
          cd dashboard-src
          npm run check:yaml
          cd ..
          git diff --check

      - name: Remove one-shot automation files
        run: |
          rm .github/workflows/finalize-runtime-cleanup-20260819.yml
          rm scripts/validation/finalize-runtime-cleanup-20260819.mjs

      - name: Commit consolidated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: consolidate mobile runtime and media semantics'
          git push origin HEAD:fix/mobile-runtime-tv-curtain-20260819
