          compress='''import { readdirSync, readFileSync, writeFileSync, statSync } from 'node:fs';
import { join, resolve, extname } from 'node:path';
import { brotliCompressSync, gzipSync, constants } from 'node:zlib';

const root = resolve(import.meta.dirname, '..', '..', 'config', 'www', 'dashboard');
const okExt = new Set(['.js', '.css', '.json', '.svg']);
const files = [];
function walk(dir) {
  for (const name of readdirSync(dir)) {
    const p = join(dir, name);
    if (statSync(p).isDirectory()) walk(p);
    else if (okExt.has(extname(p)) && statSync(p).size >= 1024) files.push(p);
  }
}
walk(root);
for (const p of files) {
  const raw = readFileSync(p);
  writeFileSync(p + '.br', brotliCompressSync(raw, { params: { [constants.BROTLI_PARAM_QUALITY]: 11 } }));
  writeFileSync(p + '.gz', gzipSync(raw, { level: 9 }));
}
console.log(`compressed ${files.length} dashboard assets`);
'''
