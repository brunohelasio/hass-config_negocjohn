# ==========================================================================
# Pacote: office_presence
# Objetivo: camada lógica do Office para presença/PIR tratado como mmWave,
# HASS.Agent do PC e estados semânticos simples do card Bento.
#
# FALLBACK RÁPIDO:
# - Remover/comentar `office_presence: !include packages/office_presence.yaml`
#   em configuration.yaml para voltar ao comportamento anterior.
# - O card Office também mantém comentários ANTERIOR nos pontos alterados.
# ==========================================================================

template:
  - binary_sensor:
      # Mesmo padrao da Sala: movimento recente acende apenas o dot.
      - name: Office Motion Recent
        unique_id: office_motion_recent
        device_class: motion
        icon: mdi:account
        # NOVO (2026-07-12): falha/cache nao pode virar OFF/ON valido.
        availability: >-
          {{ is_state('sensor.office_presence_health', 'ok') }}
        # ANTERIOR (2026-07-03): gating por motion_state atrasava/derrubava o dot
        # ('medium' nao existe no enum do sensor; 'static' ficava de fora; e o
        # motion_state chega em mensagem MQTT separada, atrasando o gate).
        # state: >-
        #   {% set presence = is_state('binary_sensor.sensor_4_in_1_office_presence', 'on') %}
        #   {% set motion = states('sensor.sensor_4_in_1_office_motion_state') | lower %}
        #   {% set motion_known = motion not in ['unknown', 'unavailable', 'none', ''] %}
        #   {{ presence and (motion in ['small', 'medium', 'large'] or not motion_known) }}
        # delay_off:
        #   seconds: 25
        # NOVO (molde unico): presenca imediata = espelho do sensor bruto.
        state: >-
          {{ is_state('binary_sensor.sensor_4_in_1_office_presence', 'on') }}
        delay_off:
          seconds: 5
        attributes:
          source_entity: binary_sensor.sensor_4_in_1_office_presence
          motion_state: "{{ states('sensor.sensor_4_in_1_office_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_office_illuminance') }}"
          semantic_role: passage_indicator
          fallback_note: "Presenca imediata: espelho do sensor bruto, apenas para o dot."

      # Mesmo padrao da Sala: ocupacao real exige permanencia.
      - name: Office Occupancy
        unique_id: office_occupancy
        device_class: occupancy
        icon: mdi:account
        availability: >-
          {{ is_state('sensor.office_presence_health', 'ok') }}
        # ANTERIOR (2026-07-03): gating por motion_state ('medium' inexistente,
        # 'static' excluido — pessoa parada sem PC nunca virava ocupacao).
        # state: >-
        #   {% set presence = is_state('binary_sensor.sensor_4_in_1_office_presence', 'on') %}
        #   {% set motion = states('sensor.sensor_4_in_1_office_motion_state') | lower %}
        #   {% set motion_known = motion not in ['unknown', 'unavailable', 'none', ''] %}
        #   {% set pc_active = is_state('binary_sensor.office_pc_active', 'on') %}
        #   {{ presence and (motion in ['small', 'medium', 'large'] or pc_active or not motion_known) }}
        # delay_on:
        #   seconds: 45
        # delay_off:
        #   seconds: 90
        # ANTERIOR (2026-07-04, trava de contexto — REMOVIDA): com PC/AC/Echo
        # ativos, a ocupacao ficava presa em ON com o office vazio (defeito
        # confirmado no Q. Miguel com o AC).
        # state: >-
        #   {% set presence = is_state('binary_sensor.sensor_4_in_1_office_presence', 'on') %}
        #   {% set pc_active = is_state('binary_sensor.office_pc_active', 'on') %}
        #   {% set ac_on = states('climate.ac_office') in ['cool', 'fan_only', 'dry', 'heat', 'heat_cool', 'auto'] %}
        #   {% set echo_on = is_state('media_player.echo_pop_office', 'playing') %}
        #   {% set context = pc_active or ac_on or echo_on %}
        #   {{ presence or (is_state('binary_sensor.office_occupancy', 'on') and context) }}
        # NOVO: ocupacao = SOMENTE presenca sustentada (padrao validado na Marina).
        state: >-
          {{ is_state('binary_sensor.sensor_4_in_1_office_presence', 'on') }}
        delay_on:
          seconds: 60
        delay_off:
          seconds: 180
        attributes:
          source_entity: binary_sensor.sensor_4_in_1_office_presence
          motion_state: "{{ states('sensor.sensor_4_in_1_office_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_office_illuminance') }}"
          semantic_role: real_occupancy
          fallback_note: "Ocupacao real: somente presenca sustentada (60s liga / 180s solta)."
      - name: Office PC Active
        unique_id: office_pc_active
        icon: mdi:desktop-classic
        state: >-
          {% set session = states('sensor.desktop_melg9vv_office_pc_session_state') %}
          {% set last = as_timestamp(states('sensor.desktop_melg9vv_office_pc_idle_time'), 0) %}
          {% set recent = last > 0 and (as_timestamp(now()) - last) <= 300 %}
          {{ session == 'Unlocked' and recent }}
        attributes:
          session_state: "{{ states('sensor.desktop_melg9vv_office_pc_session_state') }}"
          last_activity: "{{ states('sensor.desktop_melg9vv_office_pc_idle_time') }}"
          active_window: "{{ states('sensor.desktop_melg9vv_office_pc_active_window') }}"
          active_window_process: "{{ state_attr('sensor.desktop_melg9vv_office_pc_active_window', 'processName') }}"
          edge_processes: "{{ states('sensor.desktop_melg9vv_office_pc_edge_active') }}"
          word_processes: "{{ states('sensor.desktop_melg9vv_office_pc_word') }}"

      - name: Office Meeting Active
        unique_id: office_meeting_active
        icon: mdi:video-account
        availability: >-
          {{ is_state('sensor.office_presence_health', 'ok') }}
        state: >-
          {% set session = states('sensor.desktop_melg9vv_office_pc_session_state') %}
          {% set active_window = states('sensor.desktop_melg9vv_office_pc_active_window') | lower %}
          {% set teams = states('sensor.desktop_melg9vv_office_pc_teams_active') | float(0) > 0 %}
          {% set meet = is_state('binary_sensor.desktop_melg9vv_janela_meet', 'on') or ('meet' in active_window) %}
          {% set meeting_app = teams or meet or ('teams' in active_window) or ('zoom' in active_window) %}
          {# Reunião automática exige mais camadas para evitar falso positivo de Teams em segundo plano. #}
          {% set av = is_state('binary_sensor.desktop_melg9vv_office_pc_microphone_active', 'on') and is_state('binary_sensor.desktop_melg9vv_office_pc_webcam_active', 'on') %}
          {{ is_state('binary_sensor.office_occupancy', 'on') and session == 'Unlocked' and meeting_app and av }}
        attributes:
          teams_processes: "{{ states('sensor.desktop_melg9vv_office_pc_teams_active') }}"
          meet_window: "{{ states('binary_sensor.desktop_melg9vv_janela_meet') }}"
          microphone: "{{ states('binary_sensor.desktop_melg9vv_office_pc_microphone_active') }}"
          webcam: "{{ states('binary_sensor.desktop_melg9vv_office_pc_webcam_active') }}"
          av_requirement: "microphone_and_webcam"
          active_window: "{{ states('sensor.desktop_melg9vv_office_pc_active_window') }}"

      - name: Office Working Active
        unique_id: office_working_active
        icon: mdi:briefcase
        availability: >-
          {{ is_state('sensor.office_presence_health', 'ok') }}
        state: >-
          {{ is_state('binary_sensor.office_occupancy', 'on') and is_state('binary_sensor.office_pc_active', 'on') }}
        attributes:
          pc_active: "{{ states('binary_sensor.office_pc_active') }}"
          motion_recent: "{{ states('binary_sensor.office_motion_recent') }}"
          occupancy: "{{ states('binary_sensor.office_occupancy') }}"
          motion_state: "{{ states('sensor.sensor_4_in_1_office_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_office_illuminance') }}"
          active_window: "{{ states('sensor.desktop_melg9vv_office_pc_active_window') }}"

  - sensor:
      - name: Office Semantic State
        unique_id: office_semantic_state
        # ANTERIOR (2026-07-04): os textos seguiam apenas ocupacao/working/meeting —
        # com a liberacao longa da ocupacao, o texto ficava visivel depois do dot
        # apagar. NOVO: guard de presenca ativa (motion_recent) em todos os niveis;
        # a entidade office_occupancy mantem a liberacao longa para automacoes.
        icon: >-
          {% set present = is_state('binary_sensor.office_motion_recent', 'on') %}
          {% if present and is_state('binary_sensor.office_meeting_active', 'on') %}
            mdi:video-account
          {% elif present and is_state('binary_sensor.office_working_active', 'on') %}
            mdi:briefcase
          {% elif present and is_state('binary_sensor.office_occupancy', 'on') %}
            mdi:account
          {% else %}
            mdi:desk
          {% endif %}
        state: >-
          {% set present = is_state('binary_sensor.office_motion_recent', 'on') %}
          {% if present and is_state('binary_sensor.office_meeting_active', 'on') %}
            meeting
          {% elif present and is_state('binary_sensor.office_working_active', 'on') %}
            working
          {% elif present and is_state('binary_sensor.office_occupancy', 'on') %}
            occupied
          {% else %}
            none
          {% endif %}
        attributes:
          display: >-
            {% set present = is_state('binary_sensor.office_motion_recent', 'on') %}
            {% if present and is_state('binary_sensor.office_meeting_active', 'on') %}
              Em reunião
            {% elif present and is_state('binary_sensor.office_working_active', 'on') %}
              Trabalhando
            {% elif present and is_state('binary_sensor.office_occupancy', 'on') %}
              Ocupado
            {% else %}

            {% endif %}
          priority: >-
            {% set present = is_state('binary_sensor.office_motion_recent', 'on') %}
            {% if present and is_state('binary_sensor.office_meeting_active', 'on') %}3
            {% elif present and is_state('binary_sensor.office_working_active', 'on') %}2
            {% elif present and is_state('binary_sensor.office_occupancy', 'on') %}1
            {% else %}0
            {% endif %}
          motion_recent: "{{ states('binary_sensor.office_motion_recent') }}"
          occupancy: "{{ states('binary_sensor.office_occupancy') }}"
          motion_state: "{{ states('sensor.sensor_4_in_1_office_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_office_illuminance') }}"
          pc_active: "{{ states('binary_sensor.office_pc_active') }}"
          working: "{{ states('binary_sensor.office_working_active') }}"
          meeting: "{{ states('binary_sensor.office_meeting_active') }}"
          active_window: "{{ states('sensor.desktop_melg9vv_office_pc_active_window') }}"

      # ANTERIOR: sensor.office_active considerava apenas luzes, switch.macbook e AC.
      # NOVO: mantém compatibilidade com rooms_base e adiciona presença/semântica.
      - name: Office Active
        unique_id: office_active
        state: >-
          {% set ac_on = states('climate.ac_office') in ['cool', 'fan_only', 'dry', 'heat'] %}
          {% set lights_on = not is_state('light.grupo_luzes_office', 'off') %}
          {% set pc_on = is_state('binary_sensor.office_pc_active', 'on') or is_state('switch.macbook', 'on') %}
          {% if is_state('binary_sensor.office_occupancy', 'on') %}
            occupied
          {% elif lights_on or pc_on or ac_on or is_state('media_player.echo_pop_office', 'playing') %}
            yes
          {% else %}
            no
          {% endif %}
        icon: "{{ iif(this.state == 'no', 'mdi:thumb-down', 'mdi:thumb-up') }}"
        attributes:
          semantic_state: "{{ states('sensor.office_semantic_state') }}"
          semantic_display: "{{ state_attr('sensor.office_semantic_state', 'display') }}"
          motion_recent: "{{ states('binary_sensor.office_motion_recent') }}"
          occupancy: "{{ states('binary_sensor.office_occupancy') }}"
          motion_state: "{{ states('sensor.sensor_4_in_1_office_motion_state') }}"
          illuminance: "{{ states('sensor.sensor_4_in_1_office_illuminance') }}"
          pc_active: "{{ states('binary_sensor.office_pc_active') }}"
          working: "{{ states('binary_sensor.office_working_active') }}"
          meeting: "{{ states('binary_sensor.office_meeting_active') }}"
          session_state: "{{ states('sensor.desktop_melg9vv_office_pc_session_state') }}"
          last_activity: "{{ states('sensor.desktop_melg9vv_office_pc_idle_time') }}"
          active_window: "{{ states('sensor.desktop_melg9vv_office_pc_active_window') }}"
          microphone_active: "{{ states('binary_sensor.desktop_melg9vv_office_pc_microphone_active') }}"
          webcam_active: "{{ states('binary_sensor.desktop_melg9vv_office_pc_webcam_active') }}"
          teams_processes: "{{ states('sensor.desktop_melg9vv_office_pc_teams_active') }}"
          meet_window: "{{ states('binary_sensor.desktop_melg9vv_janela_meet') }}"
          lights_on: >-
            {%- set light = expand('light.grupo_luzes_office') | selectattr('state', 'eq', 'on') | map(attribute='name') | list %}
            {{- light }}
          lights_on_count: >-
            {{ expand('light.grupo_luzes_office') | selectattr('state', 'eq', 'on') | list | count }}
